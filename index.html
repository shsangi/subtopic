<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<meta name="theme-color" content="#0b0b0d">
<title>Topic Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:      #0b0b0d;
  --bg-1:    #111114;
  --bg-2:    #17171b;
  --bg-3:    #1e1e23;
  --line:    #26262c;
  --line-2:  #333339;

  --white:   #ffffff;
  --white-2: #e4e4e8;

  --accent:  #7c93ff;
  --accent-2:#a5b4fc;
  --accent-bg: rgba(124,147,255,0.12);

  --green:   #4ade80;
  --green-bg:rgba(74,222,128,0.12);

  --amber:   #fbbf24;
  --amber-bg:rgba(251,191,36,0.12);

  --red:     #f87171;
  --red-bg:  rgba(248,113,113,0.12);

  --r-sm: 6px;
  --r:    9px;
  --r-lg: 12px;

  --shadow: 0 1px 3px rgba(0,0,0,0.5);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  --hdr-h: 56px;
}

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
body.locked{ overflow: hidden; }

button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }

/* ============ HEADER ============ */
.header{
  position: sticky; top:0; z-index:100;
  height: var(--hdr-h);
  background: rgba(11,11,13,0.85);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 20px;
}
.header-inner{
  max-width: 1360px; width:100%; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px;
}

.brand{ display:flex; align-items:center; gap:12px; min-width:0; }

.icon-btn{
  width:36px; height:36px; border-radius:9px;
  display:grid; place-items:center;
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--white-2);
  font-size: 14px;
  flex-shrink: 0;
  transition: all 0.15s ease;
  position: relative;
}
.icon-btn:hover{
  background: var(--bg-3);
  color: #fff;
  border-color: var(--line-2);
}
.icon-btn.active{
  background: var(--accent-bg);
  color: var(--accent-2);
  border-color: rgba(124,147,255,0.4);
}
.icon-btn .badge{
  position:absolute; top:-4px; right:-4px;
  min-width:17px; height:17px; padding:0 5px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 10px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
  line-height: 1;
}
.icon-btn .badge.show{ display: flex; }

.brand-text{ display:flex; flex-direction:column; min-width:0; line-height:1.2; }
.brand-title{
  font-size: 14px; font-weight: 700;
  color: #fff;
  white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 8px;
  letter-spacing: -0.01em;
}
.brand-title .pill{
  font-size: 11px; font-weight: 600;
  background: var(--accent-bg); color: var(--accent-2);
  border: 1px solid rgba(124,147,255,0.3);
  padding: 2px 8px; border-radius: 20px;
}
.brand-sub{
  font-size: 11.5px; color: var(--white-2);
  font-weight: 500;
}

.header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

.btn{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600;
  transition: all 0.15s ease;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn i{ font-size: 11.5px; }

.btn-ghost{
  color: var(--white);
  background: var(--bg-2);
  border-color: var(--line);
}
.btn-ghost:hover{
  background: var(--bg-3);
  border-color: var(--line-2);
}

.btn-primary{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover{ background: #6a82f5; }

/* ============ CONTAINER ============ */
.container{
  max-width: 1360px;
  margin: 0 auto;
  padding: 20px;
}

/* ============ CHIPS ============ */
.chips-row{
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px; padding: 0 2px 14px;
}
.chips-row:empty{ display: none; }
.chip{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 8px 5px 12px;
  border-radius: 20px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600;
  color: var(--white);
  max-width: 100%;
}
.chip .chip-ic{ font-size: 10px; color: var(--accent-2); }
.chip .chip-txt{
  max-width: 180px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.chip .x{
  width: 16px; height: 16px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--white-2); font-size: 9px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.chip .x:hover{ background: var(--red-bg); color: var(--red); }
.chip.clear{
  background: var(--red-bg); color: var(--red);
  border-color: rgba(248,113,113,0.3);
  cursor: pointer; padding: 5px 12px;
}
.chip.clear:hover{ background: var(--red); color: #fff; }

/* ============ STATS ============ */
.stats{
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 10px; margin-bottom: 16px;
}
.stat{
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  transition: border-color 0.15s ease;
}
.stat:hover{ border-color: var(--line-2); }
.stat-ic{
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px;
  background: var(--bg-3);
  color: var(--white-2);
  flex-shrink: 0;
}
.stat.blue .stat-ic{ background: var(--accent-bg); color: var(--accent-2); }
.stat.green .stat-ic{ background: var(--green-bg); color: var(--green); }
.stat.amber .stat-ic{ background: var(--amber-bg); color: var(--amber); }

.stat-body{ line-height: 1.2; min-width: 0; }
.stat-label{
  font-size: 11px; font-weight: 600;
  color: var(--white-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.stat-value{
  font-size: 18px; font-weight: 700;
  color: #fff;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat.green .stat-value{ color: var(--green); }
.stat.amber .stat-value{ color: var(--amber); }
.stat.blue .stat-value{ color: var(--accent-2); }

/* ============ RESULTS META ============ */
.meta{
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px 12px;
  font-size: 13px; font-weight: 500;
  color: var(--white);
}
.meta .strong{ font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.meta .scope{ color: var(--white-2); }

/* ============ CARDS ============ */
.cards{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}
.card{
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative;
  transition: border-color 0.15s ease, transform 0.15s ease;
  min-width: 0;
}
.card::before{
  content: '';
  position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 3px; border-radius: 3px;
  background: var(--line-2);
  transition: background 0.2s ease;
}
.card.done::before{ background: var(--green); }
.card.pending::before{ background: var(--amber); }
.card.pending{ cursor: pointer; }
.card:hover{ border-color: var(--line-2); transform: translateY(-1px); }

.card-top{
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; min-width: 0;
}
.card-title-block{ min-width: 0; flex: 1; }
.card-srno{
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px; font-weight: 600;
  color: var(--white-2);
  background: var(--bg-3);
  padding: 2px 7px; border-radius: 4px;
  margin-bottom: 7px;
  letter-spacing: 0.02em;
}
.card-title{
  font-size: 16px; font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.3;
  display: inline-flex; align-items: center; gap: 7px;
  transition: color 0.15s ease;
  word-break: break-word;
}
.card-title:hover{ color: var(--accent-2); }
.card-title i{
  font-size: 10px; opacity: 0.5;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.card-title:hover i{ opacity: 1; transform: translate(1px,-1px); }

.card-badges{
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 5px; flex-shrink: 0; max-width: 45%;
}
.badge{
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
  border: 1px solid transparent;
}
.badge-job{
  background: var(--accent-bg); color: var(--accent-2);
  border-color: rgba(124,147,255,0.3);
}
.badge-date{
  background: transparent; color: var(--white-2);
  padding: 0; border: none;
  font-weight: 500;
}
.badge-date i{ font-size: 9px; }

.card-meta{ display: flex; flex-direction: column; gap: 6px; }
.meta-line{
  display: flex; align-items: center; gap: 8px;
  color: var(--white);
  font-size: 13.5px;
  flex-wrap: wrap;
}
.meta-line i{ color: var(--white-2); font-size: 12px; width: 14px; text-align: center; flex-shrink: 0; }
.meta-line .value{ color: var(--white); font-weight: 500; word-break: break-word; }
.meta-line .value.bold{ color: #fff; font-weight: 600; }
.count-chip{
  font-size: 10.5px; font-weight: 700;
  background: var(--bg-3); color: var(--white-2);
  padding: 1px 7px; border-radius: 20px;
  font-variant-numeric: tabular-nums;
}

/* ============ PROGRESS ============ */
.prog-wrap{ display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.prog-head{
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 600;
  color: var(--white-2);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.prog-head .pct{
  color: #fff;
  font-weight: 700;
  font-size: 12.5px;
  text-transform: none;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.prog-track{
  height: 6px;
  background: var(--bg-3);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill{
  height: 100%; border-radius: 3px;
  background: var(--amber);
  transition: width 0.4s ease;
}
.prog-fill.mid{ background: var(--accent); }
.prog-fill.full{ background: var(--green); }

/* ============ ACTIONS ============ */
.card-foot{
  display: flex; justify-content: flex-end;
  gap: 6px; flex-wrap: wrap;
  padding-top: 4px;
}
.actions{ display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.action{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 6px 11px; border-radius: var(--r-sm);
  transition: all 0.15s ease;
  white-space: nowrap;
  border: 1px solid transparent;
}
.action i{ font-size: 10.5px; }

.action-read{
  background: var(--bg-3);
  color: var(--white);
  border-color: var(--line);
}
.action-read:hover{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.action-done{
  background: var(--green-bg);
  color: var(--green);
  border-color: rgba(74,222,128,0.3);
}
.action-done:hover{
  background: var(--green);
  color: #0b0b0d;
  border-color: var(--green);
}

.action-pending{
  background: var(--amber-bg);
  color: var(--amber);
  border-color: rgba(251,191,36,0.3);
}
.action-pending:hover{
  background: var(--amber);
  color: #0b0b0d;
  border-color: var(--amber);
}

.action-sol{
  background: var(--bg-3);
  color: var(--white-2);
  border-color: var(--line);
  max-width: 140px;
}
.action-sol:hover{
  border-color: var(--line-2);
  color: #fff;
}
.action-sol .lbl{ overflow: hidden; text-overflow: ellipsis; max-width: 92px; }

/* ============ LOAD MORE ============ */
.load-wrap{
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding: 32px 20px 20px;
}
.load-count{
  font-size: 13px; font-weight: 500;
  color: var(--white-2);
  font-variant-numeric: tabular-nums;
}
.load-count .n{ color: #fff; font-weight: 700; }
.load-btn{
  display: inline-flex; align-items: center; gap: 9px;
  padding: 12px 24px;
  border-radius: var(--r);
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  color: #fff;
  font-size: 14px; font-weight: 600;
  transition: all 0.15s ease;
}
.load-btn:hover{
  background: var(--bg-3);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.load-btn i{ font-size: 12px; }
.all-loaded{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px;
  border-radius: 30px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  color: var(--white-2);
  font-size: 13px; font-weight: 600;
}
.all-loaded i{ color: var(--green); font-size: 12px; }

/* ============ STATE ============ */
.state{
  grid-column: 1 / -1;
  padding: 60px 24px;
  text-align: center;
  background: var(--bg-1);
  border: 1px dashed var(--line-2);
  border-radius: var(--r-lg);
  color: var(--white);
  font-size: 14px;
}
.state i.big{ font-size: 26px; color: var(--white-2); margin-bottom: 12px; display: block; }
.state .ttl{ font-weight: 600; color: #fff; margin-bottom: 4px; font-size: 15px; }
.state .sub{ font-size: 13px; color: var(--white-2); }

.skel{
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.sk{
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--bg-3) 25%, #2a2a30 50%, var(--bg-3) 75%);
  background-size: 200% 100%;
  animation: sk 1.5s ease-in-out infinite;
}
.sk.w40{ width: 40%; }
.sk.w60{ width: 60%; }
.sk.w80{ width: 80%; }
.sk.h18{ height: 18px; }
@keyframes sk{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

/* ============ FAB ============ */
.fabs{
  position: fixed; bottom: 20px; left: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 500;
}
.fab{
  width: 42px; height: 42px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  color: var(--white-2);
  font-size: 14px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.fab:hover{
  background: var(--bg-3);
  color: #fff;
  transform: translateY(-2px);
}
.fab:active{ transform: translateY(0) scale(0.96); }
.fab.hidden{ opacity: 0; pointer-events: none; transform: scale(0.7); }
.fab-primary{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.fab-primary:hover{ background: #6a82f5; color: #fff; }
.fab-primary.loading{ pointer-events: none; }
.fab-primary.loading i{ animation: spin 0.8s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ============ OVERLAY / POPUP ============ */
.overlay{
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-start; justify-content: center;
  padding: 60px 20px 20px;
  overflow-y: auto;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.overlay.open{ display: flex; opacity: 1; }

.popup{
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  width: 100%; max-width: 720px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(12px);
  transition: transform 0.2s ease;
}
.overlay.open .popup{ transform: translateY(0); }
.popup.wide{ max-width: 880px; }

.popup-head{
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
}
.popup-head-txt{ flex: 1; min-width: 0; }
.popup-title{
  font-size: 16px; font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 9px;
  word-break: break-word;
}
.popup-title i{ color: var(--accent-2); font-size: 14px; }
.popup-sub{
  font-size: 12.5px; color: var(--white-2);
  margin-top: 3px; font-weight: 500;
}
.popup-close{
  width: 30px; height: 30px; border-radius: 7px;
  display: grid; place-items: center;
  color: var(--white-2); font-size: 13px;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.popup-close:hover{ background: var(--red-bg); color: var(--red); }

.popup-body{
  padding: 20px;
  overflow-y: auto;
  max-height: calc(100vh - 200px);
}

.popup-foot{
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between;
  gap: 8px; flex-wrap: wrap; align-items: center;
}

/* ============ SEARCH ============ */
.search{ position: relative; margin-bottom: 16px; }
.search i.ic{
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--white-2); font-size: 13px;
  pointer-events: none;
}
.search input{
  width: 100%;
  padding: 11px 40px 11px 38px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--bg-2);
  font-size: 14px; font-weight: 500;
  color: #fff;
  outline: none;
  transition: all 0.15s ease;
}
.search input::placeholder{ color: var(--white-2); font-weight: 500; }
.search input:focus{ border-color: var(--accent); background: var(--bg-2); }
.search .clr{
  position: absolute; right: 8px; top: 50%;
  transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  color: var(--white-2); font-size: 13px;
  transition: all 0.12s ease;
}
.search .clr:hover{ background: var(--red-bg); color: var(--red); }
.search .clr.show{ display: flex; }

/* ============ FILTER SECTIONS ============ */
.fsect{ margin-bottom: 18px; }
.fsect:last-child{ margin-bottom: 0; }
.fsect-title{
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--white-2);
  margin-bottom: 10px;
}
.fgrid{ display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }

.fgroup{ min-width: 0; }
.flabel{
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--white-2);
  margin-bottom: 7px;
}
.fcount{
  font-size: 11px; font-weight: 700;
  background: var(--bg-3); color: var(--white-2);
  padding: 1px 8px; border-radius: 20px;
  letter-spacing: 0; text-transform: none;
  font-variant-numeric: tabular-nums;
}

/* Multi-select */
.ms{ position: relative; }
.ms-trig{
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--bg-2);
  font-size: 14px; font-weight: 500;
  color: #fff;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; min-height: 40px;
  transition: all 0.15s ease;
  user-select: none;
}
.ms-trig:hover{ border-color: var(--line-2); }
.ms-trig.open{ border-color: var(--accent); }
.ms-trig .ph{ color: var(--white-2); font-weight: 500; }
.ms-trig .sel{
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--accent-2); font-weight: 600;
}
.ms-trig i.ch{ font-size: 11px; color: var(--white-2); transition: transform 0.2s ease; }
.ms-trig.open i.ch{ transform: rotate(180deg); }

.ms-drop{
  position: absolute;
  top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  max-height: 260px; overflow-y: auto;
  z-index: 200;
  display: none; padding: 6px;
}
.ms-drop.open{ display: block; }
.ms-srch{
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  color: #fff;
  background: var(--bg);
  outline: none;
  margin-bottom: 4px;
}
.ms-srch::placeholder{ color: var(--white-2); }
.ms-srch:focus{ border-color: var(--accent); }
.ms-opt{
  display: flex; align-items: center; gap: 9px;
  padding: 8px 9px;
  border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 500;
  color: var(--white);
  cursor: pointer;
  transition: background 0.12s ease;
  word-break: break-word;
}
.ms-opt:hover{ background: var(--bg-3); color: #fff; }
.ms-opt.sel{ background: var(--accent-bg); color: var(--accent-2); }
.ms-opt .ck{
  width: 15px; height: 15px; border-radius: 4px;
  border: 1.5px solid var(--line-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.12s ease;
}
.ms-opt .ck i{ font-size: 8px; color: #fff; opacity: 0; }
.ms-opt.sel .ck{ background: var(--accent); border-color: var(--accent); }
.ms-opt.sel .ck i{ opacity: 1; }

.ms-acts{
  display: flex; gap: 6px;
  padding: 6px 4px 2px;
  border-top: 1px solid var(--line);
  margin-top: 4px;
}
.ms-acts button{
  flex: 1; padding: 7px;
  border-radius: var(--r-sm);
  background: var(--bg-3);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 600;
  color: var(--white);
  transition: all 0.12s ease;
}
.ms-acts button:hover{ background: var(--bg-2); border-color: var(--line-2); }

/* Segmented status */
.seg{
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px; gap: 2px;
}
.seg-btn{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--white-2);
  transition: all 0.15s ease;
  user-select: none;
}
.seg-btn i{ font-size: 11px; }
.seg-btn:hover{ color: #fff; }
.seg-btn.active{
  background: var(--bg-3);
  color: #fff;
}
.seg-btn.active[data-status="covered"]{
  background: var(--green-bg);
  color: var(--green);
}
.seg-btn.active[data-status="pending"]{
  background: var(--amber-bg);
  color: var(--amber);
}

/* Reset */
.btn-reset{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px;
  border-radius: var(--r);
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-size: 13px; font-weight: 600;
  color: var(--white);
  transition: all 0.15s ease;
}
.btn-reset:hover{
  border-color: rgba(248,113,113,0.5);
  color: var(--red);
  background: var(--red-bg);
}
.btn-reset i{ font-size: 11px; }

/* ============ REPORT TREE ============ */
.empty{
  padding: 40px 20px; text-align: center;
  color: var(--white-2); font-size: 14px;
}
.empty i{ font-size: 28px; display: block; margin-bottom: 10px; }

.tree{ display: flex; flex-direction: column; gap: 8px; }

.tr-job{
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  transition: border-color 0.15s ease;
}
.tr-job.exp{ border-color: rgba(124,147,255,0.3); }
.tr-head{
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s ease;
}
.tr-head:hover{ background: var(--bg-3); }
.tr-toggle{
  width: 22px; height: 22px; border-radius: 6px;
  display: grid; place-items: center;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--white-2);
  font-size: 10px;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.tr-job.exp .tr-toggle{
  background: var(--accent-bg); color: var(--accent-2);
  border-color: rgba(124,147,255,0.3);
}
.tr-toggle i{ transition: transform 0.2s ease; }
.tr-job.exp .tr-toggle i{ transform: rotate(90deg); }

.tr-info{ flex: 1; min-width: 0; }
.tr-name{
  font-size: 14.5px; font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  word-break: break-word;
}
.tr-meta{
  font-size: 12px; color: var(--white-2);
  font-weight: 500;
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-top: 2px;
}
.tr-meta .it{ display: inline-flex; align-items: center; gap: 4px; }
.tr-meta i{ font-size: 10px; }
.tr-meta .done-txt{ color: var(--green); }
.tr-meta .pend-txt{ color: var(--amber); }

.tr-pct{ display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.mini-bar{
  width: 60px; height: 6px; border-radius: 3px;
  background: var(--bg);
  overflow: hidden;
}
.mini-fill{
  height: 100%; border-radius: 2px;
  background: var(--amber);
  transition: width 0.4s ease;
}
.mini-fill.mid{ background: var(--accent); }
.mini-fill.full{ background: var(--green); }
.mini-pct{
  font-size: 12.5px; font-weight: 700;
  color: #fff;
  font-variant-numeric: tabular-nums;
  min-width: 36px; text-align: right;
}

.tr-body{
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease;
  background: rgba(0,0,0,0.15);
}
.tr-job.exp .tr-body{
  max-height: 8000px;
  border-top: 1px solid var(--line);
}
.subs{
  padding: 8px 12px 12px;
  display: flex; flex-direction: column; gap: 6px;
}

.tr-sub{
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.tr-sub.exp{ border-color: rgba(74,222,128,0.25); }
.tr-sub-head{
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  cursor: pointer; user-select: none;
  transition: background 0.12s ease;
}
.tr-sub-head:hover{ background: var(--bg-3); }
.tr-sub-info{ flex: 1; min-width: 0; }
.tr-sub-name{
  font-size: 13.5px; font-weight: 600;
  color: #fff;
  word-break: break-word;
}
.tr-sub-meta{
  font-size: 11.5px; color: var(--white-2);
  font-weight: 500;
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-top: 1px;
}
.tr-sub-meta i{ font-size: 9px; }

.tr-sub-body{
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease;
  background: rgba(0,0,0,0.15);
}
.tr-sub.exp .tr-sub-body{
  max-height: 4000px;
  border-top: 1px solid var(--line);
}
.tops{
  padding: 8px 10px 10px;
  display: flex; flex-direction: column; gap: 4px;
}
.tr-top{
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.tr-top.exp{ border-color: rgba(251,191,36,0.22); }
.tr-top-head{
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px;
  cursor: pointer; user-select: none;
  transition: background 0.12s ease;
}
.tr-top-head:hover{ background: var(--bg-3); }
.tr-top-info{ flex: 1; min-width: 0; }
.tr-top-name{
  font-size: 13px; font-weight: 600;
  color: #fff;
  word-break: break-word;
}
.tr-top-meta{
  font-size: 11px; color: var(--white-2);
  font-weight: 500; margin-top: 1px;
}
.tr-top-body{
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease;
  background: rgba(0,0,0,0.18);
}
.tr-top.exp .tr-top-body{
  max-height: 3000px;
  border-top: 1px solid var(--line);
}
.subtops{
  padding: 6px 8px 8px;
  display: flex; flex-direction: column; gap: 3px;
}
.tr-subtop{
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: 12.5px;
  transition: background 0.15s ease;
}
.tr-subtop:hover{ background: var(--bg-2); }
.tr-subtop .dot{
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--amber);
  flex-shrink: 0;
}
.tr-subtop .dot.ok{ background: var(--green); }
.tr-subtop .nm{
  flex: 1; min-width: 0;
  color: var(--white);
  font-weight: 500;
  word-break: break-word;
}
.tr-subtop .sr{
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 600;
  color: var(--white-2);
  padding: 1px 6px; border-radius: 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  flex-shrink: 0;
}

/* ============ NOTES MODAL ============ */
.modal-overlay{
  position: fixed; inset: 0; z-index: 1100;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.modal-overlay.open{ display: flex; opacity: 1; }
.modal{
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  width: 100%; max-width: 820px; max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(12px);
  transition: transform 0.2s ease;
}
.modal-overlay.open .modal{ transform: translateY(0); }

.modal-head{
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
}
.modal-head-txt{ flex: 1; min-width: 0; }
.modal-title{
  font-size: 16px; font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 9px;
  word-break: break-word;
}
.modal-title i{ color: var(--accent-2); font-size: 14px; }
.modal-sub{
  font-size: 12.5px; color: var(--white-2);
  font-weight: 500; margin-top: 3px;
}

.modal-body{
  padding: 22px 24px;
  overflow-y: auto;
  flex: 1;
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--white);
  background: var(--bg);
}
.modal-body::-webkit-scrollbar{ width: 10px; }
.modal-body::-webkit-scrollbar-track{ background: transparent; }
.modal-body::-webkit-scrollbar-thumb{
  background: var(--line-2); border-radius: 8px;
  border: 3px solid var(--bg);
}
.modal-body h1{
  font-size: 22px; font-weight: 700; color: #fff;
  margin: 22px 0 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  line-height: 1.25;
}
.modal-body h1:first-child{ margin-top: 0; }
.modal-body h2{ font-size: 18px; font-weight: 700; color: #fff; margin: 20px 0 10px; }
.modal-body h3{ font-size: 15.5px; font-weight: 700; color: #fff; margin: 16px 0 8px; }
.modal-body h4{ font-size: 13.5px; font-weight: 700; color: #fff; margin: 14px 0 6px; letter-spacing: 0.03em; text-transform: uppercase; }
.modal-body p{ margin: 10px 0; }
.modal-body strong{ font-weight: 700; color: #fff; }
.modal-body em{ font-style: italic; color: var(--white); }
.modal-body ul,.modal-body ol{ margin: 10px 0 10px 22px; }
.modal-body li{ margin: 5px 0; }
.modal-body code{
  background: var(--bg-3); color: #f0abfc;
  padding: 2px 6px; border-radius: 4px;
  font-family: var(--mono); font-size: 13px;
}
.modal-body pre{
  background: #000; color: #e5e5e5;
  padding: 14px 16px; border-radius: var(--r);
  overflow-x: auto; margin: 14px 0;
  font-size: 13px; line-height: 1.6;
  border: 1px solid var(--line);
}
.modal-body pre code{ background: transparent; color: inherit; padding: 0; font-size: inherit; }
.modal-body blockquote{
  border-left: 3px solid var(--accent);
  background: var(--accent-bg);
  padding: 10px 16px; margin: 14px 0;
  border-radius: 0 var(--r) var(--r) 0;
  color: var(--white);
  font-style: italic;
}
.modal-body hr{ border: none; border-top: 1px solid var(--line); margin: 20px 0; }
.modal-body a{ color: var(--accent-2); text-decoration: underline; word-break: break-word; }
.modal-body table{
  width: 100%; border-collapse: separate; border-spacing: 0;
  margin: 14px 0; font-size: 13.5px;
  border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden;
}
.modal-body thead{ background: var(--bg-3); }
.modal-body th{
  padding: 10px 14px; text-align: left;
  font-weight: 700; font-size: 11.5px;
  color: #fff;
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--line);
}
.modal-body td{
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.modal-body tbody tr:last-child td{ border-bottom: none; }
.modal-body tbody tr:hover{ background: rgba(255,255,255,0.02); }

.modal-foot{
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end;
  gap: 8px; flex-wrap: wrap;
}

/* ============ TOAST ============ */
.toast{
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--bg-3);
  color: #fff;
  padding: 12px 18px;
  border-radius: var(--r);
  font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  display: flex; align-items: center; gap: 9px;
  max-width: calc(100vw - 32px);
  pointer-events: none;
  opacity: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
}
.toast.show{ transform: translateX(-50%) translateY(0); opacity: 1; }
.toast i{ color: var(--green); font-size: 13px; }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px){
  .stats{ grid-template-columns: repeat(2, 1fr); }
  .fgrid{ grid-template-columns: 1fr; }
}
@media (max-width: 640px){
  :root{ --hdr-h: 54px; }
  body{ font-size: 13.5px; }
  .header{ padding: 0 14px; }
  .container{ padding: 14px; }
  .stats{ gap: 8px; margin-bottom: 12px; }
  .stat{ padding: 10px 12px; gap: 10px; }
  .stat-ic{ width: 28px; height: 28px; font-size: 12px; }
  .stat-value{ font-size: 16px; }
  .cards{ grid-template-columns: 1fr; gap: 10px; }
  .card{ padding: 14px 16px; }
  .card-title{ font-size: 15px; }
  .fabs{ bottom: 14px; left: 14px; gap: 6px; }
  .fab{ width: 40px; height: 40px; border-radius: 10px; font-size: 13px; }
  .overlay{ padding: 20px 12px; }
  .popup-head{ padding: 16px 18px; }
  .popup-body{ padding: 16px 18px; max-height: calc(100vh - 160px); }
  .popup-foot{ padding: 12px 18px; }
  .modal-head{ padding: 14px 18px; }
  .modal-body{ padding: 18px 20px; font-size: 14px; }
  .modal-body h1{ font-size: 19px; }
  .modal-body h2{ font-size: 16px; }
  .modal-foot{ padding: 12px 18px; }
  .btn .hide-sm{ display: none; }
  .mini-bar{ width: 44px; }
  .tr-subtop .sr{ display: none; }
}
@media (max-width: 400px){
  .brand-sub{ display: none; }
  .brand-title{ font-size: 13px; }
  .stat-value{ font-size: 15px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <button class="icon-btn" id="filterBtn" title="Filters">
        <i class="fas fa-sliders"></i>
        <span class="badge" id="filterBadge">0</span>
      </button>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">Topic Tracker</div>
        <div class="brand-sub">Job preparation dashboard</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="reportBtn">
        <i class="fas fa-chart-simple"></i> <span class="hide-sm">Report</span>
      </button>
      <a href="https://docs.google.com/spreadsheets/d/1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc/edit?gid=0#gid=0"
         class="btn btn-ghost" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-table"></i> <span class="hide-sm">Sheet</span>
      </a>
    </div>
  </div>
</header>

<div class="container">
  <div class="chips-row" id="chipsRow"></div>

  <div class="stats">
    <div class="stat blue">
      <div class="stat-ic"><i class="fas fa-layer-group"></i></div>
      <div class="stat-body">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
    </div>
    <div class="stat green">
      <div class="stat-ic"><i class="fas fa-circle-check"></i></div>
      <div class="stat-body">
        <div class="stat-label">Done</div>
        <div class="stat-value" id="statCovered">0</div>
      </div>
    </div>
    <div class="stat amber">
      <div class="stat-ic"><i class="fas fa-clock"></i></div>
      <div class="stat-body">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="statPending">0</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-ic"><i class="fas fa-book"></i></div>
      <div class="stat-body">
        <div class="stat-label">Subjects</div>
        <div class="stat-value" id="statSubjects">0</div>
      </div>
    </div>
  </div>

  <div class="meta" id="resultsMeta" style="display:none;">
    <span><span class="strong" id="resultCount">0</span> <span id="resultLabel">topics</span></span>
    <span class="scope" id="resultScope"></span>
  </div>

  <div id="cardsContainer" class="cards"></div>

  <div class="load-wrap" id="loadMoreWrap" style="display:none;">
    <div class="load-count" id="loadMoreCount"></div>
    <button class="load-btn" id="loadMoreBtn">
      <i class="fas fa-arrow-down"></i>
      <span id="loadMoreBtnText">Load 100 more</span>
    </button>
  </div>

  <div class="load-wrap" id="allLoadedWrap" style="display:none;">
    <div class="all-loaded">
      <i class="fas fa-circle-check"></i>
      <span id="allLoadedText">All topics loaded</span>
    </div>
  </div>
</div>

<!-- FABs -->
<div class="fabs">
  <button class="fab hidden" id="fabScrollTop" title="Scroll top"><i class="fas fa-arrow-up"></i></button>
  <button class="fab hidden" id="fabScrollBottom" title="Scroll bottom"><i class="fas fa-arrow-down"></i></button>
  <button class="fab fab-primary" id="fabRefresh" title="Refresh data"><i class="fas fa-sync-alt"></i></button>
</div>

<!-- FILTER POPUP -->
<div class="overlay" id="filterOverlay">
  <div class="popup" role="dialog">
    <div class="popup-head">
      <div class="popup-head-txt">
        <div class="popup-title"><i class="fas fa-sliders"></i><span>Filters</span></div>
        <div class="popup-sub">Refine topics by search, subject, topic, job, or status</div>
      </div>
      <button class="popup-close" id="filterCloseBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-body">
      <div class="search">
        <i class="fas fa-search ic"></i>
        <input type="text" id="globalSearchInput" placeholder="Search subjects, topics, jobs, notes…" autocomplete="off" spellcheck="false">
        <button class="clr" id="globalSearchClear"><i class="fas fa-times-circle"></i></button>
      </div>

      <div class="fsect">
        <div class="fsect-title"><i class="fas fa-filter"></i>Filter by</div>
        <div class="fgrid">
          <div class="fgroup">
            <label class="flabel">
              <span><i class="fas fa-book" style="margin-right:5px;font-size:10px;"></i>Subject</span>
              <span class="fcount" id="subjectCountHint">0</span>
            </label>
            <div class="ms" id="subjectMultiWrap">
              <div class="ms-trig" id="subjectTrigger">

/* Helpers */
function escapeHtml(u){
  if(u===null||u===undefined) return '';
  return String(u).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function extractFileName(url){
  if(!url || url === '#') return 'sol';
  try{
    let clean = url.split('#')[0].split('?')[0];
    const parts = clean.split('/');
    let last = parts[parts.length-1] || '';
    try{ last = decodeURIComponent(last); }catch(e){}
    if(!last || (last.indexOf('.')===-1 && !/\w/.test(last))) return 'sol';
    if(last.length > 24) last = last.slice(0,21) + '…';
    return last || 'sol';
  }catch(e){ return 'sol'; }
}
function buildJobScopeKey(jobsSet){
  if(!jobsSet || jobsSet.size === 0) return 'ALL';
  return 'JOB::' + Array.from(jobsSet).sort().join('|');
}
function scopedCoverageKey(subject, jobScopeKey){ return subject + '||' + jobScopeKey; }

function matchesGlobalSearch(item, term){
  if(!term || term.trim() === '') return true;
  const q = term.toLowerCase().trim();
  const fields = [
    String(item.srno), String(item.subject), String(item.marks),
    String(item.mainTopic), String(item.subTopic), String(item.displayTopic),
    String(item.job), String(item.lastUpdate),
    String(item.markdownNotes).substring(0,500),
    String(item.url), String(item.solFileName)
  ];
  return fields.some(f => f.toLowerCase().includes(q));
}

function scheduleFastFilterRefresh(){

}

/* CSV */
function parseCSV(t){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<t.length;i++){
    const c=t[i], n=t[i+1];
    if(c === '"'){ if(inQ && n === '"'){ field+='"'; i++; } else inQ=!inQ; }
    else if(c === ',' && !inQ){ row.push(field); field=''; }
    else if((c === '\n' || c === '\r') && !inQ){
      if(c === '\r' && n === '\n') i++;
      row.push(field);
      if(row.length>1 || (row.length===1 && row[0].trim()!=='')) rows.push(row);
      row=[]; field='';
    } else field+=c;
  }
  if(field!=='' || row.length){
    row.push(field);
    if(row.length>1 || (row.length===1 && row[0].trim()!=='')) rows.push(row);
  }
  return rows;
}
function looksLikeMarkdown(text){
  if(!text) return false;
  const t=text.trim();
  if(t.length<15) return false;
  if(t==='—'||t==='-'||t==='N/A'||t==='na'||t==='NA') return false;
  if(/^https?:\/\/\S+$/.test(t)) return false;
  let s=0;
  if(/^#{1,6}\s/m.test(t)) s++;
  if(/\*\*[^*]+\*\*/.test(t)) s++;
  if(/^\s*[-*+]\s+/m.test(t)) s++;
  if(/^\s*\d+\.\s+/m.test(t)) s++;
  if(/^\s*\|.*\|\s*$/m.test(t)) s++;
  if(/```/.test(t)) s++;
  if(/^\s*>\s/m.test(t)) s++;
  if(/\[[^\]]+\]\([^)]+\)/.test(t)) s++;
  return s>=2 || (s>=1 && t.length>100);
}
function mapRowsToObjects(rows){
  if(!rows.length) return [];
  const dataRows=rows.slice(1);
  const out=[];
  const padded=dataRows.map(r=>{ const c=r.slice(); while(c.length<EXPECTED_COLUMNS) c.push(''); return c; });
  for(const row of padded){
    if(row.length<3) continue;
    const srno=(row[0]||'').trim();
    const swm=(row[1]||'').trim();
    const mainTopic=(row[2]||'').trim();
    const subTopic=(row[3]||'').trim();
    const job=(row[4]||'').trim();
    const url=(row[5]||'').trim();
    const solUrl=(row[6]||'').trim();
    const lastUpdate=(row[7]||'').trim();
    const markdownNotes=(row[8]||'').trim();
    let subject=swm, marks='';
    const m=swm.match(/;\s*(\d+)\s*$/);
    if(m){ marks=m[1]; subject=swm.replace(/;\s*\d+\s*$/,'').trim(); }
    const hasUrl = url && url!=='#' && url!=='—' && url.trim()!=='';
    const hasSol = solUrl && solUrl!=='#' && solUrl!=='—' && solUrl.trim()!=='';
    const hasMarkdown = looksLikeMarkdown(markdownNotes);
    const status = (hasUrl||hasSol||hasMarkdown) ? 'covered' : 'pending';
    const displayTopic = subTopic || mainTopic;
    out.push({
      srno: srno||'—', subject: subject||'—', marks: marks||'—',
      mainTopic: mainTopic||'—', subTopic: subTopic||'—',
      displayTopic: displayTopic||'—',
      url: hasUrl ? url : '#', hasUrl,
      solUrl: hasSol ? solUrl : '', hasSol,
      solFileName: hasSol ? extractFileName(solUrl) : '',
      markdownNotes: hasMarkdown ? markdownNotes : '', hasMarkdown,
      status, job: job||'—', lastUpdate: lastUpdate||''
    });
  }
  return out;
}

/* Counts */
function computeCounts(data){
  subjectCounts={}; mainTopicCounts={}; subjectCoverageScoped={};
  const allJobs=new Set();
  data.forEach(item=>{
    if(item.subject && item.subject!=='—') subjectCounts[item.subject]=(subjectCounts[item.subject]||0)+1;
    if(item.mainTopic && item.mainTopic!=='—') mainTopicCounts[item.mainTopic]=(mainTopicCounts[item.mainTopic]||0)+1;
    if(item.job && item.job!=='—') allJobs.add(item.job);
  });
  const scopes=['ALL']; allJobs.forEach(j=>scopes.push('JOB::'+j));
  scopes.forEach(scopeKey=>{
    data.forEach(item=>{
      if(!item.subject||item.subject==='—') return;
      if(scopeKey!=='ALL'){ const jn=scopeKey.slice(5); if(item.job!==jn) return; }
      const k=scopedCoverageKey(item.subject,scopeKey);
      if(!subjectCoverageScoped[k]) subjectCoverageScoped[k]={total:0,done:0};
      subjectCoverageScoped[k].total++;
      if(item.status==='covered') subjectCoverageScoped[k].done++;
    });
  });
}
function getSubjectCoveragePctForScope(subject, jobsSet){
  if(!subject||subject==='—') return 0;
  if(!jobsSet||jobsSet.size<=1){
    const sk=buildJobScopeKey(jobsSet);
    const c=subjectCoverageScoped[scopedCoverageKey(subject,sk)];
    if(!c||c.total===0) return 0;
    return Math.round((c.done/c.total)*100);
  }
  let total=0, done=0;
  rawData.forEach(item=>{
    if(item.subject!==subject) return;
    if(!jobsSet.has(item.job)) return;
    total++; if(item.status==='covered') done++;
  });
  if(total===0) return 0;
  return Math.round((done/total)*100);
}
function getSubjectCountForScope(subject, jobsSet){
  if(!subject||subject==='—') return 0;
  if(!jobsSet||jobsSet.size===0) return subjectCounts[subject]||0;
  let count=0;
  rawData.forEach(item=>{ if(item.subject===subject && jobsSet.has(item.job)) count++; });
  return count;
}

/* Options */
function getAvailableOptions(excludeFilter){
  const aS = excludeFilter==='subject' ? new Set() : selectedSubjects;
  const aT = excludeFilter==='topic'   ? new Set() : selectedTopics;
  const aJ = excludeFilter==='job'     ? new Set() : selectedJobs;
  const subjects=new Set(), topics=new Set(), jobs=new Set();
  rawData.forEach(item=>{
    if(selectedStatuses.size>0 && !selectedStatuses.has(item.status)) return;
    if(!matchesGlobalSearch(item, globalSearchTerm)) return;
    if(aS.size>0 && !aS.has(item.subject)) return;
    if(aT.size>0 && !aT.has(item.displayTopic)) return;
    if(aJ.size>0 && !aJ.has(item.job)) return;
    if(excludeFilter==='subject'){
      if(selectedSubjects.size>0 && !selectedSubjects.has(item.subject)) return;
      if(item.subject && item.subject!=='—') subjects.add(item.subject);
    } else if(excludeFilter==='topic'){
      if(selectedTopics.size>0 && !selectedTopics.has(item.displayTopic)) return;
      if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
    } else if(excludeFilter==='job'){
      if(selectedJobs.size>0 && !selectedJobs.has(item.job)) return;
      if(item.job && item.job!=='—') jobs.add(item.job);
    } else {
      if(item.subject && item.subject!=='—') subjects.add(item.subject);
      if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
      if(item.job && item.job!=='—') jobs.add(item.job);
    }
  });
  return { subjects:Array.from(subjects).sort(), topics:Array.from(topics).sort(), jobs:Array.from(jobs).sort() };
}
function pruneSelections(){
  const a = getAvailableOptions('none');
  Array.from(selectedSubjects).forEach(s=>{ if(!a.subjects.includes(s)) selectedSubjects.delete(s); });
  Array.from(selectedTopics).forEach(t=>{ if(!a.topics.includes(t)) selectedTopics.delete(t); });
  Array.from(selectedJobs).forEach(j=>{ if(!a.jobs.includes(j)) selectedJobs.delete(j); });
}

/* Multi-select */
function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch){
  const dropdown = container.querySelector('.ms-drop');
  const trigger = container.querySelector('.ms-trig');
  const placeholder = container.querySelector('.ph');
  function closeDropdown(){ dropdown.classList.remove('open'); trigger.classList.remove('open'); }
  if(!trigger.dataset.listenerAttached){
    trigger.dataset.listenerAttached = '1';
    trigger.addEventListener('click', (e)=>{
      e.stopPropagation();
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.ms-drop.open').forEach(d=>d.classList.remove('open'));
      document.querySelectorAll('.ms-trig.open').forEach(t=>t.classList.remove('open'));
      if(!isOpen){
        dropdown.classList.add('open'); trigger.classList.add('open');
        const latest = container._latestRebuild;
        if(latest && latest._render){
          const si = dropdown.querySelector('.ms-srch');
          if(si){ si.value=''; setTimeout(()=>si.focus(),50); }
          latest._render('');
        }
      }
    });
    document.addEventListener('click', (e)=>{ if(!container.contains(e.target)) closeDropdown(); });
  }
  function rebuild(newOptions){
    dropdown.innerHTML = '';
    let searchInput = null;
    if(enableSearch){
      searchInput = document.createElement('input');
      searchInput.type='text'; searchInput.className='ms-srch'; searchInput.placeholder='Search…';
      searchInput.addEventListener('input', ()=>renderDropdown(searchInput.value));
      searchInput.addEventListener('click', (e)=>e.stopPropagation());
      dropdown.appendChild(searchInput);
    }
    const actions = document.createElement('div'); actions.className='ms-acts';
    const btnAll = document.createElement('button'); btnAll.textContent='Select all';
    btnAll.addEventListener('click', (e)=>{
      e.stopPropagation();
      const vis = newOptions.filter(opt=>!searchInput||!searchInput.value||opt.label.toLowerCase().includes(searchInput.value.toLowerCase()));
      vis.forEach(opt=>selectedSet.add(opt.value));
      onUpdate(); updateTriggerText(); renderDropdown(searchInput?searchInput.value:'');
    });
    const btnClear = document.createElement('button'); btnClear.textContent='Clear';
    btnClear.addEventListener('click', (e)=>{
      e.stopPropagation(); selectedSet.clear();
      onUpdate(); updateTriggerText(); renderDropdown(searchInput?searchInput.value:'');
    });
    actions.appendChild(btnAll); actions.appendChild(btnClear); dropdown.appendChild(actions);
    function renderDropdown(filterText){
      dropdown.querySelectorAll('.ms-opt').forEach(el=>el.remove());
      let filtered = newOptions;
      if(filterText && filterText.trim()){
        const q = filterText.toLowerCase().trim();
        filtered = newOptions.filter(opt=>opt.label.toLowerCase().includes(q));
      }
      if(filtered.length===0){
        const empty=document.createElement('div');
        empty.className='ms-opt'; empty.style.opacity='0.5'; empty.style.cursor='default';
        empty.textContent='No matches'; dropdown.appendChild(empty); return;
      }
      filtered.forEach(opt=>{
        const div = document.createElement('div');
        div.className = 'ms-opt' + (selectedSet.has(opt.value)?' sel':'');
        div.innerHTML = `<span class="ck"><i class="fas fa-check"></i></span><span>${escapeHtml(opt.label)}</span>`;
        div.addEventListener('click', (e)=>{
          e.stopPropagation();
          if(selectedSet.has(opt.value)) selectedSet.delete(opt.value);
          else selectedSet.add(opt.value);
          onUpdate(); updateTriggerText(); closeDropdown();
        });
        dropdown.appendChild(div);
      });
    }
    function updateTriggerText(){
      if(selectedSet.size===0){
        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
        placeholder.style.display = 'inline';
        const ex = trigger.querySelector('.sel'); if(ex) ex.remove();
      } else {
        placeholder.style.display = 'none';
        let sel = trigger.querySelector('.sel');
        if(!sel){
          sel = document.createElement('span'); sel.className='sel';
          trigger.insertBefore(sel, trigger.querySelector('.ch'));
        }
        sel.textContent = `${selectedSet.size} selected`;
        sel.style.display = 'inline';
      }
    }
    rebuild._render = renderDropdown;
    rebuild._updateText = updateTriggerText;
    container._latestRebuild = rebuild;
    renderDropdown(''); updateTriggerText();
  }
  rebuild(options);
  return rebuild;
}

/* Status */
function setupStatusSegments(){
  if(cbCovered.dataset.listenerAttached) return;
  cbCovered.dataset.listenerAttached='1';
  cbPending.dataset.listenerAttached='1';
  cbCovered.addEventListener('click', ()=>toggleStatus('covered', cbCovered));
  cbPending.addEventListener('click', ()=>toggleStatus('pending', cbPending));
}
function toggleStatus(status, el){
  if(selectedStatuses.has(status)){
    if(selectedStatuses.size===1) return;
    selectedStatuses.delete(status); el.classList.remove('active');
  } else {
    selectedStatuses.add(status); el.classList.add('active');
  }
  scheduleFastFilterRefresh();
}
function refreshAllFilters(){
  pruneSelections();
  const aS = getAvailableOptions('subject');
  const aT = getAvailableOptions('topic');
  const aJ = getAvailableOptions('job');
  const sO = aS.subjects.map(s=>({value:s,label:s}));
  const tO = aT.topics.map(t=>({value:t,label:t}));
  const jO = aJ.jobs.map(j=>({value:j,label:j}));
  subjectCountHint.textContent = sO.length;
  topicCountHint.textContent = tO.length;
  jobCountHint.textContent = jO.length;
  if(rebuildSubjectSelect) rebuildSubjectSelect(sO);
  if(rebuildTopicSelect) rebuildTopicSelect(tO);
  if(rebuildJobSelect) rebuildJobSelect(jO);
}

/* Apply & render */
function applyFiltersAndRender(){
  filteredData = rawData.filter(item=>{
    if(selectedSubjects.size>0 && !selectedSubjects.has(item.subject)) return false;
    if(selectedTopics.size>0 && !selectedTopics.has(item.displayTopic)) return false;
    if(selectedJobs.size>0 && !selectedJobs.has(item.job)) return false;
    if(selectedStatuses.size>0 && !selectedStatuses.has(item.status)) return false;
    if(!matchesGlobalSearch(item, globalSearchTerm)) return false;
    return true;
  });
  visibleCount = PAGE_SIZE;

  updateBrandTitle();

  renderCards(filteredData);
  updatePaginationUI();
}

/* Pagination */
function updatePaginationUI(){
  const total = filteredData.length;
  if(total <= PAGE_SIZE){
    loadMoreWrap.style.display='none'; allLoadedWrap.style.display='none'; return;
  }
  if(visibleCount >= total){
    loadMoreWrap.style.display='none'; allLoadedWrap.style.display='flex';
    allLoadedText.textContent = `All ${total} topics loaded`;
  } else {
    loadMoreWrap.style.display='flex'; allLoadedWrap.style.display='none';
    const remaining = total - visibleCount;
    const next = Math.min(PAGE_SIZE, remaining);
    loadMoreBtnText.textContent = `Load ${next} more`;
    loadMoreCount.innerHTML = `Showing <span class="n">${visibleCount}</span> of <span class="n">${total}</span>`;
  }

/* Prompt */
function buildGoogleSearchQuery(item){
  const parts=[];
  if(item.subTopic && item.subTopic!=='—') parts.push(item.subTopic);
  if(item.mainTopic && item.mainTopic!=='—') parts.push(item.mainTopic);
  if(item.subject && item.subject!=='—') parts.push(item.subject);
  if(item.job && item.job!=='—') parts.push(item.job);
  return parts.join(' ');
}
function buildPrompt(item){
  const jobTitle = (item.job && item.job!=='—') ? item.job : null;
  const fallback = (item.mainTopic && item.mainTopic!=='—') ? item.mainTopic : 'this topic';
  const title = jobTitle || fallback;
  return `Prepare me on ${item.subTopic} 20 mcqs with detail solution for ${title} exam.\n\nIt should be:\nSrno\nMcq question\nChoices\nDetail solution\nCorrect answer as per choices`;
}
function copyPrompt(item){
  const text = buildPrompt(item);
  if(fallbackCopy(text)){ showToast(`Copied: ${item.subTopic}`); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast(`Copied: ${item.subTopic}`)).catch(()=>showToast('Copy failed'));
  } else showToast('Copy failed');
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
  ta.setAttribute('readonly',''); document.body.appendChild(ta);
  let ok=false;
  try{ ta.focus(); ta.select(); ta.setSelectionRange(0,text.length); ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta); return ok;
}
function showToast(msg){
  toastMessage.textContent = msg;
  toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'),1900);
}

/* Markdown */
function renderMarkdown(md){
  if(!md) return '';
  let html = md.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const codeBlocks=[];
  html = html.replace(/```([\s\S]*?)```/g,(m,code)=>{ const i=codeBlocks.length; codeBlocks.push(code); return `\u0000CODE${i}\u0000`; });
  const lines = html.split('\n'); const out=[];
  let inTable=false, inList=false, listType=null, inQuote=false;
  const closeList=()=>{ if(inList){ out.push(listType==='ol'?'</ol>':'</ul>'); inList=false; listType=null; } };
  const closeTable=()=>{ if(inTable){ out.push('</tbody></table>'); inTable=false; } };
  const closeQuote=()=>{ if(inQuote){ out.push('</blockquote>'); inQuote=false; } };
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    const cbMatch = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if(cbMatch){ closeList(); closeTable(); closeQuote();
      const code = codeBlocks[parseInt(cbMatch[1],10)];
      out.push(`<pre><code>${code}</code></pre>`); continue;
    }
    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
    const next = lines[i+1]||'';
    const isSep = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(next);
    if(isTableRow && isSep && !inTable){
      closeList(); closeQuote(); inTable=true;
      out.push('<table><thead>');
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c=>`<th>${inline(c.trim())}</th>`).join('') + '</tr>');
      out.push('</thead><tbody>'); i++; continue;
    }
    if(inTable && isTableRow){
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c=>`<td>${inline(c.trim())}</td>`).join('') + '</tr>'); continue;
    }
    if(inTable && !isTableRow) closeTable();
    if(/^\s*>\s?/.test(line)){
      if(!inQuote){ closeList(); out.push('<blockquote>'); inQuote=true; }
      out.push(inline(line.replace(/^\s*>\s?/,''))); continue;
    } else if(inQuote) closeQuote();
    const h1=line.match(/^#\s+(.*)$/); const h2=line.match(/^##\s+(.*)$/);
    const h3=line.match(/^###\s+(.*)$/); const h4=line.match(/^####\s+(.*)$/);
    if(h1){ closeList(); closeTable(); closeQuote(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }
    if(h2){ closeList(); closeTable(); closeQuote(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }
    if(h3){ closeList(); closeTable(); closeQuote(); out.push(`<h3>${inline(h3[1])}</h3>`); continue; }
    if(h4){ closeList(); closeTable(); closeQuote(); out.push(`<h4>${inline(h4[1])}</h4>`); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){ closeList(); closeTable(); closeQuote(); out.push('<hr>'); continue; }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){ closeTable(); closeQuote();
      if(!inList || listType!=='ul'){ closeList(); out.push('<ul>'); inList=true; listType='ul'; }
      out.push(`<li>${inline(ul[1])}</li>`); continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){ closeTable(); closeQuote();
      if(!inList || listType!=='ol'){ closeList(); out.push('<ol>'); inList=true; listType='ol'; }
      out.push(`<li>${inline(ol[1])}</li>`); continue;
    }
    if(line.trim()===''){ closeList(); closeTable(); closeQuote(); continue; }
    closeList(); closeTable(); closeQuote();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList(); closeTable(); closeQuote();
  return out.join('\n');
}
function parseRow(line){
  let t=line.trim();
  if(t.startsWith('|')) t=t.slice(1);
  if(t.endsWith('|')) t=t.slice(0,-1);
  return t.split('|');
}
function inline(text){
  if(!text) return '';
  let s=text;
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

/* Notes Modal */
function openNotesModal(item){
  if(!item.hasMarkdown) return;
  currentModalMarkdown = item.markdownNotes;
  const title = item.subTopic!=='—' ? item.subTopic : item.displayTopic;
  modalTitleText.textContent = title;
  const parts=[];

  if(item.subject && item.subject!=='—') parts.push(item.subject);
  if(item.job && item.job!=='—') parts.push(item.job);
  modalSubtitle.textContent = parts.join('  ·  ');
  modalBody.innerHTML = renderMarkdown(item.markdownNotes);
  modalOverlay.classList.add('open');
  document.body.classList.add('locked');

}
function closeNotesModal(){
  modalOverlay.classList.remove('open');

}

modalCloseBtn2.addEventListener('click', closeNotesModal);
modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) closeNotesModal(); });
document.addEventListener('keydown', (e)=>{

});

/* Cards */
function renderCards(data){
  if(!data.length){
    cardsContainer.innerHTML = `
      <div class="state">
        <i class="fas fa-magnifying-glass big"></i>
        <div class="ttl">No matching topics</div>
        <div class="sub">Try adjusting filters or search query</div>
      </div>`;
    return;
  }
  const slice = data.slice(0, visibleCount);
  const showJobBadge = selectedJobs.size === 0;
  const frag = document.createDocumentFragment();
  slice.forEach(item=>{
    const card = document.createElement('div');
    card.className = `card ${item.status==='covered'?'done':'pending'}`;
    if(item.status==='pending'){
      card.title = 'Click to copy prompt';
      card.addEventListener('click', (e)=>{
        if(e.target.closest('a,button')) return;
        copyPrompt(item);
      });
    }
    const top = document.createElement('div'); top.className='card-top';
    const tb = document.createElement('div'); tb.className='card-title-block';
    const srno = document.createElement('div'); srno.className='card-srno';
    srno.textContent = `#${item.srno}`; tb.appendChild(srno);
    const titleLink = document.createElement('a');
    titleLink.className = 'card-title';
    titleLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
    titleLink.target = '_blank'; titleLink.rel='noopener noreferrer';
    titleLink.title = 'Search: ' + buildGoogleSearchQuery(item);
    titleLink.innerHTML = `${escapeHtml(item.subTopic!=='—'?item.subTopic:'—')} <i class="fas fa-arrow-up-right-from-square"></i>`;
    titleLink.addEventListener('click', (e)=>e.stopPropagation());
    tb.appendChild(titleLink); top.appendChild(tb);
    const badges = document.createElement('div'); badges.className='card-badges';
    if(showJobBadge && item.job && item.job!=='—'){
      const b=document.createElement('span'); b.className='badge badge-job';
      b.textContent=item.job; b.title='Job: '+item.job; badges.appendChild(b);
    }
    if(item.lastUpdate){
      const d=document.createElement('span'); d.className='badge badge-date';
      d.innerHTML = `<i class="fas fa-clock"></i>${escapeHtml(item.lastUpdate)}`;
      d.title='Last update'; badges.appendChild(d);
    }
    if(badges.children.length) top.appendChild(badges);
    card.appendChild(top);

    const meta = document.createElement('div'); meta.className='card-meta';
    const mainLine = document.createElement('div'); mainLine.className='meta-line';
    const mainCount = mainTopicCounts[item.mainTopic]||1;
    mainLine.innerHTML = `
      <i class="fas fa-folder"></i>
      <span class="value bold">${escapeHtml(item.mainTopic)}</span>
      <span class="count-chip">${mainCount}</span>
    `;
    meta.appendChild(mainLine);
    const subjLine = document.createElement('div'); subjLine.className='meta-line';
    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);
    subjLine.innerHTML = `
      <i class="fas fa-book"></i>
      <span class="value">${escapeHtml(item.subject)}</span>
      <span class="count-chip">${subjCount}</span>
    `;
    meta.appendChild(subjLine);
    card.appendChild(meta);

    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
    const covCls = covPct===100 ? 'full' : (covPct>=50?'mid':'');
    const pw = document.createElement('div'); pw.className='prog-wrap';
    pw.innerHTML = `
      <div class="prog-head">
        <span>Coverage</span>
        <span class="pct">${covPct}%</span>
      </div>
      <div class="prog-track" title="Subject coverage: ${covPct}%">

      a.className='action action-done'; a.title='Open complete chat';
      a.innerHTML = `<i class="fas fa-circle-check"></i> Done <i class="fas fa-arrow-up-right-from-square" style="opacity:0.7;"></i>`;
      a.addEventListener('click',(e)=>e.stopPropagation());
      actions.appendChild(a);

/* Populate dropdowns */
function populateFilters(data){
  const subjects=new Set(), topics=new Set(), jobs=new Set();
  data.forEach(item=>{
    if(item.subject && item.subject!=='—') subjects.add(item.subject);
    if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
    if(item.job && item.job!=='—') jobs.add(item.job);
  });
  const sO = Array.from(subjects).sort().map(s=>({value:s,label:s}));
  const tO = Array.from(topics).sort().map(t=>({value:t,label:t}));
  const jO = Array.from(jobs).sort().map(j=>({value:j,label:j}));
  const sW = $('subjectMultiWrap'); sW.dataset.type='subjects';
  if(!rebuildSubjectSelect) rebuildSubjectSelect = buildMultiSelect(sW, sO, selectedSubjects, onFilterChange, true);
  else rebuildSubjectSelect(sO);
  const tW = $('topicMultiWrap'); tW.dataset.type='topics';
  if(!rebuildTopicSelect) rebuildTopicSelect = buildMultiSelect(tW, tO, selectedTopics, onFilterChange, true);
  else rebuildTopicSelect(tO);
  const jW = $('jobMultiWrap'); jW.dataset.type='jobs';
  if(!rebuildJobSelect) rebuildJobSelect = buildMultiSelect(jW, jO, selectedJobs, onFilterChange, true);
  else rebuildJobSelect(jO);
  subjectCountHint.textContent = sO.length;
  topicCountHint.textContent = tO.length;
  jobCountHint.textContent = jO.length;
}

/* Report */
function buildReport(){
  const data = filteredData;
  if(!data.length){
    reportContent.innerHTML = `<div class="empty"><i class="fas fa-inbox"></i>No data matches current filters.</div>`;
    reportSubtitle.textContent = 'No data';
    return;
  }
  const jobsMap = new Map();
  data.forEach(item=>{
    const job = item.job && item.job!=='—' ? item.job : 'Unassigned';
    const subject = item.subject && item.subject!=='—' ? item.subject : 'Unassigned';
    const topic = item.mainTopic && item.mainTopic!=='—' ? item.mainTopic : 'Unassigned';
    if(!jobsMap.has(job)) jobsMap.set(job, { name:job, subjects:new Map(), total:0, done:0 });
    const j = jobsMap.get(job); j.total++;
    if(item.status==='covered') j.done++;
    if(!j.subjects.has(subject)) j.subjects.set(subject, { name:subject, topics:new Map(), total:0, done:0 });
    const s = j.subjects.get(subject); s.total++;
    if(item.status==='covered') s.done++;
    if(!s.topics.has(topic)) s.topics.set(topic, { name:topic, subtopics:[], total:0, done:0 });
    const t = s.topics.get(topic); t.total++;
    if(item.status==='covered') t.done++;
    t.subtopics.push(item);
  });
  const sortedJobs = Array.from(jobsMap.values()).sort((a,b)=>b.total-a.total);
  const totalTopics = data.length;
  const totalDone = data.filter(d=>d.status==='covered').length;
  const pct = totalTopics ? Math.round((totalDone/totalTopics)*100) : 0;
  reportSubtitle.textContent = `${sortedJobs.length} jobs · ${totalTopics} topics · ${pct}% covered`;

  let html = '<div class="tree">';
  sortedJobs.forEach(job=>{
    const jobPct = job.total ? Math.round((job.done/job.total)*100) : 0;
    const jCls = jobPct===100 ? 'full' : (jobPct>=50?'mid':'');
    html += `<div class="tr-job">`;
    html += `<div class="tr-head" data-t="job">`;
    html += `<div class="tr-toggle"><i class="fas fa-chevron-right"></i></div>`;
    html += `<div class="tr-info">`;
    html += `<div class="tr-name">${escapeHtml(job.name)}</div>`;
    html += `<div class="tr-meta">`;
    html += `<span class="it"><i class="fas fa-book"></i>${job.subjects.size} subjects</span>`;
    html += `<span class="it"><i class="fas fa-folder"></i>${job.total} topics</span>`;
    html += `<span class="it done-txt"><i class="fas fa-circle-check"></i>${job.done} done</span>`;
    html += `<span class="it pend-txt"><i class="fas fa-clock"></i>${job.total-job.done} pending</span>`;
    html += `</div></div>`;
    html += `<div class="tr-pct">`;
    html += `<div class="mini-bar"><div class="mini-fill ${jCls}" style="width:${jobPct}%"></div></div>`;
    html += `<span class="mini-pct">${jobPct}%</span>`;
    html += `</div></div>`;
    html += `<div class="tr-body"><div class="subs">`;

    const sortedSubjects = Array.from(job.subjects.values()).sort((a,b)=>b.total-a.total);
    sortedSubjects.forEach(subject=>{
      const sPct = subject.total ? Math.round((subject.done/subject.total)*100) : 0;
      const sCls = sPct===100 ? 'full' : (sPct>=50?'mid':'');
      html += `<div class="tr-sub">`;
      html += `<div class="tr-sub-head" data-t="sub">`;
      html += `<div class="tr-toggle"><i class="fas fa-chevron-right"></i></div>`;
      html += `<div class="tr-sub-info">`;
      html += `<div class="tr-sub-name">${escapeHtml(subject.name)}</div>`;
      html += `<div class="tr-sub-meta">`;
      html += `<span><i class="fas fa-folder"></i> ${subject.topics.size} topics</span>`;
      html += `<span><i class="fas fa-list"></i> ${subject.total} subtopics</span>`;
      html += `<span class="done-txt" style="color:var(--green);">${subject.done} done</span>`;
      html += `</div></div>`;
      html += `<div class="tr-pct">`;
      html += `<div class="mini-bar"><div class="mini-fill ${sCls}" style="width:${sPct}%"></div></div>`;
      html += `<span class="mini-pct">${sPct}%</span>`;
      html += `</div></div>`;
      html += `<div class="tr-sub-body"><div class="tops">`;

      const sortedTopics = Array.from(subject.topics.values()).sort((a,b)=>b.total-a.total);
      sortedTopics.forEach(topic=>{
        const tPct = topic.total ? Math.round((topic.done/topic.total)*100) : 0;
        const tCls = tPct===100 ? 'full' : (tPct>=50?'mid':'');
        html += `<div class="tr-top">`;
        html += `<div class="tr-top-head" data-t="top">`;
        html += `<div class="tr-toggle"><i class="fas fa-chevron-right"></i></div>`;
        html += `<div class="tr-top-info">`;
        html += `<div class="tr-top-name">${escapeHtml(topic.name)}</div>`;
        html += `<div class="tr-top-meta">${topic.subtopics.length} subtopic${topic.subtopics.length===1?'':'s'} · ${topic.done} done · ${topic.total-topic.done} pending</div>`;
        html += `</div>`;
        html += `<div class="tr-pct">`;
        html += `<div class="mini-bar"><div class="mini-fill ${tCls}" style="width:${tPct}%"></div></div>`;
        html += `<span class="mini-pct">${tPct}%</span>`;
        html += `</div></div>`;
        html += `<div class="tr-top-body"><div class="subtops">`;
        topic.subtopics.forEach(sub=>{
          const ok = sub.status==='covered' ? 'ok' : '';
          html += `<div class="tr-subtop">`;
          html += `<span class="dot ${ok}" title="${sub.status}"></span>`;
          html += `<span class="nm">${escapeHtml(sub.subTopic!=='—'?sub.subTopic:'—')}</span>`;
          html += `<span class="sr">#${escapeHtml(sub.srno)}</span>`;
          html += `</div>`;
        });
        html += `</div></div></div>`;
      });
      html += `</div></div></div>`;
    });
    html += `</div></div></div>`;
  });
  html += `</div>`;
  reportContent.innerHTML = html;

  // Wire toggles
  reportContent.querySelectorAll('.tr-head').forEach(h=>{
    h.addEventListener('click', ()=> h.closest('.tr-job').classList.toggle('exp'));
  });
  reportContent.querySelectorAll('.tr-sub-head').forEach(h=>{
    h.addEventListener('click', (e)=>{ e.stopPropagation(); h.closest('.tr-sub').classList.toggle('exp'); });
  });
  reportContent.querySelectorAll('.tr-top-head').forEach(h=>{
    h.addEventListener('click', (e)=>{ e.stopPropagation(); h.closest('.tr-top').classList.toggle('exp'); });
  });
}

function openReport(){
  buildReport();
  reportOverlay.classList.add('open');
  document.body.classList.add('locked');
}
function closeReport(){
  reportOverlay.classList.remove('open');
  document.body.classList.remove('locked');
}
reportBtn.addEventListener('click', openReport);
reportCloseBtn.addEventListener('click', closeReport);
reportOverlay.addEventListener('click', (e)=>{ if(e.target===reportOverlay) closeReport(); });

/* Filter popup */
function openFilter(){
  filterOverlay.classList.add('open');
  document.body.classList.add('locked');
}
function closeFilter(){
  filterOverlay.classList.remove('open');
  document.body.classList.remove('locked');
}
filterBtn.addEventListener('click', openFilter);
filterCloseBtn.addEventListener('click', closeFilter);
filterOverlay.addEventListener('click', (e)=>{ if(e.target===filterOverlay) closeFilter(); });
applyFiltersBtn.addEventListener('click', ()=>{ closeFilter(); showToast('Filters applied'); });

/* Scroll */
function updateScrollButtons(){
  const y = window.scrollY || 0;
  const maxY = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
  if(y<100) fabScrollTop.classList.add('hidden'); else fabScrollTop.classList.remove('hidden');
  if(maxY<=0 || y>=maxY-100) fabScrollBottom.classList.add('hidden'); else fabScrollBottom.classList.remove('hidden');
}
let scrollTick=false;
window.addEventListener('scroll', ()=>{
  if(scrollTick) return;
  scrollTick=true;
  requestAnimationFrame(()=>{ scrollTick=false; updateScrollButtons(); saveScrollPosition(); });
},{passive:true});
fabScrollTop.addEventListener('click', ()=>{ window.scrollTo({top:0,behavior:'smooth'}); try{ localStorage.setItem(LS_SCROLL_KEY,'0'); }catch(e){} });
fabScrollBottom.addEventListener('click', ()=>{ const t=document.documentElement.scrollHeight||document.body.scrollHeight; window.scrollTo({top:t,behavior:'smooth'}); });
function restoreScrollPosition(){
  const y = getSavedScrollPosition();
  if(y>0) requestAnimationFrame(()=>window.scrollTo(0,y));
}

/* Load */
function setRefreshLoading(loading){ isLoading=loading; fabRefresh.classList.toggle('loading',loading); }
async function fetchFreshData(){
  const bust = `&_=${Date.now()}`;
  const res = await fetch(CSV_URL + bust, { cache:'no-store' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if(text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')){
    throw new Error('Sheet is not public. Share as "Anyone with link can view".');
  }
  const rows = parseCSV(text);
  if(rows.length<2) throw new Error('No data rows');
  const data = mapRowsToObjects(rows);
  if(!data.length) throw new Error('No parsed data');
  return data;
}
function applyDataAndRender(data, opts){
  opts = opts || {};
  rawData = data;
  computeCounts(rawData);
  populateFilters(rawData);
  if(opts.isFirstLoad){
    setupStatusSegments();
    cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
    cbPending.classList.toggle('active', selectedStatuses.has('pending'));
    refreshAllFilters();
    applyFiltersAndRender();
    restoreScrollPosition();
  } else {
    refreshAllFilters();
    applyFiltersAndRender();
  }
  requestAnimationFrame(updateScrollButtons);
}
function renderSkeletons(){
  let html='';
  for(let i=0;i<6;i++){
    html += `<div class="skel">
      <div class="sk w40"></div>
      <div class="sk h18 w80"></div>
      <div class="sk w60"></div>
      <div class="sk w40"></div>
    </div>`;
  }
  cardsContainer.innerHTML = html;
}
async function refreshFromNetwork(opts){
  opts = opts || {};
  if(isLoading) return;
  if(opts.isManual) setRefreshLoading(true); else renderSkeletons();
  try{
    const fresh = await fetchFreshData();
    saveDataToStorage(fresh);
    applyDataAndRender(fresh,{isFirstLoad:opts.isFirstLoad});
    if(opts.isManual) showToast('Data refreshed');
  } catch(err){
    console.error('Fetch error:', err);
    if(opts.isManual){
      showToast('Refresh failed — check console');
    } else {
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--amber);"></i>
          <div class="ttl">Couldn't load sheet</div>
          <div class="sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  } finally { if(opts.isManual) setRefreshLoading(false); }
}

/* Search */
function updateSearchClearButton(){
  globalSearchClear.classList.toggle('show', !!(globalSearchTerm && globalSearchTerm.trim()));
}
globalSearchInput.addEventListener('input', ()=>{
  if(globalSearchInput.value === globalSearchTerm) return;
  globalSearchTerm = globalSearchInput.value;
  updateSearchClearButton();
  scheduleFastFilterRefresh();
});
globalSearchClear.addEventListener('click', ()=>{
  globalSearchInput.value=''; globalSearchTerm='';
  updateSearchClearButton(); scheduleFastFilterRefresh(); globalSearchInput.focus();
});

/* Init */
(async function init(){
  loadFiltersFromStorage();
  cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
  cbPending.classList.toggle('active', selectedStatuses.has('pending'));
  if(globalSearchTerm) globalSearchInput.value = globalSearchTerm;
  updateSearchClearButton();
  const cached = loadDataFromStorage();
  if(cached){
    applyDataAndRender(cached,{isFirstLoad:true});
  } else {
    renderSkeletons();
    try{
      const fresh = await fetchFreshData();
      saveDataToStorage(fresh);
      applyDataAndRender(fresh,{isFirstLoad:true});
    } catch(err){
      console.error('Init fetch error:', err);
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--amber);"></i>
          <div class="ttl">Couldn't load sheet</div>
          <div class="sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  }
})();

fabRefresh.addEventListener('click', ()=>{
  clearPersistedData();
  refreshFromNetwork({isManual:true,isFirstLoad:false});
});
window.addEventListener('beforeunload', saveScrollPosition);

})();
</script>
</body>
</html>
