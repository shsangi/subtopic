<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<meta name="theme-color" content="#0f172a">
<title>Topic Tracker — Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#f7f8fa; --bg-elevated:#ffffff; --bg-subtle:#f1f3f6; --bg-inset:#eef1f5;
  --border:#e4e8ee; --border-strong:#d4dae3; --border-subtle:#eef1f5;
  --text:#0f172a; --text-secondary:#475569; --text-muted:#7b8794; --text-faint:#9aa5b1;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eff4ff; --accent-border:#c9dcff;
  --success:#0d9488; --success-soft:#e8f7f4; --success-border:#b8e5dd;
  --warn:#c2410c; --warn-soft:#fef3ec; --warn-border:#f8d5be;
  --danger:#dc2626; --danger-soft:#fef2f2; --danger-border:#fecaca;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,0.08),0 2px 6px -2px rgba(15,23,42,0.05);
  --shadow-lg:0 12px 32px -8px rgba(15,23,42,0.16),0 4px 12px -4px rgba(15,23,42,0.08);
  --shadow-xl:0 24px 56px -12px rgba(15,23,42,0.24),0 8px 20px -8px rgba(15,23,42,0.12);
  --radius-sm:6px; --radius:10px; --radius-lg:14px; --radius-xl:18px;
  --ring:0 0 0 3px rgba(37,99,235,0.14);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --header-h:56px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:var(--font-sans);
  font-feature-settings:'cv02','cv03','cv04','cv11','ss01';
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;} a{color:inherit;}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:100; height:var(--header-h);
  background:rgba(255,255,255,0.82);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px;
}
.app-header-inner{
  max-width:1400px; width:100%; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:grid; place-items:center; color:white; font-size:13px;
  box-shadow:0 3px 8px -2px rgba(37,99,235,0.4); flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; min-width:0; line-height:1.15;}
.brand-title{
  font-size:14px; font-weight:700; letter-spacing:-0.01em;
  color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:6px;
}
.brand-title .job-pill{
  font-size:11px; font-weight:600;
  background:var(--accent-soft); color:var(--accent);
  border:1px solid var(--accent-border);
  padding:2px 8px; border-radius:20px; letter-spacing:0;
}
.brand-sub{font-size:11px; color:var(--text-muted); font-weight:500;}
.header-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}

.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 12px; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:600; letter-spacing:-0.005em;
  transition:all 0.15s ease; white-space:nowrap; user-select:none;
}
.btn i{font-size:11px;}
.btn-ghost{
  color:var(--text-secondary); border:1px solid var(--border);
  background:var(--bg-elevated); box-shadow:var(--shadow-xs);
}
.btn-ghost:hover{
  background:var(--bg-subtle); border-color:var(--border-strong);
  color:var(--text); transform:translateY(-1px); box-shadow:var(--shadow-sm);
}
.btn-ghost:active{transform:translateY(0);}
.btn-primary{background:var(--text); color:white; border:1px solid var(--text);}
.btn-primary:hover{background:#1e293b; transform:translateY(-1px); box-shadow:var(--shadow-md);}

/* ============ CONTAINER ============ */
.container{max-width:1400px; margin:0 auto; padding:16px 20px 20px;}

/* ============ STATS — COMPACT ============ */
.stats-grid{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:8px; margin-bottom:12px;
}
.stat-card{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 12px;
  box-shadow:var(--shadow-xs);
  display:flex; align-items:center; gap:10px;
  transition:all 0.15s ease;
}
.stat-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-sm);}
.stat-icon{
  width:26px; height:26px; border-radius:7px;
  display:grid; place-items:center; flex-shrink:0;
  font-size:11px; background:var(--bg-inset); color:var(--text-secondary);
}
.stat-card.is-success .stat-icon{background:var(--success-soft); color:var(--success);}
.stat-card.is-warn .stat-icon{background:var(--warn-soft); color:var(--warn);}
.stat-body{display:flex; flex-direction:column; min-width:0; line-height:1.1;}
.stat-label{
  font-size:10px; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:0.05em;
}
.stat-value{
  font-size:15px; font-weight:700; color:var(--text);
  letter-spacing:-0.01em; font-variant-numeric:tabular-nums;
}
.stat-card.is-success .stat-value{color:var(--success);}
.stat-card.is-warn .stat-value{color:var(--warn);}

/* ============ SEARCH ============ */
.search-bar{position:relative; margin-bottom:10px;}
.search-bar i.search-icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-muted); font-size:13px; pointer-events:none;
}
.search-bar input{
  width:100%; padding:10px 40px 10px 38px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-elevated); font-size:13.5px; font-weight:450;
  color:var(--text); outline:none; transition:all 0.15s ease;
  box-shadow:var(--shadow-xs);
}
.search-bar input::placeholder{color:var(--text-faint); font-weight:400;}
.search-bar input:focus{border-color:var(--accent); box-shadow:var(--ring),var(--shadow-sm);}
.search-clear{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  color:var(--text-muted); font-size:12px; transition:all 0.12s ease;
}
.search-clear:hover{background:var(--bg-subtle); color:var(--danger);}
.search-clear.visible{display:flex;}

/* ============ FILTER PANEL ============ */
.filter-panel{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:12px 14px;
  margin-bottom:12px; box-shadow:var(--shadow-xs);
  display:flex; flex-direction:column; gap:10px;
}
.filter-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.filter-group{min-width:0;}
.filter-label{
  display:flex; align-items:center; justify-content:space-between;
  font-size:11px; font-weight:600; letter-spacing:0.03em;
  text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;
}
.filter-label .count-pill{
  font-size:10px; font-weight:700; background:var(--bg-inset);
  color:var(--text-secondary); padding:1px 7px; border-radius:20px;
  letter-spacing:0; text-transform:none;
}
.ms{position:relative;}
.ms-trigger{
  width:100%; padding:7px 10px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-elevated); font-size:13px; font-weight:500;
  color:var(--text); display:flex; align-items:center; justify-content:space-between;
  gap:8px; min-height:34px; transition:all 0.15s ease;
  box-shadow:var(--shadow-xs); user-select:none;
}
.ms-trigger:hover{border-color:var(--border-strong); background:var(--bg-subtle);}
.ms-trigger.open{border-color:var(--accent); box-shadow:var(--ring);}
.ms-trigger .ph{color:var(--text-faint); font-weight:400;}
.ms-trigger .sel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ms-trigger i.chev{font-size:10px; color:var(--text-muted); transition:transform 0.2s ease;}
.ms-trigger.open i.chev{transform:rotate(180deg);}
.ms-drop{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-lg);
  max-height:260px; overflow-y:auto; z-index:200;
  display:none; padding:6px;
}
.ms-drop.open{display:block;}
.ms-search{
  width:100%; padding:7px 10px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:500; color:var(--text);
  outline:none; background:var(--bg-inset); transition:all 0.15s ease;
  margin-bottom:4px;
}
.ms-search:focus{border-color:var(--accent); background:white; box-shadow:var(--ring);}
.ms-search::placeholder{color:var(--text-faint); font-weight:400;}
.ms-opt{
  display:flex; align-items:center; gap:8px;
  padding:7px 8px; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:500; color:var(--text);
  cursor:pointer; transition:background 0.12s ease; word-break:break-word;
}
.ms-opt:hover{background:var(--bg-subtle);}
.ms-opt.selected{background:var(--accent-soft); color:var(--accent);}
.ms-opt .check{
  width:15px; height:15px; border-radius:4px;
  border:1.5px solid var(--border-strong); background:white;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.12s ease;
}
.ms-opt .check i{font-size:8px; color:white; opacity:0; transition:opacity 0.12s ease;}
.ms-opt.selected .check{background:var(--accent); border-color:var(--accent);}
.ms-opt.selected .check i{opacity:1;}
.ms-actions{
  display:flex; gap:6px; padding:6px 4px 2px;
  border-top:1px solid var(--border-subtle); margin-top:4px;
}
.ms-actions button{
  flex:1; padding:6px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-elevated);
  font-size:11.5px; font-weight:600; color:var(--text-secondary);
  transition:all 0.12s ease;
}
.ms-actions button:hover{background:var(--bg-subtle); border-color:var(--border-strong); color:var(--text);}
.filter-foot{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--border-subtle);
}
.segmented{
  display:inline-flex; background:var(--bg-inset);
  border:1px solid var(--border); border-radius:var(--radius); padding:3px; gap:2px;
}
.seg-btn{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:7px;
  font-size:12px; font-weight:600; color:var(--text-secondary);
  transition:all 0.15s ease; user-select:none;
}
.seg-btn i{font-size:10px;}
.seg-btn:hover{color:var(--text);}
.seg-btn.active{background:var(--bg-elevated); color:var(--text); box-shadow:var(--shadow-xs);}
.seg-btn.active[data-status="covered"]{color:var(--success);}
.seg-btn.active[data-status="pending"]{color:var(--warn);}
.btn-reset{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--bg-elevated);
  font-size:12px; font-weight:600; color:var(--text-secondary);
  transition:all 0.15s ease;
}
.btn-reset:hover{border-color:var(--danger-border); color:var(--danger); background:var(--danger-soft);}
.btn-reset i{font-size:10px; transition:transform 0.4s ease;}
.btn-reset:hover i{transform:rotate(-180deg);}

/* ============ RESULTS META ============ */
.results-meta{
  display:flex; align-items:center; justify-content:space-between;
  padding:0 2px 10px; font-size:12px; color:var(--text-muted); font-weight:500;
}
.results-meta .count-strong{color:var(--text); font-weight:700;}

/* ============ CARDS ============ */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px;}

.card{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:14px 16px 12px;
  box-shadow:var(--shadow-xs);
  transition:all 0.18s cubic-bezier(0.4,0,0.2,1);
  display:flex; flex-direction:column; gap:10px;
  position:relative; overflow:hidden; min-width:0;
}
.card::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--border-strong); transition:background 0.2s ease;
}
.card.is-covered::before{background:var(--success);}
.card.is-pending::before{background:var(--warn);}
.card.is-pending{cursor:pointer;}
.card:hover{
  border-color:var(--border-strong); box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.card.is-pending:hover{background:linear-gradient(180deg,#ffffff 0%,#fffbf6 100%);}

/* --- ROW 1: Srno + Large Subtopic + Job badge --- */
.card-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; min-width:0;
}
.card-head-left{
  display:flex; align-items:baseline; gap:8px;
  min-width:0; flex:1; flex-wrap:wrap;
}
.card-srno{
  display:inline-flex; align-items:center;
  font-family:var(--font-mono);
  font-size:12px; font-weight:600;
  color:var(--text-muted);
  background:var(--bg-inset);
  padding:2px 8px; border-radius:6px;
  flex-shrink:0; line-height:1.4;
  letter-spacing:0.01em;
}
.card-title{
  font-size:19px; font-weight:800;
  color:var(--text); letter-spacing:-0.02em;
  line-height:1.2;
  text-decoration:none;
  display:inline-flex; align-items:center; gap:6px;
  transition:color 0.15s ease;
  word-break:break-word; min-width:0;
}
.card-title:hover{color:var(--accent);}
.card-title i{
  font-size:11px; opacity:0;
  transition:opacity 0.15s ease, transform 0.15s ease;
}
.card-title:hover i{opacity:0.65; transform:translateX(2px);}

.card-badges{
  display:flex; flex-direction:column; align-items:flex-end;
  gap:4px; flex-shrink:0; max-width:40%;
}
.badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:700;
  padding:3px 8px; border-radius:20px;
  letter-spacing:0.02em; white-space:nowrap;
  border:1px solid transparent;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
  text-transform:uppercase;
}
.badge-job{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-border);}

/* --- ROW 2: Progress bar + date --- */
.card-progress-row{
  display:flex; align-items:center; gap:10px;
}
.progress-wrap{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
}
.progress-bar{
  flex:1; height:7px; background:var(--bg-inset);
  border-radius:6px; overflow:hidden; position:relative;
  box-shadow:inset 0 1px 2px rgba(15,23,42,0.04);
}
.progress-fill{
  height:100%; border-radius:6px;
  transition:width 0.5s cubic-bezier(0.4,0,0.2,1), background 0.2s ease;
  background:linear-gradient(90deg,#fb923c,#f97316);
  position:relative;
}
.progress-fill.mid{background:linear-gradient(90deg,#60a5fa,#2563eb);}
.progress-fill.full{background:linear-gradient(90deg,#34d399,#0d9488);}
.progress-pct{
  font-family:var(--font-mono);
  font-size:12px; font-weight:700;
  color:var(--text-secondary);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.02em;
  flex-shrink:0; min-width:36px; text-align:right;
}
.progress-pct.full{color:var(--success);}
.progress-pct.low{color:var(--warn);}

.card-date{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:500;
  color:var(--text-faint);
  white-space:nowrap; flex-shrink:0;
}
.card-date i{font-size:9px;}

/* --- ROW 3: Topic · Subject meta --- */
.card-meta{
  display:flex; flex-wrap:wrap; gap:6px 8px;
  padding-top:2px;
  font-size:12.5px;
}
.meta-chip{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--bg-subtle);
  border:1px solid var(--border-subtle);
  padding:3px 8px 3px 6px;
  border-radius:7px;
  min-width:0; max-width:100%;
  transition:all 0.12s ease;
}
.meta-chip:hover{background:var(--bg-inset);}
.meta-chip i{
  font-size:10px; color:var(--text-faint); flex-shrink:0;
}
.meta-chip .meta-label{
  font-size:10px; font-weight:600;
  color:var(--text-faint); text-transform:uppercase;
  letter-spacing:0.04em;
  flex-shrink:0;
}
.meta-chip .meta-value{
  font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:180px;
}
.meta-chip .count-chip{
  font-family:var(--font-mono);
  font-size:10px; font-weight:700;
  background:var(--bg-elevated); color:var(--text-secondary);
  padding:1px 6px; border-radius:20px;
  border:1px solid var(--border);
  flex-shrink:0;
  letter-spacing:-0.02em;
}

/* --- ROW 4: Actions --- */
.card-foot{
  display:flex; align-items:center; justify-content:flex-end;
  gap:6px; padding-top:10px;
  border-top:1px solid var(--border-subtle);
  flex-wrap:wrap;
}
.action{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:600;
  padding:5px 10px; border-radius:var(--radius-sm);
  transition:all 0.15s ease; white-space:nowrap;
  border:1px solid transparent; text-decoration:none;
  letter-spacing:-0.005em;
}
.action i{font-size:10px;}
.action-read{background:var(--bg-inset); color:var(--text-secondary); border-color:var(--border);}
.action-read:hover{
  background:var(--text); color:white; border-color:var(--text);
  transform:translateY(-1px); box-shadow:var(--shadow-sm);
}
.action-done{background:var(--success-soft); color:var(--success); border-color:var(--success-border);}
.action-done:hover{
  background:var(--success); color:white; border-color:var(--success);
  transform:translateY(-1px); box-shadow:0 4px 10px -2px rgba(13,148,136,0.35);
}
.action-pending{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-border);}
.action-pending:hover{
  background:var(--warn); color:white; border-color:var(--warn);
  transform:translateY(-1px); box-shadow:0 4px 10px -2px rgba(194,65,12,0.35);
}
.action-sol{
  background:var(--bg-elevated); color:var(--text-secondary);
  border-color:var(--border); max-width:130px;
}
.action-sol:hover{border-color:var(--border-strong); color:var(--text); background:var(--bg-subtle);}
.action-sol .label{overflow:hidden; text-overflow:ellipsis; max-width:88px;}

/* ============ STATES / SKELETON ============ */
.state{
  grid-column:1/-1; padding:56px 24px; text-align:center;
  background:var(--bg-elevated); border:1px dashed var(--border-strong);
  border-radius:var(--radius-lg); color:var(--text-secondary); font-size:13px;
}
.state i.big{font-size:26px; color:var(--text-faint); margin-bottom:10px; display:block;}
.state .state-title{font-weight:600; color:var(--text); margin-bottom:4px; font-size:14px;}
.state .state-sub{font-size:12px; color:var(--text-muted);}
.skeleton-card{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px;
  display:flex; flex-direction:column; gap:12px;
}
.sk-line{
  height:12px; border-radius:4px;
  background:linear-gradient(90deg,var(--bg-inset) 25%,#e8ecf1 50%,var(--bg-inset) 75%);
  background-size:200% 100%; animation:sk 1.4s ease-in-out infinite;
}
.sk-line.w40{width:40%;} .sk-line.w60{width:60%;} .sk-line.w80{width:80%;}
.sk-line.h16{height:16px;} .sk-line.h20{height:20px;}

(function(){
'use strict';

const SHEET_ID = '1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc';
const GID = '0';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const EXPECTED_COLUMNS = 9;

const LS_DATA_KEY='tracker_data_v2', LS_FILTERS_KEY='tracker_filters_v2',
      LS_SCROLL_KEY='tracker_scroll_v2', LS_TS_KEY='tracker_ts_v2';

const $ = id => document.getElementById(id);
const cardsContainer=$('cardsContainer'), statTotal=$('statTotal'), statCovered=$('statCovered'),
      statPending=$('statPending'), statSubjects=$('statSubjects'),
      cbCovered=$('cbCovered'), cbPending=$('cbPending'),

      brandTitle=$('brandTitle'), fabRefresh=$('fabRefresh'),
      fabScrollTop=$('fabScrollTop'), fabScrollBottom=$('fabScrollBottom'),
      resetFiltersBtn=$('resetFiltersBtn'), resultsMeta=$('resultsMeta'),
      resultCount=$('resultCount'), resultLabel=$('resultLabel'), resultScope=$('resultScope'),
      subjectCountHint=$('subjectCountHint'), topicCountHint=$('topicCountHint'), jobCountHint=$('jobCountHint'),
      globalSearchInput=$('globalSearchInput'), globalSearchClear=$('globalSearchClear'),
      modalOverlay=$('modalOverlay'), modalTitleText=$('modalTitleText'), modalSubtitle=$('modalSubtitle'),
      modalBody=$('modalBody'), modalCloseBtn=$('modalCloseBtn'), modalCloseBtn2=$('modalCloseBtn2'),
      modalCopyBtn=$('modalCopyBtn');

let rawData=[], filteredData=[];
let selectedSubjects=new Set(), selectedTopics=new Set(), selectedJobs=new Set();
let selectedStatuses=new Set(['covered','pending']);
let globalSearchTerm='';
let subjectCounts={}, mainTopicCounts={}, subjectCoverageScoped={};
let currentModalMarkdown='';

/* PERSIST */
function saveFiltersToStorage(){
  try{ localStorage.setItem(LS_FILTERS_KEY, JSON.stringify({
    subjects:Array.from(selectedSubjects), topics:Array.from(selectedTopics),
    jobs:Array.from(selectedJobs), statuses:Array.from(selectedStatuses), search:globalSearchTerm
  })); }catch(e){}
}
function loadFiltersFromStorage(){
  try{
    const raw=localStorage.getItem(LS_FILTERS_KEY); if(!raw) return false;
    const p=JSON.parse(raw);
    if(Array.isArray(p.subjects)) selectedSubjects=new Set(p.subjects);
    if(Array.isArray(p.topics)) selectedTopics=new Set(p.topics);

    if(typeof p.search==='string') globalSearchTerm=p.search;
    return true;
  }catch(e){ return false; }
}
function saveDataToStorage(d){ try{ localStorage.setItem(LS_DATA_KEY,JSON.stringify(d)); localStorage.setItem(LS_TS_KEY,String(Date.now())); }catch(e){} }
function loadDataFromStorage(){ try{ const r=localStorage.getItem(LS_DATA_KEY); if(!r) return null; const p=JSON.parse(r); return Array.isArray(p)&&p.length?p:null; }catch(e){ return null; } }
function saveScrollPosition(){ try{ localStorage.setItem(LS_SCROLL_KEY,String(window.scrollY||0)); }catch(e){} }
function getSavedScrollPosition(){ try{ const v=localStorage.getItem(LS_SCROLL_KEY); return v?(parseInt(v,10)||0):0; }catch(e){ return 0; } }
function clearPersistedData(){ try{ localStorage.removeItem(LS_DATA_KEY); localStorage.removeItem(LS_TS_KEY); }catch(e){} }

/* HELPERS */
function escapeHtml(u){ if(u==null) return ''; return String(u).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function extractFileName(url){
  if(!url||url==='#') return 'sol';
  try{
    let c=url.split('#')[0].split('?')[0]; const p=c.split('/'); let l=p[p.length-1]||'';
    try{ l=decodeURIComponent(l); }catch(e){}
    if(!l||(l.indexOf('.')===-1&&!/\w/.test(l))) return 'sol';
    if(l.length>24) l=l.slice(0,21)+'…';
    return l||'sol';
  }catch(e){ return 'sol'; }
}
function buildJobScopeKey(s){ if(!s||s.size===0) return 'ALL'; return 'JOB::'+Array.from(s).sort().join('|'); }
function scopedCoverageKey(subj,key){ return subj+'||'+key; }

function matchesGlobalSearch(item,term){
  if(!term||term.trim()==='') return true;
  const q=term.toLowerCase().trim();
  return [String(item.srno),String(item.subject),String(item.marks),String(item.mainTopic),
    String(item.subTopic),String(item.displayTopic),String(item.job),String(item.lastUpdate),
    String(item.markdownNotes).substring(0,500),String(item.url),String(item.solFileName)]
    .some(f=>f.toLowerCase().includes(q));
}

function scheduleFastFilterRefresh(){
  if(filterRefreshScheduled) return;

  requestAnimationFrame(()=>{ filterRefreshScheduled=false; refreshAllFilters(); applyFiltersAndRender(); saveFiltersToStorage(); });
}

/* CSV */
function parseCSV(t){
  const rows=[]; let row=[],field='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1];
    if(c==='"'){ if(q&&n==='"'){ field+='"'; i++; } else q=!q; }
    else if(c===','&&!q){ row.push(field); field=''; }
    else if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&n==='\n') i++;
      row.push(field);
      if(row.length>1||(row.length===1&&row[0].trim()!=='')) rows.push(row);
      row=[]; field='';
    } else field+=c;
  }
  if(field!==''||row.length){
    row.push(field);
    if(row.length>1||(row.length===1&&row[0].trim()!=='')) rows.push(row);
  }
  return rows;
}
function looksLikeMarkdown(t){
  if(!t) return false;
  const s=t.trim();
  if(s.length<15) return false;
  if(s==='—'||s==='-'||s==='N/A'||s==='na'||s==='NA') return false;
  if(/^https?:\/\/\S+$/.test(s)) return false;
  let n=0;
  if(/^#{1,6}\s/m.test(s)) n++;
  if(/\*\*[^*]+\*\*/.test(s)) n++;
  if(/^\s*[-*+]\s+/m.test(s)) n++;
  if(/^\s*\d+\.\s+/m.test(s)) n++;
  if(/^\s*\|.*\|\s*$/m.test(s)) n++;
  if(/```/.test(s)) n++;
  if(/^\s*>\s/m.test(s)) n++;
  if(/\[[^\]]+\]\([^)]+\)/.test(s)) n++;
  return n>=2||(n>=1&&s.length>100);
}
function mapRowsToObjects(rows){
  if(!rows.length) return [];
  const out=[];
  const padded=rows.slice(1).map(r=>{ const c=r.slice(); while(c.length<EXPECTED_COLUMNS) c.push(''); return c; });
  for(const row of padded){
    if(row.length<3) continue;
    const srno=(row[0]||'').trim(), sWM=(row[1]||'').trim(), mainT=(row[2]||'').trim(),
          subT=(row[3]||'').trim(), job=(row[4]||'').trim(), url=(row[5]||'').trim(),
          sol=(row[6]||'').trim(), date=(row[7]||'').trim(), notes=(row[8]||'').trim();
    let subj=sWM,marks='';
    const m=sWM.match(/;\s*(\d+)\s*$/);
    if(m){ marks=m[1]; subj=sWM.replace(/;\s*\d+\s*$/,'').trim(); }
    const hasUrl=url&&url!=='#'&&url!=='—'&&url.trim()!=='';
    const hasSol=sol&&sol!=='#'&&sol!=='—'&&sol.trim()!=='';
    const hasMd=looksLikeMarkdown(notes);
    const status=(hasUrl||hasSol||hasMd)?'covered':'pending';
    const dT=subT||mainT;
    out.push({
      srno:srno||'—', subject:subj||'—', marks:marks||'—',
      mainTopic:mainT||'—', subTopic:subT||'—', displayTopic:dT||'—',
      url:hasUrl?url:'#', hasUrl, solUrl:hasSol?sol:'', hasSol,
      solFileName:hasSol?extractFileName(sol):'',
      markdownNotes:hasMd?notes:'', hasMarkdown:hasMd,
      status, job:job||'—', lastUpdate:date||''
    });
  }
  return out;
}

/* COUNTS */
function computeCounts(data){
  subjectCounts={}; mainTopicCounts={}; subjectCoverageScoped={};
  const allJobs=new Set();
  data.forEach(item=>{
    if(item.subject&&item.subject!=='—') subjectCounts[item.subject]=(subjectCounts[item.subject]||0)+1;
    if(item.mainTopic&&item.mainTopic!=='—') mainTopicCounts[item.mainTopic]=(mainTopicCounts[item.mainTopic]||0)+1;
    if(item.job&&item.job!=='—') allJobs.add(item.job);
  });
  const scopes=['ALL']; allJobs.forEach(j=>scopes.push('JOB::'+j));
  scopes.forEach(scopeKey=>{
    data.forEach(item=>{
      if(!item.subject||item.subject==='—') return;
      if(scopeKey!=='ALL'){ const jn=scopeKey.slice(5); if(item.job!==jn) return; }
      const k=scopedCoverageKey(item.subject,scopeKey);
      if(!subjectCoverageScoped[k]) subjectCoverageScoped[k]={total:0,done:0};
      subjectCoverageScoped[k].total++;
      if(item.status==='covered') subjectCoverageScoped[k].done++;
    });
  });
}
function getSubjectCoveragePctForScope(subj,jobsSet){
  if(!subj||subj==='—') return 0;
  if(!jobsSet||jobsSet.size<=1){
    const k=buildJobScopeKey(jobsSet);
    const c=subjectCoverageScoped[scopedCoverageKey(subj,k)];
    if(!c||c.total===0) return 0;
    return Math.round((c.done/c.total)*100);
  }
  let t=0,d=0;
  rawData.forEach(item=>{ if(item.subject!==subj) return; if(!jobsSet.has(item.job)) return; t++; if(item.status==='covered') d++; });
  if(t===0) return 0;
  return Math.round((d/t)*100);
}
function getSubjectCountForScope(subj,jobsSet){
  if(!subj||subj==='—') return 0;
  if(!jobsSet||jobsSet.size===0) return subjectCounts[subj]||0;
  let c=0;
  rawData.forEach(item=>{ if(item.subject===subj&&jobsSet.has(item.job)) c++; });
  return c;
}
function updateStats(data){
  statTotal.textContent=data.length;
  statCovered.textContent=data.filter(d=>d.status==='covered').length;
  statPending.textContent=data.filter(d=>d.status==='pending').length;
  statSubjects.textContent=new Set(data.map(d=>d.subject).filter(s=>s!=='—')).size;
}

  else if(selectedJobs.size>1) brandTitle.innerHTML=`Topic Tracker <span class="job-pill">${selectedJobs.size} jobs</span>`;

/* AVAILABLE OPTIONS */
function getAvailableOptions(exclude){
  const aS=exclude==='subject'?new Set():selectedSubjects;
  const aT=exclude==='topic'?new Set():selectedTopics;
  const aJ=exclude==='job'?new Set():selectedJobs;
  const S=new Set(),T=new Set(),J=new Set();
  rawData.forEach(item=>{
    if(selectedStatuses.size>0&&!selectedStatuses.has(item.status)) return;
    if(!matchesGlobalSearch(item,globalSearchTerm)) return;
    if(aS.size>0&&!aS.has(item.subject)) return;
    if(aT.size>0&&!aT.has(item.displayTopic)) return;
    if(aJ.size>0&&!aJ.has(item.job)) return;
    if(exclude==='subject'){
      if(selectedSubjects.size>0&&!selectedSubjects.has(item.subject)) return;
      if(item.subject&&item.subject!=='—') S.add(item.subject);
    } else if(exclude==='topic'){
      if(selectedTopics.size>0&&!selectedTopics.has(item.displayTopic)) return;
      if(item.displayTopic&&item.displayTopic!=='—') T.add(item.displayTopic);
    } else if(exclude==='job'){
      if(selectedJobs.size>0&&!selectedJobs.has(item.job)) return;
      if(item.job&&item.job!=='—') J.add(item.job);
    } else {
      if(item.subject&&item.subject!=='—') S.add(item.subject);
      if(item.displayTopic&&item.displayTopic!=='—') T.add(item.displayTopic);
      if(item.job&&item.job!=='—') J.add(item.job);
    }
  });
  return { subjects:Array.from(S).sort(), topics:Array.from(T).sort(), jobs:Array.from(J).sort() };
}
function pruneSelections(){
  const a=getAvailableOptions('none');
  Array.from(selectedSubjects).forEach(s=>{ if(!a.subjects.includes(s)) selectedSubjects.delete(s); });
  Array.from(selectedTopics).forEach(t=>{ if(!a.topics.includes(t)) selectedTopics.delete(t); });
  Array.from(selectedJobs).forEach(j=>{ if(!a.jobs.includes(j)) selectedJobs.delete(j); });
}

/* MULTI-SELECT */
function buildMultiSelect(container,options,selectedSet,onUpdate,enableSearch){
  const drop=container.querySelector('.ms-drop'), trig=container.querySelector('.ms-trigger'), ph=container.querySelector('.ph');
  function close(){ drop.classList.remove('open'); trig.classList.remove('open'); }
  if(!trig.dataset.la){
    trig.dataset.la='1';
    trig.addEventListener('click',(e)=>{
      e.stopPropagation();
      const isOpen=drop.classList.contains('open');
      document.querySelectorAll('.ms-drop.open').forEach(d=>d.classList.remove('open'));
      document.querySelectorAll('.ms-trigger.open').forEach(t=>t.classList.remove('open'));
      if(!isOpen){
        drop.classList.add('open'); trig.classList.add('open');
        const latest=container._latestRebuild;
        if(latest&&latest._render){
          const si=drop.querySelector('.ms-search');
          if(si){ si.value=''; setTimeout(()=>si.focus(),50); }
          latest._render('');
        }
      }
    });
    document.addEventListener('click',(e)=>{ if(!container.contains(e.target)) close(); });
  }
  function rebuild(newOpts){
    drop.innerHTML='';
    let si=null;
    if(enableSearch){
      si=document.createElement('input');
      si.type='text'; si.className='ms-search'; si.placeholder='Search…';
      si.addEventListener('input',()=>render(si.value));
      si.addEventListener('click',(e)=>e.stopPropagation());
      drop.appendChild(si);
    }
    const act=document.createElement('div'); act.className='ms-actions';
    const ba=document.createElement('button'); ba.textContent='Select all';
    ba.addEventListener('click',(e)=>{
      e.stopPropagation();
      const vis=newOpts.filter(o=>!si||!si.value||o.label.toLowerCase().includes(si.value.toLowerCase()));
      vis.forEach(o=>selectedSet.add(o.value));
      onUpdate(); updateText(); render(si?si.value:'');
    });
    const bc=document.createElement('button'); bc.textContent='Clear';
    bc.addEventListener('click',(e)=>{
      e.stopPropagation();
      selectedSet.clear(); onUpdate(); updateText(); render(si?si.value:'');
    });
    act.appendChild(ba); act.appendChild(bc); drop.appendChild(act);

    function render(ft){
      drop.querySelectorAll('.ms-opt').forEach(el=>el.remove());
      let f=newOpts;
      if(ft&&ft.trim()){ const q=ft.toLowerCase().trim(); f=newOpts.filter(o=>o.label.toLowerCase().includes(q)); }
      if(f.length===0){
        const e=document.createElement('div'); e.className='ms-opt';
        e.style.opacity='0.5'; e.style.cursor='default'; e.textContent='No matches';
        drop.appendChild(e); return;
      }
      f.forEach(o=>{
        const d=document.createElement('div');
        d.className='ms-opt'+(selectedSet.has(o.value)?' selected':'');
        d.innerHTML=`<span class="check"><i class="fas fa-check"></i></span><span>${escapeHtml(o.label)}</span>`;
        d.addEventListener('click',(e)=>{
          e.stopPropagation();
          if(selectedSet.has(o.value)) selectedSet.delete(o.value);
          else selectedSet.add(o.value);
          onUpdate(); updateText(); close();
        });
        drop.appendChild(d);
      });
    }
    function updateText(){
      if(selectedSet.size===0){
        ph.textContent='All '+(container.dataset.type||'items');
        ph.style.display='inline';
        const ex=trig.querySelector('.sel'); if(ex) ex.remove();
      } else {
        ph.style.display='none';
        let sel=trig.querySelector('.sel');
        if(!sel){ sel=document.createElement('span'); sel.className='sel'; trig.insertBefore(sel,trig.querySelector('.chev')); }
        sel.textContent=`${selectedSet.size} selected`; sel.style.display='inline';
      }
    }
    rebuild._render=render; rebuild._updateText=updateText;
    container._latestRebuild=rebuild;
    render(''); updateText();
  }
  rebuild(options);
  return rebuild;
}

function fallbackCopy(t){

  ta.value=t; ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
  ta.setAttribute('readonly',''); document.body.appendChild(ta);

}

/* MARKDOWN */
function renderMarkdown(md){
  if(!md) return '';
  let h=md.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const cb=[];
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>{ const i=cb.length; cb.push(c); return `\u0000CODE${i}\u0000`; });
  const lines=h.split('\n'); const out=[];
  let inT=false,inL=false,lT=null,inQ=false;
  const cl=()=>{ if(inL){ out.push(lT==='ol'?'</ol>':'</ul>'); inL=false; lT=null; } };
  const ct=()=>{ if(inT){ out.push('</tbody></table>'); inT=false; } };
  const cq=()=>{ if(inQ){ out.push('</blockquote>'); inQ=false; } };
  for(let i=0;i<lines.length;i++){
    let l=lines[i];
    const cbm=l.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if(cbm){ cl();ct();cq(); out.push(`<pre><code>${cb[parseInt(cbm[1],10)]}</code></pre>`); continue; }
    const isT=/^\s*\|.*\|\s*$/.test(l);
    const nx=lines[i+1]||'';
    const isS=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(nx);
    if(isT&&isS&&!inT){
      cl();cq(); inT=true; out.push('<table><thead>');
      const cs=parseRow(l); out.push('<tr>'+cs.map(c=>`<th>${inline(c.trim())}</th>`).join('')+'</tr>');
      out.push('</thead><tbody>'); i++; continue;
    }
    if(inT&&isT){ const cs=parseRow(l); out.push('<tr>'+cs.map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>'); continue; }
    if(inT&&!isT) ct();
    if(/^\s*>\s?/.test(l)){ if(!inQ){ cl(); out.push('<blockquote>'); inQ=true; } out.push(inline(l.replace(/^\s*>\s?/,''))); continue; }
    else if(inQ) cq();
    const h1=l.match(/^#\s+(.*)$/),h2=l.match(/^##\s+(.*)$/),h3=l.match(/^###\s+(.*)$/),h4=l.match(/^####\s+(.*)$/);
    if(h1){cl();ct();cq(); out.push(`<h1>${inline(h1[1])}</h1>`); continue;}
    if(h2){cl();ct();cq(); out.push(`<h2>${inline(h2[1])}</h2>`); continue;}
    if(h3){cl();ct();cq(); out.push(`<h3>${inline(h3[1])}</h3>`); continue;}
    if(h4){cl();ct();cq(); out.push(`<h4>${inline(h4[1])}</h4>`); continue;}
    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){ cl();ct();cq(); out.push('<hr>'); continue; }
    const ul=l.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){ ct();cq(); if(!inL||lT!=='ul'){ cl(); out.push('<ul>'); inL=true; lT='ul'; } out.push(`<li>${inline(ul[1])}</li>`); continue; }
    const ol=l.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){ ct();cq(); if(!inL||lT!=='ol'){ cl(); out.push('<ol>'); inL=true; lT='ol'; } out.push(`<li>${inline(ol[1])}</li>`); continue; }
    if(l.trim()===''){ cl();ct();cq(); continue; }
    cl();ct();cq(); out.push(`<p>${inline(l)}</p>`);
  }
  cl();ct();cq();
  return out.join('\n');
}
function parseRow(l){ let t=l.trim(); if(t.startsWith('|')) t=t.slice(1); if(t.endsWith('|')) t=t.slice(0,-1); return t.split('|'); }
function inline(t){
  if(!t) return '';
  let s=t;
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s=s.replace(/_([^_\n]+)_/g,'<em>$1</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

/* ============================================================
   CARD RENDER — NEW LAYOUT
   Row 1: #srno + LARGE subtopic + Job badge
   Row 2: Progress bar (with %) + Date
   Row 3: Topic (with count) · Subject (with count)
   Row 4: Actions
============================================================ */
function renderCards(data){
  if(!data.length){
    cardsContainer.innerHTML=`
      <div class="state">
        <i class="fas fa-magnifying-glass big"></i>
        <div class="state-title">No matching topics</div>
        <div class="state-sub">Try adjusting filters or search query</div>
      </div>`;
    return;
  }

  const showJobBadge = selectedJobs.size === 0;
  const frag=document.createDocumentFragment();

  data.forEach(item=>{
    const card=document.createElement('div');
    card.className=`card ${item.status==='covered'?'is-covered':'is-pending'}`;

    if(item.status==='pending'){
      card.title='Click to copy DeepSeek prompt';
      card.addEventListener('click',(e)=>{
        if(e.target.closest('a,button')) return;
        copyPrompt(item);
      });
    }

    /* -------- ROW 1: srno + large subtopic + job badge -------- */
    const head=document.createElement('div');
    head.className='card-head';

    const headLeft=document.createElement('div');
    headLeft.className='card-head-left';

    const srno=document.createElement('span');
    srno.className='card-srno';
    srno.textContent=`#${item.srno}`;
    headLeft.appendChild(srno);

    const title=document.createElement('a');
    title.className='card-title';
    title.href=`https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
    title.target='_blank';
    title.rel='noopener noreferrer';
    title.title='Search: '+buildGoogleSearchQuery(item);
    title.innerHTML=`${escapeHtml(item.subTopic!=='—'?item.subTopic:'—')} <i class="fas fa-arrow-up-right-from-square"></i>`;
    title.addEventListener('click',(e)=>e.stopPropagation());
    headLeft.appendChild(title);

    head.appendChild(headLeft);

    /* job badge in top-right */
    if(showJobBadge && item.job && item.job!=='—'){
      const badges=document.createElement('div');
      badges.className='card-badges';
      const b=document.createElement('span');
      b.className='badge badge-job';
      b.textContent=item.job;
      b.title='Job: '+item.job;
      badges.appendChild(b);
      head.appendChild(badges);
    }

    card.appendChild(head);

    /* -------- ROW 2: progress bar + date -------- */
    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
    const covCls = covPct===100?'full':(covPct>=50?'mid':'');
    const pctCls = covPct===100?'full':(covPct<50?'low':'');

    const progRow=document.createElement('div');
    progRow.className='card-progress-row';

    const progWrap=document.createElement('div');
    progWrap.className='progress-wrap';
    progWrap.title = `Subject coverage${selectedJobs.size?' for selected job(s)':''}: ${covPct}%`;
    progWrap.innerHTML = `
      <span class="progress-bar">
        <span class="progress-fill ${covCls}" style="width:${covPct}%"></span>
      </span>
      <span class="progress-pct ${pctCls}">${covPct}%</span>
    `;
    progRow.appendChild(progWrap);

    if(item.lastUpdate){
      const d=document.createElement('span');
      d.className='card-date';
      d.innerHTML=`<i class="fas fa-clock"></i>${escapeHtml(item.lastUpdate)}`;
      d.title='Last update';
      progRow.appendChild(d);
    }

    card.appendChild(progRow);

    /* -------- ROW 3: topic · subject meta -------- */
    const meta=document.createElement('div');
    meta.className='card-meta';

    const mainCount = mainTopicCounts[item.mainTopic] || 1;
    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);

    const topicChip=document.createElement('span');
    topicChip.className='meta-chip';
    topicChip.title=`Topic: ${item.mainTopic}`;
    topicChip.innerHTML=`
      <i class="fas fa-folder"></i>
      <span class="meta-label">Topic</span>
      <span class="meta-value">${escapeHtml(item.mainTopic)}</span>
      <span class="count-chip">${mainCount}</span>
    `;
    meta.appendChild(topicChip);

    const subjChip=document.createElement('span');
    subjChip.className='meta-chip';
    subjChip.title=`Subject: ${item.subject}`;
    subjChip.innerHTML=`
      <i class="fas fa-book"></i>
      <span class="meta-label">Subject</span>
      <span class="meta-value">${escapeHtml(item.subject)}</span>
      <span class="count-chip">${subjCount}</span>
    `;
    meta.appendChild(subjChip);

    card.appendChild(meta);

    /* -------- ROW 4: actions -------- */
    const foot=document.createElement('div');
    foot.className='card-foot';

    if(item.hasMarkdown){
      const b=document.createElement('button');
      b.type='button'; b.className='action action-read';
      b.title=`Read notes for "${item.subTopic}"`;
      b.innerHTML=`<i class="fas fa-book-open"></i> Read`;
      b.addEventListener('click',(e)=>{ e.stopPropagation(); openNotesModal(item); });
      foot.appendChild(b);
    }

    if(item.hasUrl){
      const a=document.createElement('a');
      a.href=item.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.className='action action-done';
      a.title='Open complete chat';
      a.innerHTML=`<i class="fas fa-circle-check"></i> Done <i class="fas fa-arrow-up-right-from-square" style="opacity:0.7;"></i>`;
      a.addEventListener('click',(e)=>e.stopPropagation());
      foot.appendChild(a);
    } else {
      const isCov = item.status==='covered';
      const el=document.createElement(isCov?'span':'button');
      el.className='action '+(isCov?'action-done':'action-pending');
      el.title=isCov?'Marked done (has solution / notes)':'Click to copy DeepSeek prompt';
      el.innerHTML=isCov
        ?`<i class="fas fa-circle-check"></i> Done`
        :`<i class="fas fa-clock"></i> Pending <i class="fas fa-copy" style="opacity:0.7;"></i>`;
      if(!isCov) el.addEventListener('click',(e)=>{ e.stopPropagation(); copyPrompt(item); });
      foot.appendChild(el);
    }

    if(item.hasSol){
      const a=document.createElement('a');
      a.href=item.solUrl; a.target='_blank'; a.rel='noopener noreferrer';
      a.className='action action-sol';
      a.title='Open solution file: '+item.solFileName;
      a.innerHTML=`<i class="fas fa-file-lines"></i><span class="label">${escapeHtml(item.solFileName)}</span>`;
      a.addEventListener('click',(e)=>e.stopPropagation());
      foot.appendChild(a);
    }

    card.appendChild(foot);

    frag.appendChild(card);
  });

  cardsContainer.innerHTML='';
  cardsContainer.appendChild(frag);
}

/* POPULATE FILTERS */
function populateFilters(data){
  const S=new Set(),T=new Set(),J=new Set();
  data.forEach(item=>{
    if(item.subject&&item.subject!=='—') S.add(item.subject);
    if(item.displayTopic&&item.displayTopic!=='—') T.add(item.displayTopic);
    if(item.job&&item.job!=='—') J.add(item.job);
  });
  const sO=Array.from(S).sort().map(s=>({value:s,label:s}));
  const tO=Array.from(T).sort().map(t=>({value:t,label:t}));
  const jO=Array.from(J).sort().map(j=>({value:j,label:j}));
  const sW=$('subjectMultiWrap'); sW.dataset.type='subjects';
  if(!rebuildSubjectSelect) rebuildSubjectSelect=buildMultiSelect(sW,sO,selectedSubjects,onFilterChange,true);
  else rebuildSubjectSelect(sO);
  const tW=$('topicMultiWrap'); tW.dataset.type='topics';
  if(!rebuildTopicSelect) rebuildTopicSelect=buildMultiSelect(tW,tO,selectedTopics,onFilterChange,true);
  else rebuildTopicSelect(tO);
  const jW=$('jobMultiWrap'); jW.dataset.type='jobs';
  if(!rebuildJobSelect) rebuildJobSelect=buildMultiSelect(jW,jO,selectedJobs,onFilterChange,true);
  else rebuildJobSelect(jO);
  subjectCountHint.textContent=sO.length;
  topicCountHint.textContent=tO.length;
  jobCountHint.textContent=jO.length;
}

/* SCROLL */
function updateScrollButtons(){
  const y=window.scrollY||0;
  const maxY=(document.documentElement.scrollHeight||document.body.scrollHeight)-window.innerHeight;
  fabScrollTop.classList.toggle('hidden', y<100);
  fabScrollBottom.classList.toggle('hidden', maxY<=0||y>=maxY-100);
}
let scrollTick=false;
window.addEventListener('scroll',()=>{
  if(scrollTick) return;
  scrollTick=true;
  requestAnimationFrame(()=>{ scrollTick=false; updateScrollButtons(); saveScrollPosition(); });
},{passive:true});
fabScrollTop.addEventListener('click',()=>{ window.scrollTo({top:0,behavior:'smooth'}); try{ localStorage.setItem(LS_SCROLL_KEY,'0'); }catch(e){} });
fabScrollBottom.addEventListener('click',()=>{ const t=document.documentElement.scrollHeight||document.body.scrollHeight; window.scrollTo({top:t,behavior:'smooth'}); });
function restoreScrollPosition(){ const y=getSavedScrollPosition(); if(y>0) requestAnimationFrame(()=>window.scrollTo(0,y)); }

/* LOAD */
function setRefreshLoading(l){ isLoading=l; fabRefresh.classList.toggle('loading',l); }
async function fetchFreshData(){
  const res=await fetch(CSV_URL+`&_=${Date.now()}`,{cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const t=await res.text();
  if(t.trim().startsWith('<!DOCTYPE')||t.trim().startsWith('<html')) throw new Error('Sheet is not public. Share as "Anyone with link can view".');
  const rows=parseCSV(t);
  if(rows.length<2) throw new Error('No data rows');
  const d=mapRowsToObjects(rows);
  if(!d.length) throw new Error('No parsed data');
  return d;
}
function applyDataAndRender(data,opts){
  opts=opts||{};
  rawData=data;
  computeCounts(rawData);
  populateFilters(rawData);
  if(opts.isFirstLoad){
    setupStatusSegments();
    cbCovered.classList.toggle('active',selectedStatuses.has('covered'));
    cbPending.classList.toggle('active',selectedStatuses.has('pending'));
    refreshAllFilters(); applyFiltersAndRender(); restoreScrollPosition();
  } else { refreshAllFilters(); applyFiltersAndRender(); }
  requestAnimationFrame(updateScrollButtons);
}
function renderSkeletons(){
  let h='';
  for(let i=0;i<6;i++) h+=`<div class="skeleton-card">
    <div class="sk-line w40"></div><div class="sk-line h20 w80"></div>
    <div class="sk-line w60"></div><div class="sk-line w40"></div></div>`;
  cardsContainer.innerHTML=h;
}
async function refreshFromNetwork(opts){
  opts=opts||{};
  if(isLoading) return;
  if(opts.isManual) setRefreshLoading(true); else renderSkeletons();
  try{
    const fresh=await fetchFreshData();
    saveDataToStorage(fresh);
    applyDataAndRender(fresh,{isFirstLoad:opts.isFirstLoad});
    if(opts.isManual) showToast('Data refreshed');
  } catch(err){
    console.error('Fetch error:',err);
    if(opts.isManual) showToast('Refresh failed — check console');
    else cardsContainer.innerHTML=`<div class="state"><i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i><div class="state-title">Couldn't load sheet</div><div class="state-sub">${escapeHtml(err.message)}</div></div>`;
  } finally { if(opts.isManual) setRefreshLoading(false); }
}

/* SEARCH */
function updateSearchClearButton(){ globalSearchClear.classList.toggle('visible',!!(globalSearchTerm&&globalSearchTerm.trim())); }
globalSearchInput.addEventListener('input',()=>{
  if(globalSearchInput.value===globalSearchTerm) return;
  globalSearchTerm=globalSearchInput.value;
  updateSearchClearButton(); scheduleFastFilterRefresh();
});
globalSearchClear.addEventListener('click',()=>{
  globalSearchInput.value=''; globalSearchTerm='';
  updateSearchClearButton(); scheduleFastFilterRefresh(); globalSearchInput.focus();
});

/* INIT */
(async function init(){
  loadFiltersFromStorage();
  cbCovered.classList.toggle('active',selectedStatuses.has('covered'));
  cbPending.classList.toggle('active',selectedStatuses.has('pending'));
  if(globalSearchTerm) globalSearchInput.value=globalSearchTerm;
  updateSearchClearButton();
  const cached=loadDataFromStorage();
  if(cached){ applyDataAndRender(cached,{isFirstLoad:true}); }
  else {
    renderSkeletons();
    try{
      const fresh=await fetchFreshData();
      saveDataToStorage(fresh);
      applyDataAndRender(fresh,{isFirstLoad:true});
    } catch(err){
      console.error('Init fetch error:',err);
      cardsContainer.innerHTML=`<div class="state"><i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i><div class="state-title">Couldn't load sheet</div><div class="state-sub">${escapeHtml(err.message)}</div></div>`;
    }
  }
})();

fabRefresh.addEventListener('click',()=>{ clearPersistedData(); refreshFromNetwork({isManual:true,isFirstLoad:false}); });
window.addEventListener('beforeunload',saveScrollPosition);

})();
</script>
</body>
