<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<meta name="theme-color" content="#0a0a0b">
<title>Topic Tracker — Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg-0:#0a0a0b; --bg-1:#101012; --bg-2:#16161a; --bg-3:#1c1c21;
  --bg-4:#232329; --bg-inset:#0d0d0f; --bg-hover:#1f1f25;
  --border:#26262c; --border-strong:#33333b; --border-subtle:#1c1c22;
  --text:#ffffff; --text-1:#e8e8ec; --text-2:#b4b4bd; --text-3:#86868f; --text-faint:#5c5c66;
  --accent:#a5b4fc; --accent-bright:#c7d2fe; --accent-deep:#6366f1;
  --accent-soft:rgba(129,140,248,0.14); --accent-softer:rgba(129,140,248,0.07);
  --accent-glow:rgba(129,140,248,0.28);
  --success:#34d399; --success-bright:#6ee7b7;
  --success-soft:rgba(52,211,153,0.14); --success-glow:rgba(52,211,153,0.32);
  --warn:#fbbf24; --warn-bright:#fcd34d;
  --warn-soft:rgba(251,191,36,0.14); --warn-glow:rgba(251,191,36,0.32);
  --danger:#fb7185; --danger-soft:rgba(251,113,133,0.14);
  --radius-sm:6px; --radius:10px; --radius-lg:13px; --radius-xl:16px;
  --ring:0 0 0 3px rgba(129,140,248,0.25);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.5);
  --shadow-md:0 4px 14px -2px rgba(0,0,0,0.55),0 2px 6px -2px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,0.65),0 4px 12px -4px rgba(0,0,0,0.45);
  --shadow-xl:0 32px 72px -12px rgba(0,0,0,0.8),0 8px 24px -8px rgba(0,0,0,0.55);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --header-h:58px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-sans);
  font-feature-settings:'cv02','cv03','cv04','cv11','ss01';
  background:var(--bg-0); color:var(--text);
  font-size:15px; font-weight:500; line-height:1.55;
  min-height:100vh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,0.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(139,92,246,0.06), transparent 60%);
  background-attachment:fixed;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; opacity:0.022; z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
}
body.locked{ overflow:hidden; }
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
a{color:inherit;}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:100; height:var(--header-h);
  background:rgba(10,10,11,0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; padding:0 22px;
}
.app-header-inner{
  max-width:1440px; width:100%; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}

.brand{ display:flex; align-items:center; gap:12px; min-width:0; }

/* FILTER BUTTON (top-left icon) */
.header-icon-btn{
  width:36px; height:36px; border-radius:10px;
  display:grid; place-items:center;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--text-2);
  font-size:14px; flex-shrink:0;
  transition:all 0.18s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  box-shadow:var(--shadow-sm);
}
.header-icon-btn:hover{
  background:var(--bg-3); color:#fff;
  border-color:var(--border-strong);
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
}
.header-icon-btn:active{ transform:translateY(0) scale(0.96); }
.header-icon-btn.active{
  background:var(--accent-soft); color:var(--accent-bright);
  border-color:rgba(129,140,248,0.4);
  box-shadow:0 0 14px -4px var(--accent-glow);
}
.header-icon-btn .badge-dot{
  position:absolute; top:-3px; right:-3px;
  min-width:16px; height:16px; padding:0 5px;
  border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#7c3aed);
  color:#fff; font-size:9px; font-weight:700;
  display:none; align-items:center; justify-content:center;
  border:2px solid var(--bg-0);
  box-shadow:0 0 10px -2px var(--accent-glow);
  line-height:1;
}
.header-icon-btn .badge-dot.show{ display:flex; }

.brand-text{ display:flex; flex-direction:column; min-width:0; line-height:1.2; }
.brand-title{
  font-size:15px; font-weight:700; letter-spacing:-0.015em;
  color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:8px;
}
.brand-title .job-pill{
  font-size:12px; font-weight:600;
  background:var(--accent-soft); color:var(--accent-bright);
  border:1px solid rgba(129,140,248,0.3);
  padding:3px 9px; border-radius:20px;
  box-shadow:0 0 14px -2px var(--accent-glow);
}
.brand-sub{ font-size:12px; color:var(--text-3); font-weight:500; }

.header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:600; letter-spacing:-0.005em;
  transition:all 0.15s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap; user-select:none; border:1px solid transparent;
}
.btn i{ font-size:12px; }
.btn-ghost{
  color:var(--text-1); border-color:var(--border);
  background:var(--bg-2); box-shadow:var(--shadow-sm);
}
.btn-ghost:hover{
  background:var(--bg-3); border-color:var(--border-strong);
  color:#fff; transform:translateY(-1px); box-shadow:var(--shadow-md);
}
.btn-primary{
  background:linear-gradient(135deg,#6366f1,#7c3aed);
  color:#fff; border-color:rgba(129,140,248,0.4);
  box-shadow:0 0 0 1px rgba(255,255,255,0.1) inset,0 4px 14px -2px rgba(99,102,241,0.55);
}
.btn-primary:hover{
  background:linear-gradient(135deg,#7c3aed,#8b5cf6);
  transform:translateY(-1px);
  box-shadow:0 0 0 1px rgba(255,255,255,0.15) inset,0 6px 20px -2px rgba(99,102,241,0.65);
}

/* ============ CONTAINER ============ */
.container{ max-width:1440px; margin:0 auto; padding:22px; position:relative; z-index:2; }

/* ============ ACTIVE FILTERS BAR ============ */
.active-filters{
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:0 4px 14px;
  min-height:0;
}
.active-filters:empty{ display:none; }
.chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 10px 6px 12px;
  border-radius:20px;
  background:var(--bg-2); border:1px solid var(--border);
  font-size:12.5px; font-weight:600;
  color:var(--text-1);
  transition:all 0.15s ease;
  cursor:default;
  max-width:100%;
}
.chip i.chip-icon{
  font-size:10px; color:var(--text-3);
}
.chip .chip-text{
  max-width:180px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
}
.chip .chip-remove{
  width:16px; height:16px; border-radius:50%;
  display:grid; place-items:center;
  color:var(--text-3); font-size:9px;
  transition:all 0.12s ease;
  cursor:pointer;
}
.chip .chip-remove:hover{
  background:var(--danger-soft); color:var(--danger);
}
.chip.clear-all{
  background:var(--danger-soft); color:var(--danger);
  border-color:rgba(251,113,133,0.3);
  cursor:pointer;
}
.chip.clear-all:hover{
  background:var(--danger); color:#fff;
  border-color:var(--danger);
}

/* ============ STATS ============ */
.stats-grid{
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr));
  gap:10px; margin-bottom:16px;
}
.stat-card{
  background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg-1) 100%);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 14px; box-shadow:var(--shadow-sm);
  display:flex; align-items:center; gap:12px;
  position:relative; overflow:hidden;
  transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
  min-width:0;
}
.stat-card::before{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
}
.stat-card:hover{ border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.stat-icon{
  width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; font-size:13px;
  background:var(--bg-3); color:var(--text-2);
  border:1px solid var(--border); flex-shrink:0;
}
.stat-card.is-success .stat-icon{
  background:var(--success-soft); color:var(--success);
  border-color:rgba(52,211,153,0.28); box-shadow:0 0 16px -4px var(--success-glow);
}
.stat-card.is-warn .stat-icon{
  background:var(--warn-soft); color:var(--warn);
  border-color:rgba(251,191,36,0.28); box-shadow:0 0 16px -4px var(--warn-glow);
}
.stat-card.is-accent .stat-icon{
  background:var(--accent-soft); color:var(--accent);
  border-color:rgba(129,140,248,0.28); box-shadow:0 0 16px -4px var(--accent-glow);
}
.stat-body{ display:flex; flex-direction:column; min-width:0; line-height:1.15; gap:2px; }
.stat-label{
  font-size:11px; font-weight:700; color:var(--text-3);
  text-transform:uppercase; letter-spacing:0.07em; white-space:nowrap;
}
.stat-value{
  font-size:19px; font-weight:700; letter-spacing:-0.02em;
  color:#fff; font-variant-numeric:tabular-nums;
}
.stat-card.is-success .stat-value{ color:var(--success-bright); }
.stat-card.is-warn .stat-value{ color:var(--warn-bright); }
.stat-card.is-accent .stat-value{ color:var(--accent-bright); }

/* ============ RESULTS META ============ */
.results-meta{
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4px 12px; font-size:13px;
  color:var(--text-2); font-weight:500;
}
.results-meta .count-strong{ color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }

/* ============ CARDS ============ */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(340px,1fr));
  gap:12px;
}
.card{
  background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg-1) 100%);
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:16px 18px; box-shadow:var(--shadow-sm);
  transition:all 0.22s cubic-bezier(0.4,0,0.2,1);
  display:flex; flex-direction:column; gap:12px;
  position:relative; overflow:hidden; min-width:0;
}
.card::before{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent);
  pointer-events:none;
}
.card::after{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--border-strong);
  transition:background 0.25s ease, box-shadow 0.25s ease;
}
.card.is-covered::after{
  background:linear-gradient(180deg,var(--success),#059669);
  box-shadow:0 0 14px -2px var(--success-glow);
}
.card.is-pending::after{
  background:linear-gradient(180deg,var(--warn),#d97706);
  box-shadow:0 0 14px -2px var(--warn-glow);
}
.card.is-pending{ cursor:pointer; }
.card:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); transform:translateY(-2px); }
.card.is-pending:hover{ background:linear-gradient(180deg,var(--bg-3) 0%,var(--bg-2) 100%); }

.card-top{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; min-width:0;
}
.card-title-block{ min-width:0; flex:1; }
.card-srno{
  display:inline-flex; align-items:center;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--text-2); background:var(--bg-inset);
  padding:3px 8px; border-radius:5px; margin-bottom:7px;
  letter-spacing:0.02em; border:1px solid var(--border-subtle);
}
.card-title{
  font-size:16.5px; font-weight:700; color:#fff;
  letter-spacing:-0.015em; line-height:1.3;
  text-decoration:none;
  display:inline-flex; align-items:center; gap:7px;
  transition:color 0.15s ease; word-break:break-word;
}
.card-title:hover{ color:var(--accent-bright); }
.card-title i{
  font-size:11px; opacity:0.45;
  transition:opacity 0.15s ease, transform 0.15s ease;
}
.card-title:hover i{ opacity:1; transform:translate(1px,-1px); }

.card-badges{
  display:flex; flex-direction:column; align-items:flex-end;
  gap:5px; flex-shrink:0; max-width:45%;
}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:600;
  padding:4px 10px; border-radius:20px;
  letter-spacing:0.01em; white-space:nowrap;
  border:1px solid transparent;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
}
.badge-job{
  background:var(--accent-soft); color:var(--accent-bright);
  border-color:rgba(129,140,248,0.3);
  box-shadow:0 0 12px -4px var(--accent-glow);
}
.badge-date{
  background:transparent; color:var(--text-3);
  font-weight:500; padding:0; font-size:11.5px;
}
.badge-date i{ font-size:10px; margin-right:2px; }

.card-meta{ display:flex; flex-direction:column; gap:7px; font-size:13.5px; }
.meta-line{ display:flex; align-items:center; gap:7px; color:var(--text-1); flex-wrap:wrap; }
.meta-line i{ font-size:12px; color:var(--text-3); width:15px; text-align:center; flex-shrink:0; }
.meta-line .value{ font-weight:500; word-break:break-word; color:var(--text-1); }
.meta-line .value.strong{ color:#fff; font-weight:600; }
.count-chip{
  font-size:11px; font-weight:700;
  background:var(--bg-inset); color:var(--text-2);
  padding:2px 7px; border-radius:20px; margin-left:2px;
  font-variant-numeric:tabular-nums;
  border:1px solid var(--border-subtle);
}

.card-progress-wrap{ display:flex; flex-direction:column; gap:7px; margin-top:2px; }
.progress-head{
  display:flex; align-items:center; justify-content:space-between;
  font-size:11px; font-weight:700; color:var(--text-3);
  text-transform:uppercase; letter-spacing:0.06em;
}
.progress-head .progress-value{
  color:#fff; font-weight:700; font-size:13px;
  font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0;
}
.progress-track{
  height:7px; background:var(--bg-inset); border-radius:4px;
  overflow:hidden; position:relative;
  border:1px solid var(--border-subtle);
}
.progress-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg,#d97706,var(--warn));
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  position:relative; box-shadow:0 0 14px -2px var(--warn-glow);
}
.progress-fill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.25),transparent 60%);
  border-radius:inherit;
}
.progress-fill.mid{ background:linear-gradient(90deg,var(--accent-deep),var(--accent-bright)); box-shadow:0 0 14px -2px var(--accent-glow); }
.progress-fill.full{ background:linear-gradient(90deg,#059669,var(--success-bright)); box-shadow:0 0 14px -2px var(--success-glow); }

.card-foot{
  display:flex; align-items:center; justify-content:flex-end;
  gap:7px; padding-top:6px; flex-wrap:wrap;
}
.card-actions{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
.action{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:600;
  padding:6px 12px; border-radius:var(--radius-sm);
  transition:all 0.15s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap; border:1px solid transparent;
  text-decoration:none; letter-spacing:-0.005em;
}
.action i{ font-size:11px; }
.action-read{ background:var(--bg-inset); color:var(--text-1); border-color:var(--border); }
.action-read:hover{
  background:linear-gradient(135deg,#6366f1,#7c3aed);
  color:#fff; border-color:rgba(129,140,248,0.45);
  transform:translateY(-1px);
  box-shadow:0 4px 14px -2px rgba(99,102,241,0.55);
}
.action-done{ background:var(--success-soft); color:var(--success-bright); border-color:rgba(52,211,153,0.32); }
.action-done:hover{
  background:linear-gradient(135deg,#059669,#10b981); color:#fff;
  border-color:rgba(52,211,153,0.55); transform:translateY(-1px);
  box-shadow:0 4px 14px -2px rgba(16,185,129,0.55);
}
.action-pending{ background:var(--warn-soft); color:var(--warn-bright); border-color:rgba(251,191,36,0.32); }
.action-pending:hover{
  background:linear-gradient(135deg,#d97706,#f59e0b); color:#fff;
  border-color:rgba(251,191,36,0.55); transform:translateY(-1px);
  box-shadow:0 4px 14px -2px rgba(245,158,11,0.55);
}
.action-sol{ background:var(--bg-inset); color:var(--text-1); border-color:var(--border); max-width:140px; }
.action-sol:hover{ border-color:var(--border-strong); color:#fff; background:var(--bg-hover); }
.action-sol .label{ overflow:hidden; text-overflow:ellipsis; max-width:96px; }

/* ============ LOAD MORE ============ */
.load-more-wrap{
  display:flex; flex-direction:column; align-items:center; gap:12px;
  padding:32px 20px 20px; margin-top:8px;
}
.load-more-count{
  font-size:13px; font-weight:500; color:var(--text-3);
  font-variant-numeric:tabular-nums; letter-spacing:0.01em;
}
.load-more-count .num{ color:#fff; font-weight:700; }
.load-more-btn{
  display:inline-flex; align-items:center; gap:9px;
  padding:12px 24px; border-radius:var(--radius);
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));
  border:1px solid var(--border-strong); color:#fff;
  font-size:14px; font-weight:600; letter-spacing:-0.005em;
  transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}
.load-more-btn::before{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
}
.load-more-btn:hover{
  background:linear-gradient(180deg,var(--bg-4),var(--bg-3));
  border-color:rgba(129,140,248,0.4);
  transform:translateY(-2px);
  box-shadow:var(--shadow-lg),0 0 24px -6px var(--accent-glow);
}
.load-more-btn i{ font-size:12px; transition:transform 0.2s ease; }
.load-more-btn:hover i{ transform:translateY(2px); }
.all-loaded{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 20px; border-radius:30px;
  background:var(--bg-inset); border:1px solid var(--border-subtle);
  color:var(--text-3); font-size:13px; font-weight:600;
}
.all-loaded i{ color:var(--success); font-size:12px; }

/* ============ STATE ============ */
.state{
  grid-column:1 / -1; padding:60px 24px; text-align:center;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px dashed var(--border-strong);
  border-radius:var(--radius-lg); color:var(--text-1); font-size:14px;
}
.state i.big{ font-size:28px; color:var(--text-3); margin-bottom:12px; display:block; }
.state .state-title{ font-weight:600; color:#fff; margin-bottom:5px; font-size:15px; }
.state .state-sub{ font-size:13px; color:var(--text-3); }

.skeleton-card{
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; display:flex; flex-direction:column; gap:13px;
}
.sk-line{
  height:13px; border-radius:4px;
  background:linear-gradient(90deg,var(--bg-3) 25%,var(--bg-4) 50%,var(--bg-3) 75%);
  background-size:200% 100%; animation:sk 1.6s ease-in-out infinite;
}
.sk-line.w40{ width:40%; } .sk-line.w60{ width:60%; } .sk-line.w80{ width:80%; }
.sk-line.h16{ height:16px; } .sk-line.h20{ height:20px; }
@keyframes sk{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

/* ============ FAB ============ */
.fab-cluster{
  position:fixed; bottom:22px; left:22px;
  display:flex; flex-direction:column; gap:9px; z-index:500;
}
.fab{
  width:44px; height:44px; border-radius:13px;
  display:grid; place-items:center;
  background:rgba(22,22,26,0.88);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--border-strong);
  color:var(--text-1); font-size:15px;
  box-shadow:var(--shadow-lg);
  transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
  -webkit-tap-highlight-color:transparent; position:relative;
}
.fab::before{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
  border-radius:inherit; pointer-events:none;
}
.fab:hover{
  background:var(--bg-3); color:#fff;
  border-color:var(--border-strong); transform:translateY(-2px);
  box-shadow:var(--shadow-xl);
}
.fab:active{ transform:translateY(0) scale(0.96); }
.fab.hidden{ opacity:0; pointer-events:none; transform:scale(0.7) translateY(10px); }
.fab-primary{
  background:linear-gradient(135deg,#6366f1,#7c3aed); color:#fff;
  border-color:rgba(129,140,248,0.45);
  box-shadow:0 0 0 1px rgba(255,255,255,0.1) inset,0 8px 24px -4px rgba(99,102,241,0.6),0 2px 8px -2px rgba(99,102,241,0.45);
}
.fab-primary:hover{
  background:linear-gradient(135deg,#7c3aed,#8b5cf6); color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,0.15) inset,0 12px 32px -4px rgba(99,102,241,0.75),0 4px 12px -2px rgba(99,102,241,0.55);
}
.fab-primary.loading{ pointer-events:none; }
.fab-primary.loading i{ animation:spin 0.8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============ POPUP (generic) ============ */
.popup-overlay{
  position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:none; align-items:flex-start; justify-content:center;
  padding:60px 20px 20px; overflow-y:auto;
  opacity:0; transition:opacity 0.22s ease;
}
.popup-overlay.open{ display:flex; opacity:1; }
.popup{
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--border-strong);
  border-radius:var(--radius-xl);
  width:100%; max-width:760px;
  box-shadow:var(--shadow-xl),0 0 0 1px rgba(255,255,255,0.03) inset;
  overflow:hidden; position:relative;
  transform:translateY(16px) scale(0.97);
  transition:transform 0.3s cubic-bezier(0.34,1.15,0.64,1);
}
.popup-overlay.open .popup{ transform:translateY(0) scale(1); }
.popup::before{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(129,140,248,0.35),transparent);
  pointer-events:none;
}
.popup.narrow{ max-width:680px; }
.popup.wide{ max-width:900px; }

.popup-head{
  padding:18px 22px;
  border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:flex-start; gap:12px;
  background:rgba(0,0,0,0.18);
}
.popup-head-text{ flex:1; min-width:0; }
.popup-title{
  font-size:17px; font-weight:700; color:#fff;
  letter-spacing:-0.01em; line-height:1.3;
  display:flex; align-items:center; gap:9px; word-break:break-word;
}
.popup-title i{ color:var(--accent-bright); font-size:14px; flex-shrink:0; filter:drop-shadow(0 0 8px var(--accent-glow)); }
.popup-sub{
  font-size:12.5px; font-weight:500; color:var(--text-2);
  margin-top:4px; word-break:break-word;
}
.popup-close{
  width:32px; height:32px; border-radius:8px;
  display:grid; place-items:center;
  color:var(--text-2); font-size:14px; flex-shrink:0;
  transition:all 0.15s ease;
}
.popup-close:hover{ background:var(--danger-soft); color:var(--danger); }

.popup-body{
  padding:20px 22px; overflow-y:auto;
  max-height:calc(100vh - 200px);
  background:var(--bg-1);
}

/* Search inside popup */
.popup-search{ position:relative; margin-bottom:16px; }
.popup-search i{
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  color:var(--text-3); font-size:13px; pointer-events:none;
  transition:color 0.15s ease;
}
.popup-search:focus-within i{ color:var(--accent); }
.popup-search input{

}
.popup-search input::placeholder{ color:var(--text-faint); font-weight:500; }
.popup-search input:focus{ border-color:var(--accent-deep); box-shadow:var(--ring),var(--shadow-md); background:var(--bg-2); }
.popup-search .search-clear{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  color:var(--text-3); font-size:13px; transition:all 0.12s ease;
}
.popup-search .search-clear:hover{ background:var(--danger-soft); color:var(--danger); }
.popup-search .search-clear.visible{ display:flex; }

/* Filter sections inside popup */
.filter-section{ margin-bottom:16px; }
.filter-section:last-of-type{ margin-bottom:0; }
.filter-section-title{
  display:flex; align-items:center; gap:8px;

}

.filter-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

.filter-group{ min-width:0; }
.filter-label{
  display:flex; align-items:center; justify-content:space-between;

}

  padding:2px 8px; border-radius:20px;
  letter-spacing:0; text-transform:none;
  border:1px solid var(--border); font-variant-numeric:tabular-nums;
}

/* Multi-select */
.ms{ position:relative; }
.ms-trigger{
  width:100%; padding:9px 12px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));
  font-size:14px; font-weight:500; color:#fff;
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; min-height:40px;
  transition:all 0.15s cubic-bezier(0.4,0,0.2,1);
  box-shadow:var(--shadow-sm); user-select:none;
}
.ms-trigger:hover{ border-color:var(--border-strong); background:var(--bg-3); }
.ms-trigger.open{ border-color:var(--accent-deep); box-shadow:var(--ring); background:var(--bg-3); }
.ms-trigger .ph{ color:var(--text-faint); font-weight:500; }
.ms-trigger .sel{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--accent-bright); font-weight:600; }
.ms-trigger i.chev{ font-size:11px; color:var(--text-3); transition:transform 0.2s ease; }
.ms-trigger.open i.chev{ transform:rotate(180deg); }

.ms-drop{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--bg-3); border:1px solid var(--border-strong);
  border-radius:var(--radius); box-shadow:var(--shadow-xl);
  max-height:280px; overflow-y:auto; z-index:200;
  display:none; padding:6px;
}
.ms-drop.open{ display:block; animation:dropIn 0.16s cubic-bezier(0.34,1.3,0.64,1); }
@keyframes dropIn{ from{ opacity:0; transform:translateY(-4px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
.ms-search{
  width:100%; padding:8px 11px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:500; color:#fff; outline:none;
  background:var(--bg-inset); transition:all 0.15s ease; margin-bottom:4px;
}
.ms-search:focus{ border-color:var(--accent-deep); background:var(--bg-2); box-shadow:var(--ring); }
.ms-search::placeholder{ color:var(--text-faint); font-weight:500; }
.ms-opt{
  display:flex; align-items:center; gap:9px;
  padding:8px 9px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:500; color:var(--text-1);
  cursor:pointer; transition:all 0.12s ease; word-break:break-word;
}
.ms-opt:hover{ background:var(--bg-hover); color:#fff; }
.ms-opt.selected{ background:var(--accent-soft); color:var(--accent-bright); }
.ms-opt .check{
  width:16px; height:16px; border-radius:4px;
  border:1.5px solid var(--border-strong); background:transparent;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.12s ease;
}
.ms-opt .check i{ font-size:9px; color:white; opacity:0; transition:opacity 0.12s ease; }
.ms-opt.selected .check{ background:var(--accent-deep); border-color:var(--accent-deep); box-shadow:0 0 10px -2px var(--accent-glow); }
.ms-opt.selected .check i{ opacity:1; }
.ms-actions{
  display:flex; gap:6px; padding:6px 4px 2px;
  border-top:1px solid var(--border-subtle); margin-top:4px;
}
.ms-actions button{
  flex:1; padding:7px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-2);
  font-size:12px; font-weight:600; color:var(--text-1);
  transition:all 0.12s ease;
}
.ms-actions button:hover{ background:var(--bg-hover); border-color:var(--border-strong); color:#fff; }

/* Status row */
.status-row{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.segmented{
  display:inline-flex; background:var(--bg-inset);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:3px; gap:2px;
}
.seg-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 16px; border-radius:7px;
  font-size:13px; font-weight:600; color:var(--text-3);
  transition:all 0.15s ease; user-select:none;
}

.seg-btn:hover{ color:var(--text-1); }
.seg-btn.active{ background:var(--bg-3); color:#fff; box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.05); }

.seg-btn.active[data-status="pending"]{ color:var(--warn-bright); background:var(--warn-soft); box-shadow:0 0 14px -4px var(--warn-glow); }

/* popup footer */
.popup-foot{
  padding:14px 22px; border-top:1px solid var(--border-subtle);
  background:rgba(0,0,0,0.18);
  display:flex; justify-content:space-between;
  gap:8px; flex-wrap:wrap; align-items:center;
}
.popup-foot .foot-left{ display:flex; gap:8px; flex-wrap:wrap; }
.popup-foot .foot-right{ display:flex; gap:8px; flex-wrap:wrap; }
.btn-reset{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 16px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--bg-2);
  font-size:13px; font-weight:600; color:var(--text-1);
  transition:all 0.15s ease;
}
.btn-reset:hover{ border-color:rgba(251,113,133,0.45); color:var(--danger); background:var(--danger-soft); }
.btn-reset i{ font-size:11px; transition:transform 0.4s ease; }
.btn-reset:hover i{ transform:rotate(-180deg); }

/* ============ REPORT TREE ============ */
.report-empty{
  padding:40px 20px; text-align:center;

}

.report-tree{ display:flex; flex-direction:column; gap:8px; }

.tree-job{

}

}

}

.tree-job-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }

}

}

}

}

}

}

.tree-subject-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.tree-subject-name{
  font-size:13.5px; font-weight:600; color:var(--text-1);

}
.tree-subject-meta{
  font-size:11px; color:var(--text-3); font-weight:500;

}
.tree-subject-meta .item{ display:inline-flex; align-items:center; gap:4px; }
.tree-subject-meta i{ font-size:9px; }

.tree-subject-body{

}

.tree-topics{

}

}

}
.tree-topic-head:hover{ background:var(--bg-hover); }
.tree-topic-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.tree-topic-name{
  font-size:13px; font-weight:600; color:var(--text-1);

}
.tree-topic-meta{

}

.modal-close{
  width:32px; height:32px; border-radius:8px;
  display:grid; place-items:center;
  color:var(--text-2); font-size:14px; flex-shrink:0;
  transition:all 0.15s ease;
}
.modal-close:hover{ background:var(--danger-soft); color:var(--danger); }
.modal-body{
  padding:26px 28px; overflow-y:auto; flex:1;
  font-size:15px; line-height:1.7; color:var(--text-1);
  background:var(--bg-1);
}
.modal-body::-webkit-scrollbar{ width:10px; }
.modal-body::-webkit-scrollbar-track{ background:transparent; }
.modal-body::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:3px solid var(--bg-1); }
.modal-body::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
.modal-body h1{
  font-size:24px; font-weight:700; color:#fff;
  letter-spacing:-0.02em; margin:26px 0 14px;
  line-height:1.25; padding-bottom:12px;
  border-bottom:1px solid var(--border-subtle);
}
.modal-body h1:first-child{ margin-top:0; }
.modal-body h2{ font-size:19px; font-weight:700; color:#fff; letter-spacing:-0.01em; margin:24px 0 12px; line-height:1.3; }
.modal-body h3{ font-size:16.5px; font-weight:700; color:#fff; margin:20px 0 10px; }
.modal-body h4{ font-size:14.5px; font-weight:700; color:var(--text-1); margin:16px 0 8px; text-transform:uppercase; letter-spacing:0.04em; }
.modal-body p{ margin:11px 0; word-break:break-word; }
.modal-body strong{ font-weight:700; color:#fff; }
.modal-body em{ font-style:italic; color:var(--text-1); }
.modal-body ul,.modal-body ol{ margin:11px 0 11px 24px; }
.modal-body li{ margin:6px 0; word-break:break-word; }
.modal-body li::marker{ color:var(--text-3); }
.modal-body code{
  background:var(--bg-3); color:#f0abfc;
  padding:2px 7px; border-radius:5px;
  font-family:var(--font-mono); font-size:13px;
  font-weight:500; word-break:break-word;
  border:1px solid var(--border-subtle);
}
.modal-body pre{
  background:#08080a; color:#e2e8f0;
  padding:16px 18px; border-radius:var(--radius);
  overflow-x:auto; margin:16px 0;
  font-size:13px; line-height:1.6; border:1px solid var(--border);
}
.modal-body pre code{ background:transparent; color:inherit; padding:0; border:none; font-size:inherit; }
.modal-body blockquote{
  border-left:3px solid var(--accent-deep);
  background:var(--accent-softer);
  padding:12px 18px; margin:16px 0;
  border-radius:0 var(--radius) var(--radius) 0;
  color:var(--text-1); font-style:italic;
}
.modal-body hr{ border:none; border-top:1px solid var(--border-subtle); margin:22px 0; }
.modal-body a{ color:var(--accent-bright); text-decoration:underline; text-underline-offset:2px; word-break:break-word; }
.modal-body a:hover{ color:var(--accent); }
.modal-body table{
  width:100%; border-collapse:separate; border-spacing:0;
  margin:16px 0; font-size:14px;
  border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden;
}
.modal-body thead{ background:var(--bg-3); }
.modal-body th{
  padding:12px 16px; text-align:left;
  font-weight:700; font-size:12px; color:var(--text-1);
  text-transform:uppercase; letter-spacing:0.05em;
  border-bottom:1px solid var(--border); word-break:break-word;
}
.modal-body td{
  padding:10px 16px;
  border-bottom:1px solid var(--border-subtle);
  vertical-align:top; word-break:break-word;
  color:var(--text-1);
}
.modal-body tbody tr:last-child td{ border-bottom:none; }
.modal-body tbody tr:hover{ background:rgba(255,255,255,0.025); }
.modal-foot{
  padding:14px 22px; border-top:1px solid var(--border-subtle);
  background:rgba(0,0,0,0.18);
  display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;
}

/* ============ TOAST ============ */
.toast{
  position:fixed; bottom:26px; left:50%;
  transform:translateX(-50%) translateY(120%);
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));
  color:#fff; padding:12px 18px; border-radius:11px;
  font-size:14px; font-weight:500;
  border:1px solid var(--border-strong);
  box-shadow:var(--shadow-xl); z-index:2000;
  display:flex; align-items:center; gap:9px;
  max-width:calc(100vw - 32px);
  pointer-events:none; opacity:0;
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s cubic-bezier(0.4,0,0.2,1);
}
.toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
.toast i{ color:var(--success); font-size:14px; filter:drop-shadow(0 0 8px var(--success-glow)); }

/* Persistence */
function saveFiltersToStorage(){

    localStorage.setItem(LS_FILTERS_KEY, JSON.stringify({
      subjects: Array.from(selectedSubjects),
      topics: Array.from(selectedTopics),
      jobs: Array.from(selectedJobs),
      statuses: Array.from(selectedStatuses),
      search: globalSearchTerm
    }));
  }catch(e){}
}
function loadFiltersFromStorage(){
  try{
    const raw = localStorage.getItem(LS_FILTERS_KEY);
    if(!raw) return false;
    const p = JSON.parse(raw);
    if(Array.isArray(p.subjects)) selectedSubjects = new Set(p.subjects);
    if(Array.isArray(p.topics)) selectedTopics = new Set(p.topics);
    if(Array.isArray(p.jobs)) selectedJobs = new Set(p.jobs);

    return true;
  }catch(e){ return false; }
}

}
function loadDataFromStorage(){

/* Helpers */
function escapeHtml(u){
  if(u===null||u===undefined) return '';
  return String(u).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function extractFileName(url){
  if(!url || url === '#') return 'sol';
  try{
    let clean = url.split('#')[0].split('?')[0];
    const parts = clean.split('/');
    let last = parts[parts.length-1] || '';
    try{ last = decodeURIComponent(last); }catch(e){}
    if(!last || (last.indexOf('.')===-1 && !/\w/.test(last))) return 'sol';
    if(last.length > 24) last = last.slice(0,21) + '…';
    return last || 'sol';
  }catch(e){ return 'sol'; }
}
function buildJobScopeKey(jobsSet){
  if(!jobsSet || jobsSet.size === 0) return 'ALL';
  return 'JOB::' + Array.from(jobsSet).sort().join('|');
}
function scopedCoverageKey(subject, jobScopeKey){ return subject + '||' + jobScopeKey; }

function matchesGlobalSearch(item, term){
  if(!term || term.trim() === '') return true;
  const q = term.toLowerCase().trim();
  const fields = [
    String(item.srno), String(item.subject), String(item.marks),
    String(item.mainTopic), String(item.subTopic), String(item.displayTopic),
    String(item.job), String(item.lastUpdate),
    String(item.markdownNotes).substring(0,500),
    String(item.url), String(item.solFileName)
  ];
  return fields.some(f => f.toLowerCase().includes(q));
}

function scheduleFastFilterRefresh(){
  if(filterRefreshScheduled) return;
  filterRefreshScheduled = true;
  requestAnimationFrame(() => {
    filterRefreshScheduled = false;
    refreshAllFilters();
    applyFiltersAndRender();
    saveFiltersToStorage();
  });
}

/* CSV */
function parseCSV(t){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<t.length;i++){
    const c=t[i], n=t[i+1];
    if(c === '"'){ if(inQ && n === '"'){ field+='"'; i++; } else inQ=!inQ; }
    else if(c === ',' && !inQ){ row.push(field); field=''; }
    else if((c === '\n' || c === '\r') && !inQ){
      if(c === '\r' && n === '\n') i++;
      row.push(field);
      if(row.length>1 || (row.length===1 && row[0].trim()!=='')) rows.push(row);
      row=[]; field='';
    } else field+=c;
  }
  if(field!=='' || row.length){
    row.push(field);
    if(row.length>1 || (row.length===1 && row[0].trim()!=='')) rows.push(row);
  }
  return rows;
}
function looksLikeMarkdown(text){
  if(!text) return false;
  const t=text.trim();
  if(t.length<15) return false;
  if(t==='—'||t==='-'||t==='N/A'||t==='na'||t==='NA') return false;
  if(/^https?:\/\/\S+$/.test(t)) return false;
  let s=0;
  if(/^#{1,6}\s/m.test(t)) s++;
  if(/\*\*[^*]+\*\*/.test(t)) s++;
  if(/^\s*[-*+]\s+/m.test(t)) s++;
  if(/^\s*\d+\.\s+/m.test(t)) s++;
  if(/^\s*\|.*\|\s*$/m.test(t)) s++;
  if(/```/.test(t)) s++;
  if(/^\s*>\s/m.test(t)) s++;
  if(/\[[^\]]+\]\([^)]+\)/.test(t)) s++;
  return s>=2 || (s>=1 && t.length>100);
}
function mapRowsToObjects(rows){
  if(!rows.length) return [];
  const dataRows=rows.slice(1);
  const out=[];
  const padded=dataRows.map(r=>{ const c=r.slice(); while(c.length<EXPECTED_COLUMNS) c.push(''); return c; });
  for(const row of padded){
    if(row.length<3) continue;
    const srno=(row[0]||'').trim();
    const swm=(row[1]||'').trim();
    const mainTopic=(row[2]||'').trim();
    const subTopic=(row[3]||'').trim();
    const job=(row[4]||'').trim();
    const url=(row[5]||'').trim();
    const solUrl=(row[6]||'').trim();
    const lastUpdate=(row[7]||'').trim();
    const markdownNotes=(row[8]||'').trim();
    let subject=swm, marks='';
    const m=swm.match(/;\s*(\d+)\s*$/);
    if(m){ marks=m[1]; subject=swm.replace(/;\s*\d+\s*$/,'').trim(); }
    const hasUrl = url && url!=='#' && url!=='—' && url.trim()!=='';
    const hasSol = solUrl && solUrl!=='#' && solUrl!=='—' && solUrl.trim()!=='';
    const hasMarkdown = looksLikeMarkdown(markdownNotes);
    const status = (hasUrl||hasSol||hasMarkdown) ? 'covered' : 'pending';
    const displayTopic = subTopic || mainTopic;
    out.push({
      srno: srno||'—', subject: subject||'—', marks: marks||'—',
      mainTopic: mainTopic||'—', subTopic: subTopic||'—',
      displayTopic: displayTopic||'—',
      url: hasUrl ? url : '#', hasUrl,
      solUrl: hasSol ? solUrl : '', hasSol,
      solFileName: hasSol ? extractFileName(solUrl) : '',
      markdownNotes: hasMarkdown ? markdownNotes : '', hasMarkdown,
      status, job: job||'—', lastUpdate: lastUpdate||''
    });
  }
  return out;
}

/* Counts */
function computeCounts(data){
  subjectCounts={}; mainTopicCounts={}; subjectCoverageScoped={};
  const allJobs=new Set();
  data.forEach(item=>{
    if(item.subject && item.subject!=='—') subjectCounts[item.subject]=(subjectCounts[item.subject]||0)+1;
    if(item.mainTopic && item.mainTopic!=='—') mainTopicCounts[item.mainTopic]=(mainTopicCounts[item.mainTopic]||0)+1;
    if(item.job && item.job!=='—') allJobs.add(item.job);
  });
  const scopes=['ALL']; allJobs.forEach(j=>scopes.push('JOB::'+j));
  scopes.forEach(scopeKey=>{
    data.forEach(item=>{
      if(!item.subject||item.subject==='—') return;
      if(scopeKey!=='ALL'){ const jn=scopeKey.slice(5); if(item.job!==jn) return; }
      const k=scopedCoverageKey(item.subject,scopeKey);
      if(!subjectCoverageScoped[k]) subjectCoverageScoped[k]={total:0,done:0};
      subjectCoverageScoped[k].total++;
      if(item.status==='covered') subjectCoverageScoped[k].done++;
    });
  });
}
function getSubjectCoveragePctForScope(subject, jobsSet){
  if(!subject||subject==='—') return 0;
  if(!jobsSet||jobsSet.size<=1){
    const sk=buildJobScopeKey(jobsSet);
    const c=subjectCoverageScoped[scopedCoverageKey(subject,sk)];
    if(!c||c.total===0) return 0;
    return Math.round((c.done/c.total)*100);
  }
  let total=0, done=0;
  rawData.forEach(item=>{
    if(item.subject!==subject) return;
    if(!jobsSet.has(item.job)) return;
    total++; if(item.status==='covered') done++;
  });
  if(total===0) return 0;
  return Math.round((done/total)*100);
}
function getSubjectCountForScope(subject, jobsSet){
  if(!subject||subject==='—') return 0;
  if(!jobsSet||jobsSet.size===0) return subjectCounts[subject]||0;
  let count=0;
  rawData.forEach(item=>{ if(item.subject===subject && jobsSet.has(item.job)) count++; });
  return count;
}
function updateStats(data){
  statTotal.textContent = data.length;
  statCovered.textContent = data.filter(d=>d.status==='covered').length;
  statPending.textContent = data.filter(d=>d.status==='pending').length;
  statSubjects.textContent = new Set(data.map(d=>d.subject).filter(s=>s!=='—')).size;
}

/* Options */
function getAvailableOptions(excludeFilter){
  const aS = excludeFilter==='subject' ? new Set() : selectedSubjects;
  const aT = excludeFilter==='topic'   ? new Set() : selectedTopics;
  const aJ = excludeFilter==='job'     ? new Set() : selectedJobs;
  const subjects=new Set(), topics=new Set(), jobs=new Set();
  rawData.forEach(item=>{
    if(selectedStatuses.size>0 && !selectedStatuses.has(item.status)) return;
    if(!matchesGlobalSearch(item, globalSearchTerm)) return;
    if(aS.size>0 && !aS.has(item.subject)) return;
    if(aT.size>0 && !aT.has(item.displayTopic)) return;
    if(aJ.size>0 && !aJ.has(item.job)) return;
    if(excludeFilter==='subject'){
      if(selectedSubjects.size>0 && !selectedSubjects.has(item.subject)) return;
      if(item.subject && item.subject!=='—') subjects.add(item.subject);
    } else if(excludeFilter==='topic'){
      if(selectedTopics.size>0 && !selectedTopics.has(item.displayTopic)) return;
      if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
    } else if(excludeFilter==='job'){
      if(selectedJobs.size>0 && !selectedJobs.has(item.job)) return;
      if(item.job && item.job!=='—') jobs.add(item.job);
    } else {
      if(item.subject && item.subject!=='—') subjects.add(item.subject);
      if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
      if(item.job && item.job!=='—') jobs.add(item.job);
    }
  });
  return { subjects:Array.from(subjects).sort(), topics:Array.from(topics).sort(), jobs:Array.from(jobs).sort() };
}
function pruneSelections(){
  const a = getAvailableOptions('none');
  Array.from(selectedSubjects).forEach(s=>{ if(!a.subjects.includes(s)) selectedSubjects.delete(s); });
  Array.from(selectedTopics).forEach(t=>{ if(!a.topics.includes(t)) selectedTopics.delete(t); });
  Array.from(selectedJobs).forEach(j=>{ if(!a.jobs.includes(j)) selectedJobs.delete(j); });
}

/* Multi-select */
function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch){
  const dropdown = container.querySelector('.ms-drop');
  const trigger = container.querySelector('.ms-trigger');
  const placeholder = container.querySelector('.ph');
  function closeDropdown(){ dropdown.classList.remove('open'); trigger.classList.remove('open'); }
  if(!trigger.dataset.listenerAttached){
    trigger.dataset.listenerAttached = '1';
    trigger.addEventListener('click', (e)=>{
      e.stopPropagation();
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.ms-drop.open').forEach(d=>d.classList.remove('open'));
      document.querySelectorAll('.ms-trigger.open').forEach(t=>t.classList.remove('open'));
      if(!isOpen){
        dropdown.classList.add('open'); trigger.classList.add('open');
        const latest = container._latestRebuild;
        if(latest && latest._render){
          const si = dropdown.querySelector('.ms-search');
          if(si){ si.value=''; setTimeout(()=>si.focus(),50); }
          latest._render('');
        }
      }
    });
    document.addEventListener('click', (e)=>{ if(!container.contains(e.target)) closeDropdown(); });
  }
  function rebuild(newOptions){
    dropdown.innerHTML = '';
    let searchInput = null;
    if(enableSearch){
      searchInput = document.createElement('input');
      searchInput.type='text'; searchInput.className='ms-search'; searchInput.placeholder='Search…';
      searchInput.addEventListener('input', ()=>renderDropdown(searchInput.value));
      searchInput.addEventListener('click', (e)=>e.stopPropagation());
      dropdown.appendChild(searchInput);
    }
    const actions = document.createElement('div'); actions.className='ms-actions';
    const btnAll = document.createElement('button'); btnAll.textContent='Select all';
    btnAll.addEventListener('click', (e)=>{
      e.stopPropagation();
      const vis = newOptions.filter(opt=>!searchInput||!searchInput.value||opt.label.toLowerCase().includes(searchInput.value.toLowerCase()));
      vis.forEach(opt=>selectedSet.add(opt.value));
      onUpdate(); updateTriggerText(); renderDropdown(searchInput?searchInput.value:'');
    });
    const btnClear = document.createElement('button'); btnClear.textContent='Clear';
    btnClear.addEventListener('click', (e)=>{
      e.stopPropagation(); selectedSet.clear();
      onUpdate(); updateTriggerText(); renderDropdown(searchInput?searchInput.value:'');
    });
    actions.appendChild(btnAll); actions.appendChild(btnClear); dropdown.appendChild(actions);
    function renderDropdown(filterText){
      dropdown.querySelectorAll('.ms-opt').forEach(el=>el.remove());
      let filtered = newOptions;
      if(filterText && filterText.trim()){
        const q = filterText.toLowerCase().trim();
        filtered = newOptions.filter(opt=>opt.label.toLowerCase().includes(q));
      }
      if(filtered.length===0){
        const empty=document.createElement('div');
        empty.className='ms-opt'; empty.style.opacity='0.5'; empty.style.cursor='default';
        empty.textContent='No matches'; dropdown.appendChild(empty); return;
      }
      filtered.forEach(opt=>{
        const div = document.createElement('div');
        div.className = 'ms-opt' + (selectedSet.has(opt.value)?' selected':'');
        div.innerHTML = `<span class="check"><i class="fas fa-check"></i></span><span>${escapeHtml(opt.label)}</span>`;
        div.addEventListener('click', (e)=>{
          e.stopPropagation();
          if(selectedSet.has(opt.value)) selectedSet.delete(opt.value);
          else selectedSet.add(opt.value);
          onUpdate(); updateTriggerText(); closeDropdown();
        });
        dropdown.appendChild(div);
      });
    }
    function updateTriggerText(){
      if(selectedSet.size===0){
        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
        placeholder.style.display = 'inline';
        const ex = trigger.querySelector('.sel'); if(ex) ex.remove();
      } else {
        placeholder.style.display = 'none';
        let sel = trigger.querySelector('.sel');
        if(!sel){
          sel = document.createElement('span'); sel.className='sel';
          trigger.insertBefore(sel, trigger.querySelector('.chev'));
        }
        sel.textContent = `${selectedSet.size} selected`;
        sel.style.display = 'inline';
      }
    }
    rebuild._render = renderDropdown;
    rebuild._updateText = updateTriggerText;
    container._latestRebuild = rebuild;
    renderDropdown(''); updateTriggerText();
  }
  rebuild(options);
  return rebuild;
}

function fallbackCopy(text){

/* Markdown */
function renderMarkdown(md){
  if(!md) return '';
  let html = md.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const codeBlocks=[];
  html = html.replace(/```([\s\S]*?)```/g,(m,code)=>{ const i=codeBlocks.length; codeBlocks.push(code); return `\u0000CODE${i}\u0000`; });
  const lines = html.split('\n'); const out=[];
  let inTable=false, inList=false, listType=null, inQuote=false;
  const closeList=()=>{ if(inList){ out.push(listType==='ol'?'</ol>':'</ul>'); inList=false; listType=null; } };
  const closeTable=()=>{ if(inTable){ out.push('</tbody></table>'); inTable=false; } };
  const closeQuote=()=>{ if(inQuote){ out.push('</blockquote>'); inQuote=false; } };
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    const cbMatch = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if(cbMatch){ closeList(); closeTable(); closeQuote();
      const code = codeBlocks[parseInt(cbMatch[1],10)];
      out.push(`<pre><code>${code}</code></pre>`); continue;
    }
    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
    const next = lines[i+1]||'';
    const isSep = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(next);
    if(isTableRow && isSep && !inTable){
      closeList(); closeQuote(); inTable=true;
      out.push('<table><thead>');
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c=>`<th>${inline(c.trim())}</th>`).join('') + '</tr>');
      out.push('</thead><tbody>'); i++; continue;
    }
    if(inTable && isTableRow){
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c=>`<td>${inline(c.trim())}</td>`).join('') + '</tr>'); continue;
    }
    if(inTable && !isTableRow) closeTable();
    if(/^\s*>\s?/.test(line)){
      if(!inQuote){ closeList(); out.push('<blockquote>'); inQuote=true; }
      out.push(inline(line.replace(/^\s*>\s?/,''))); continue;
    } else if(inQuote) closeQuote();
    const h1=line.match(/^#\s+(.*)$/); const h2=line.match(/^##\s+(.*)$/);
    const h3=line.match(/^###\s+(.*)$/); const h4=line.match(/^####\s+(.*)$/);
    if(h1){ closeList(); closeTable(); closeQuote(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }
    if(h2){ closeList(); closeTable(); closeQuote(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }
    if(h3){ closeList(); closeTable(); closeQuote(); out.push(`<h3>${inline(h3[1])}</h3>`); continue; }
    if(h4){ closeList(); closeTable(); closeQuote(); out.push(`<h4>${inline(h4[1])}</h4>`); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){ closeList(); closeTable(); closeQuote(); out.push('<hr>'); continue; }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){ closeTable(); closeQuote();
      if(!inList || listType!=='ul'){ closeList(); out.push('<ul>'); inList=true; listType='ul'; }
      out.push(`<li>${inline(ul[1])}</li>`); continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){ closeTable(); closeQuote();
      if(!inList || listType!=='ol'){ closeList(); out.push('<ol>'); inList=true; listType='ol'; }
      out.push(`<li>${inline(ol[1])}</li>`); continue;
    }
    if(line.trim()===''){ closeList(); closeTable(); closeQuote(); continue; }
    closeList(); closeTable(); closeQuote();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList(); closeTable(); closeQuote();
  return out.join('\n');
}
function parseRow(line){
  let t=line.trim();
  if(t.startsWith('|')) t=t.slice(1);
  if(t.endsWith('|')) t=t.slice(0,-1);
  return t.split('|');
}
function inline(text){
  if(!text) return '';
  let s=text;
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

/* Notes Modal */
function openNotesModal(item){
  if(!item.hasMarkdown) return;
  currentModalMarkdown = item.markdownNotes;
  const title = item.subTopic!=='—' ? item.subTopic : item.displayTopic;
  modalTitleText.textContent = title;
  const parts=[];
  if(item.mainTopic && item.mainTopic!=='—') parts.push(item.mainTopic);
  if(item.subject && item.subject!=='—') parts.push(item.subject);
  if(item.job && item.job!=='—') parts.push(item.job);
  modalSubtitle.textContent = parts.join('  ·  ');
  modalBody.innerHTML = renderMarkdown(item.markdownNotes);
  modalOverlay.classList.add('open');
  document.body.style.overflow='hidden';
  modalBody.scrollTop = 0;
}
function closeNotesModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow='';
  currentModalMarkdown='';
}
modalCloseBtn.addEventListener('click', closeNotesModal);
modalCloseBtn2.addEventListener('click', closeNotesModal);
modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) closeNotesModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    if(modalOverlay.classList.contains('open')) closeNotesModal();
    else if(reportOverlay.classList.contains('open')) closeReport();
    else if(filterOverlay.classList.contains('open')) closeFilter();
  }
});
modalCopyBtn.addEventListener('click', ()=>{
  if(!currentModalMarkdown) return;
  if(fallbackCopy(currentModalMarkdown)){ showToast('Notes copied'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentModalMarkdown).then(()=>showToast('Notes copied')).catch(()=>showToast('Copy failed'));
  } else showToast('Copy failed');
});

/* Cards */
function renderCards(data){
  if(!data.length){
    cardsContainer.innerHTML = `
      <div class="state">
        <i class="fas fa-magnifying-glass big"></i>
        <div class="state-title">No matching topics</div>
        <div class="state-sub">Try adjusting filters or search query</div>
      </div>`;
    return;
  }
  const slice = data.slice(0, visibleCount);
  const showJobBadge = selectedJobs.size === 0;
  const frag = document.createDocumentFragment();
  slice.forEach(item=>{
    const card = document.createElement('div');
    card.className = `card ${item.status==='covered'?'is-covered':'is-pending'}`;
    if(item.status==='pending'){
      card.title = 'Click to copy DeepSeek prompt';
      card.addEventListener('click', (e)=>{
        if(e.target.closest('a,button')) return;
        copyPrompt(item);
      });
    }
    const top = document.createElement('div'); top.className='card-top';
    const tb = document.createElement('div'); tb.className='card-title-block';
    const srno = document.createElement('div'); srno.className='card-srno';
    srno.textContent = `#${item.srno}`; tb.appendChild(srno);
    const titleLink = document.createElement('a');
    titleLink.className = 'card-title';
    titleLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
    titleLink.target = '_blank'; titleLink.rel='noopener noreferrer';
    titleLink.title = 'Search: ' + buildGoogleSearchQuery(item);
    titleLink.innerHTML = `${escapeHtml(item.subTopic!=='—'?item.subTopic:'—')} <i class="fas fa-arrow-up-right-from-square"></i>`;
    titleLink.addEventListener('click', (e)=>e.stopPropagation());
    tb.appendChild(titleLink); top.appendChild(tb);
    const badges = document.createElement('div'); badges.className='card-badges';
    if(showJobBadge && item.job && item.job!=='—'){
      const b=document.createElement('span'); b.className='badge badge-job';
      b.textContent=item.job; b.title='Job: '+item.job; badges.appendChild(b);
    }
    if(item.lastUpdate){
      const d=document.createElement('span'); d.className='badge badge-date';
      d.innerHTML = `<i class="fas fa-clock"></i>${escapeHtml(item.lastUpdate)}`;
      d.title='Last update'; badges.appendChild(d);
    }
    if(badges.children.length) top.appendChild(badges);
    card.appendChild(top);

    const meta = document.createElement('div'); meta.className='card-meta';
    const mainLine = document.createElement('div'); mainLine.className='meta-line';
    const mainCount = mainTopicCounts[item.mainTopic]||1;
    mainLine.innerHTML = `
      <i class="fas fa-folder"></i>
      <span class="value strong">${escapeHtml(item.mainTopic)}</span>
      <span class="count-chip">${mainCount}</span>
    `;
    meta.appendChild(mainLine);
    const subjLine = document.createElement('div'); subjLine.className='meta-line';
    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);
    subjLine.innerHTML = `
      <i class="fas fa-book"></i>
      <span class="value">${escapeHtml(item.subject)}</span>
      <span class="count-chip">${subjCount}</span>
    `;
    meta.appendChild(subjLine);
    card.appendChild(meta);

    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
    const covCls = covPct===100 ? 'full' : (covPct>=50?'mid':'');
    const pw = document.createElement('div'); pw.className='card-progress-wrap';
    pw.innerHTML = `
      <div class="progress-head">
        <span>Coverage</span>
        <span class="progress-value">${covPct}%</span>
      </div>
      <div class="progress-track" title="Subject coverage: ${covPct}%">
        <div class="progress-fill ${covCls}" style="width:${covPct}%"></div>
      </div>
    `;
    card.appendChild(pw);

    const foot = document.createElement('div'); foot.className='card-foot';
    const actions = document.createElement('div'); actions.className='card-actions';
    if(item.hasMarkdown){
      const rb = document.createElement('button'); rb.type='button'; rb.className='action action-read';
      rb.title = `Read notes for "${item.subTopic}"`;
      rb.innerHTML = `<i class="fas fa-book-open"></i> Read`;
      rb.addEventListener('click',(e)=>{ e.stopPropagation(); openNotesModal(item); });
      actions.appendChild(rb);
    }
    if(item.hasUrl){
      const a = document.createElement('a'); a.href=item.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.className='action action-done'; a.title='Open complete chat';
      a.innerHTML = `<i class="fas fa-circle-check"></i> Done <i class="fas fa-arrow-up-right-from-square" style="opacity:0.7;"></i>`;
      a.addEventListener('click',(e)=>e.stopPropagation());
      actions.appendChild(a);
    } else {
      const isCov = item.status==='covered';
      const el = document.createElement(isCov?'span':'button');
      el.className = 'action ' + (isCov?'action-done':'action-pending');
      el.title = isCov ? 'Marked done' : 'Click to copy prompt';
      el.innerHTML = isCov ? `<i class="fas fa-circle-check"></i> Done` : `<i class="fas fa-clock"></i> Pending <i class="fas fa-copy" style="opacity:0.7;"></i>`;
      if(!isCov) el.addEventListener('click',(e)=>{ e.stopPropagation(); copyPrompt(item); });
      actions.appendChild(el);
    }
    if(item.hasSol){
      const a = document.createElement('a'); a.href=item.solUrl; a.target='_blank'; a.rel='noopener noreferrer';
      a.className='action action-sol'; a.title='Open solution: ' + item.solFileName;
      a.innerHTML = `<i class="fas fa-file-lines"></i><span class="label">${escapeHtml(item.solFileName)}</span>`;
      a.addEventListener('click',(e)=>e.stopPropagation());
      actions.appendChild(a);
    }
    foot.appendChild(actions); card.appendChild(foot);
    frag.appendChild(card);
  });
  cardsContainer.innerHTML = '';
  cardsContainer.appendChild(frag);
}

/* Populate dropdowns */
function populateFilters(data){
  const subjects=new Set(), topics=new Set(), jobs=new Set();
  data.forEach(item=>{
    if(item.subject && item.subject!=='—') subjects.add(item.subject);
    if(item.displayTopic && item.displayTopic!=='—') topics.add(item.displayTopic);
    if(item.job && item.job!=='—') jobs.add(item.job);
  });
  const sO = Array.from(subjects).sort().map(s=>({value:s,label:s}));
  const tO = Array.from(topics).sort().map(t=>({value:t,label:t}));
  const jO = Array.from(jobs).sort().map(j=>({value:j,label:j}));
  const sW = $('subjectMultiWrap'); sW.dataset.type='subjects';
  if(!rebuildSubjectSelect) rebuildSubjectSelect = buildMultiSelect(sW, sO, selectedSubjects, onFilterChange, true);
  else rebuildSubjectSelect(sO);
  const tW = $('topicMultiWrap'); tW.dataset.type='topics';
  if(!rebuildTopicSelect) rebuildTopicSelect = buildMultiSelect(tW, tO, selectedTopics, onFilterChange, true);
  else rebuildTopicSelect(tO);
  const jW = $('jobMultiWrap'); jW.dataset.type='jobs';
  if(!rebuildJobSelect) rebuildJobSelect = buildMultiSelect(jW, jO, selectedJobs, onFilterChange, true);
  else rebuildJobSelect(jO);
  subjectCountHint.textContent = sO.length;
  topicCountHint.textContent = tO.length;
  jobCountHint.textContent = jO.length;
}

/* ============ REPORT ============ */
function buildReport(){
  // Build hierarchy from filteredData (honors current filters)
  const data = filteredData;
  if(!data.length){
    reportContent.innerHTML = `
      <div class="report-empty">
        <i class="fas fa-inbox"></i>
        No data matches current filters.
      </div>`;
    reportSubtitle.textContent = 'No data';
    return;
  }

  // job -> subject -> topic -> subtopics
  const jobsMap = new Map();

  data.forEach(item=>{
    const job = item.job && item.job!=='—' ? item.job : 'Unassigned';
    const subject = item.subject && item.subject!=='—' ? item.subject : 'Unassigned';
    const topic = item.mainTopic && item.mainTopic!=='—' ? item.mainTopic : 'Unassigned';

    if(!jobsMap.has(job)){
      jobsMap.set(job, { name:job, subjects:new Map(), total:0, done:0 });
    }
    const j = jobsMap.get(job);
    j.total++;
    if(item.status==='covered') j.done++;

    if(!j.subjects.has(subject)){
      j.subjects.set(subject, { name:subject, topics:new Map(), total:0, done:0 });
    }
    const s = j.subjects.get(subject);
    s.total++;
    if(item.status==='covered') s.done++;

    if(!s.topics.has(topic)){
      s.topics.set(topic, { name:topic, subtopics:[], total:0, done:0 });
    }
    const t = s.topics.get(topic);
    t.total++;
    if(item.status==='covered') t.done++;
    t.subtopics.push(item);
  });

  // Sort jobs by total desc
  const sortedJobs = Array.from(jobsMap.values()).sort((a,b)=>b.total - a.total);

  const totalTopics = data.length;
  const totalDone = data.filter(d=>d.status==='covered').length;
  const pct = totalTopics ? Math.round((totalDone/totalTopics)*100) : 0;
  reportSubtitle.textContent = `${sortedJobs.length} jobs · ${totalTopics} topics · ${pct}% covered`;

  let html = '<div class="report-tree">';

  sortedJobs.forEach(job=>{
    const jobPct = job.total ? Math.round((job.done/job.total)*100) : 0;
    const jobPctCls = jobPct===100 ? 'full' : (jobPct>=50?'mid':'');
    const jobId = 'job-' + slugify(job.name);

    html += `<div class="tree-job" data-job-id="${jobId}">`;
    html += `<div class="tree-job-head" data-toggle="job" data-target="${jobId}">`;
    html += `<div class="tree-toggle-icon"><i class="fas fa-chevron-right"></i></div>`;
    html += `<div class="tree-job-info">`;
    html += `<div class="tree-job-name">${escapeHtml(job.name)}</div>`;
    html += `<div class="tree-job-meta">`;
    html += `<span class="item"><i class="fas fa-book"></i>${job.subjects.size} subjects</span>`;
    html += `<span class="item"><i class="fas fa-folder-tree"></i>${job.total} topics</span>`;
    html += `<span class="item" style="color:var(--success-bright);"><i class="fas fa-circle-check"></i>${job.done} done</span>`;
    html += `<span class="item" style="color:var(--warn-bright);"><i class="fas fa-clock"></i>${job.total-job.done} pending</span>`;
    html += `</div></div>`;
    html += `<div class="tree-job-pct">`;
    html += `<div class="mini-bar"><div class="mini-bar-fill ${jobPctCls}" style="width:${jobPct}%"></div></div>`;
    html += `<span class="mini-pct">${jobPct}%</span>`;
    html += `</div>`;
    html += `</div>`;

    html += `<div class="tree-job-body">`;
    html += `<div class="tree-subjects">`;

    const sortedSubjects = Array.from(job.subjects.values()).sort((a,b)=>b.total - a.total);
    sortedSubjects.forEach(subject=>{
      const subjPct = subject.total ? Math.round((subject.done/subject.total)*100) : 0;
      const subjPctCls = subjPct===100 ? 'full' : (subjPct>=50?'mid':'');
      const subjId = jobId + '-sub-' + slugify(subject.name);

      html += `<div class="tree-subject" data-subject-id="${subjId}">`;
      html += `<div class="tree-subject-head" data-toggle="subject" data-target="${subjId}">`;
      html += `<div class="tree-toggle-icon"><i class="fas fa-chevron-right"></i></div>`;
      html += `<div class="tree-subject-info">`;
      html += `<div class="tree-subject-name">${escapeHtml(subject.name)}</div>`;
      html += `<div class="tree-subject-meta">`;
      html += `<span class="item"><i class="fas fa-folder-tree"></i>${subject.topics.size} topics</span>`;
      html += `<span class="item"><i class="fas fa-list"></i>${subject.total} subtopics</span>`;
      html += `<span class="item" style="color:var(--success-bright);">${subject.done} done</span>`;
      html += `</div></div>`;
      html += `<div class="tree-job-pct">`;
      html += `<div class="mini-bar"><div class="mini-bar-fill ${subjPctCls}" style="width:${subjPct}%"></div></div>`;
      html += `<span class="mini-pct">${subjPct}%</span>`;
      html += `</div>`;
      html += `</div>`;

      html += `<div class="tree-subject-body">`;
      html += `<div class="tree-topics">`;

      const sortedTopics = Array.from(subject.topics.values()).sort((a,b)=>b.total - a.total);
      sortedTopics.forEach(topic=>{
        const topicPct = topic.total ? Math.round((topic.done/topic.total)*100) : 0;
        const topicPctCls = topicPct===100 ? 'full' : (topicPct>=50?'mid':'');
        const topicId = subjId + '-top-' + slugify(topic.name);

        html += `<div class="tree-topic" data-topic-id="${topicId}">`;
        html += `<div class="tree-topic-head" data-toggle="topic" data-target="${topicId}">`;
        html += `<div class="tree-toggle-icon"><i class="fas fa-chevron-right"></i></div>`;
        html += `<div class="tree-topic-info">`;
        html += `<div class="tree-topic-name">${escapeHtml(topic.name)}</div>`;
        html += `<div class="tree-topic-meta">${topic.subtopics.length} subtopic${topic.subtopics.length===1?'':'s'} · ${topic.done} done · ${topic.total-topic.done} pending</div>`;
        html += `</div>`;
        html += `<div class="tree-job-pct">`;
        html += `<div class="mini-bar"><div class="mini-bar-fill ${topicPctCls}" style="width:${topicPct}%"></div></div>`;
        html += `<span class="mini-pct">${topicPct}%</span>`;
        html += `</div>`;
        html += `</div>`;

        html += `<div class="tree-topic-body">`;
        html += `<div class="tree-subtopics">`;
        topic.subtopics.forEach(sub=>{
          const cls = sub.status==='covered' ? 'covered' : '';
          html += `<div class="tree-subtopic">`;
          html += `<span class="tree-subtopic-status ${cls}" title="${sub.status}"></span>`;
          html += `<span class="tree-subtopic-name">${escapeHtml(sub.subTopic!=='—'?sub.subTopic:'—')}</span>`;
          html += `<span class="tree-subtopic-srno">#${escapeHtml(sub.srno)}</span>`;
          html += `</div>`;
        });
        html += `</div></div>`;
        html += `</div>`;
      });

      html += `</div></div>`;
      html += `</div>`;
    });

    html += `</div></div>`;
    html += `</div>`;
  });

  html += `</div>`;
  reportContent.innerHTML = html;

  // Wire toggles
  reportContent.querySelectorAll('[data-toggle]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      e.stopPropagation();
      const targetId = head.dataset.target;
      const target = reportContent.querySelector('#' + cssEscape(targetId));
      if(!target){
        // Fallback: find by data attribute
        const type = head.dataset.toggle;
        const sel = type==='job' ? `[data-job-id="${targetId}"]` : type==='subject' ? `[data-subject-id="${targetId}"]` : `[data-topic-id="${targetId}"]`;
        const el = reportContent.querySelector(sel);
        if(el) el.classList.toggle('expanded');
      } else {
        target.classList.toggle('expanded');
      }
    });
  });
}

function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'x';
}
function cssEscape(s){
  return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
}

function openReport(){
  buildReport();
  reportOverlay.classList.add('open');
  document.body.classList.add('locked');
}
function closeReport(){
  reportOverlay.classList.remove('open');
  document.body.classList.remove('locked');
}
reportBtn.addEventListener('click', openReport);
reportCloseBtn.addEventListener('click', closeReport);
reportOverlay.addEventListener('click', (e)=>{ if(e.target===reportOverlay) closeReport(); });

/* ============ FILTER POPUP ============ */
function openFilter(){
  filterOverlay.classList.add('open');
  document.body.classList.add('locked');
}
function closeFilter(){
  filterOverlay.classList.remove('open');
  document.body.classList.remove('locked');
}
filterBtn.addEventListener('click', openFilter);
filterCloseBtn.addEventListener('click', closeFilter);
filterOverlay.addEventListener('click', (e)=>{ if(e.target===filterOverlay) closeFilter(); });
applyFiltersBtn.addEventListener('click', ()=>{ closeFilter(); showToast('Filters applied'); });

/* Scroll */
function updateScrollButtons(){
  const y = window.scrollY || 0;
  const maxY = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
  if(y<100) fabScrollTop.classList.add('hidden'); else fabScrollTop.classList.remove('hidden');
  if(maxY<=0 || y>=maxY-100) fabScrollBottom.classList.add('hidden'); else fabScrollBottom.classList.remove('hidden');
}
let scrollTick=false;
window.addEventListener('scroll', ()=>{
  if(scrollTick) return;
  scrollTick=true;
  requestAnimationFrame(()=>{ scrollTick=false; updateScrollButtons(); saveScrollPosition(); });
},{passive:true});
fabScrollTop.addEventListener('click', ()=>{ window.scrollTo({top:0,behavior:'smooth'}); try{ localStorage.setItem(LS_SCROLL_KEY,'0'); }catch(e){} });
fabScrollBottom.addEventListener('click', ()=>{ const t=document.documentElement.scrollHeight||document.body.scrollHeight; window.scrollTo({top:t,behavior:'smooth'}); });
function restoreScrollPosition(){
  const y = getSavedScrollPosition();
  if(y>0) requestAnimationFrame(()=>window.scrollTo(0,y));
}

/* Load */
function setRefreshLoading(loading){ isLoading=loading; fabRefresh.classList.toggle('loading',loading); }
async function fetchFreshData(){
  const bust = `&_=${Date.now()}`;
  const res = await fetch(CSV_URL + bust, { cache:'no-store' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if(text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')){
    throw new Error('Sheet is not public. Share as "Anyone with link can view".');
  }
  const rows = parseCSV(text);
  if(rows.length<2) throw new Error('No data rows');
  const data = mapRowsToObjects(rows);
  if(!data.length) throw new Error('No parsed data');
  return data;
}
function applyDataAndRender(data, opts){
  opts = opts || {};
  rawData = data;
  computeCounts(rawData);
  populateFilters(rawData);
  if(opts.isFirstLoad){
    setupStatusSegments();
    cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
    cbPending.classList.toggle('active', selectedStatuses.has('pending'));
    refreshAllFilters();
    applyFiltersAndRender();
    restoreScrollPosition();
  } else {
    refreshAllFilters();
    applyFiltersAndRender();
  }
  requestAnimationFrame(updateScrollButtons);
}
function renderSkeletons(){
  let html='';
  for(let i=0;i<6;i++){
    html += `<div class="skeleton-card">
      <div class="sk-line w40"></div>
      <div class="sk-line h20 w80"></div>
      <div class="sk-line w60"></div>
      <div class="sk-line w40"></div>
    </div>`;
  }
  cardsContainer.innerHTML = html;
}
async function refreshFromNetwork(opts){
  opts = opts || {};
  if(isLoading) return;
  if(opts.isManual) setRefreshLoading(true); else renderSkeletons();
  try{
    const fresh = await fetchFreshData();
    saveDataToStorage(fresh);
    applyDataAndRender(fresh,{isFirstLoad:opts.isFirstLoad});
    if(opts.isManual) showToast('Data refreshed');
  } catch(err){
    console.error('Fetch error:', err);
    if(opts.isManual){
      showToast('Refresh failed — check console');
    } else {
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  } finally { if(opts.isManual) setRefreshLoading(false); }
}

/* Search */
function updateSearchClearButton(){
  globalSearchClear.classList.toggle('visible', !!(globalSearchTerm && globalSearchTerm.trim()));
}
globalSearchInput.addEventListener('input', ()=>{
  if(globalSearchInput.value === globalSearchTerm) return;
  globalSearchTerm = globalSearchInput.value;
  updateSearchClearButton();
  scheduleFastFilterRefresh();
});
globalSearchClear.addEventListener('click', ()=>{
  globalSearchInput.value=''; globalSearchTerm='';
  updateSearchClearButton(); scheduleFastFilterRefresh(); globalSearchInput.focus();
});

/* Init */
(async function init(){
  loadFiltersFromStorage();
  cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
  cbPending.classList.toggle('active', selectedStatuses.has('pending'));
  if(globalSearchTerm) globalSearchInput.value = globalSearchTerm;
  updateSearchClearButton();
  const cached = loadDataFromStorage();
  if(cached){
    applyDataAndRender(cached,{isFirstLoad:true});
  } else {
    renderSkeletons();
    try{
      const fresh = await fetchFreshData();
      saveDataToStorage(fresh);
      applyDataAndRender(fresh,{isFirstLoad:true});
    } catch(err){
      console.error('Init fetch error:', err);
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  }
})();

fabRefresh.addEventListener('click', ()=>{
  clearPersistedData();
  refreshFromNetwork({isManual:true,isFirstLoad:false});
});
window.addEventListener('beforeunload', saveScrollPosition);

})();
