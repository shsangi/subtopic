<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<meta name="theme-color" content="#0a0a0b">
<title>Topic Tracker — Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  /* Surfaces */
  --bg-0:          #0a0a0b;
  --bg-1:          #101012;
  --bg-2:          #16161a;
  --bg-3:          #1c1c21;
  --bg-4:          #232329;
  --bg-inset:      #0d0d0f;
  --bg-hover:      #1f1f25;

  /* Borders */
  --border:        #26262c;
  --border-strong: #33333b;
  --border-subtle: #1c1c22;

  /* Text — pure white focus */
  --text:          #ffffff;
  --text-1:        #e8e8ec;
  --text-2:        #b4b4bd;
  --text-3:        #86868f;
  --text-faint:    #5c5c66;

  /* Accent */
  --accent:        #a5b4fc;
  --accent-bright: #c7d2fe;
  --accent-deep:   #6366f1;
  --accent-soft:   rgba(129,140,248,0.14);
  --accent-softer: rgba(129,140,248,0.07);
  --accent-glow:   rgba(129,140,248,0.28);

  /* Success */
  --success:       #34d399;
  --success-bright:#6ee7b7;
  --success-soft:  rgba(52,211,153,0.14);
  --success-glow:  rgba(52,211,153,0.32);

  /* Warn */
  --warn:          #fbbf24;
  --warn-bright:   #fcd34d;
  --warn-soft:     rgba(251,191,36,0.14);
  --warn-glow:     rgba(251,191,36,0.32);

  /* Danger */
  --danger:        #fb7185;
  --danger-soft:   rgba(251,113,133,0.14);

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 13px;
  --radius-xl: 16px;

  --ring: 0 0 0 3px rgba(129,140,248,0.25);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
  --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.55), 0 2px 6px -2px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px -8px rgba(0,0,0,0.65), 0 4px 12px -4px rgba(0,0,0,0.45);
  --shadow-xl: 0 32px 72px -12px rgba(0,0,0,0.8), 0 8px 24px -8px rgba(0,0,0,0.55);

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --header-h: 58px;
}

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  font-family: var(--font-sans);
  font-feature-settings: 'cv02','cv03','cv04','cv11','ss01';
  background: var(--bg-0);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,0.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(139,92,246,0.06), transparent 60%);
  background-attachment: fixed;
}
body::before{
  content:'';
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: 0.022;
  z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
}

button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input{ font-family:inherit; }
a{ color:inherit; }

/* ============ HEADER ============ */
.app-header{
  position: sticky; top: 0; z-index: 100;
  height: var(--header-h);
  background: rgba(10,10,11,0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center;
  padding: 0 22px;
}
.app-header-inner{
  max-width: 1440px; width:100%; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand{ display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark{
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
  display: grid; place-items: center;
  color: white; font-size: 15px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12) inset,
    0 4px 16px -2px rgba(99,102,241,0.6),
    0 2px 6px -1px rgba(99,102,241,0.4);
  flex-shrink: 0;
  position: relative;
}
.brand-mark::after{
  content:'';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent 50%);
  pointer-events: none;
}
.brand-text{ display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-title{
  font-size: 15px; font-weight: 700; letter-spacing: -0.015em;
  color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 8px;
}
.brand-title .job-pill{
  font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-bright);
  border: 1px solid rgba(129,140,248,0.3);
  padding: 3px 9px; border-radius: 20px;
  box-shadow: 0 0 14px -2px var(--accent-glow);
}
.brand-sub{
  font-size: 12px; color: var(--text-3); font-weight: 500;
  letter-spacing: 0.01em;
}

.header-actions{ display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.btn{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; letter-spacing: -0.005em;
  transition: all 0.15s cubic-bezier(0.4,0,0.2,1);
  white-space: nowrap; user-select: none;
  border: 1px solid transparent;
}
.btn i{ font-size: 12px; }
.btn-ghost{
  color: var(--text-1);
  border-color: var(--border);
  background: var(--bg-2);
  box-shadow: var(--shadow-sm);
}
.btn-ghost:hover{
  background: var(--bg-3);
  border-color: var(--border-strong);
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-ghost:active{ transform: translateY(0); }

.btn-primary{
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  color: #ffffff;
  border-color: rgba(129,140,248,0.4);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.1) inset,
    0 4px 14px -2px rgba(99,102,241,0.55);
}
.btn-primary:hover{
  background: linear-gradient(135deg, #7c3aed, #8b5cf6);
  transform: translateY(-1px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.15) inset,
    0 6px 20px -2px rgba(99,102,241,0.65);
}

/* ============ CONTAINER ============ */
.container{
  max-width: 1440px;
  margin: 0 auto;
  padding: 22px;
  position: relative;
  z-index: 2;
}

/* ============ STATS — COMPACT ============ */
.stats-grid{
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.stat-card{
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  min-width: 0;
}
.stat-card::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
}
.stat-card:hover{
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.stat-icon{
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px;
  background: var(--bg-3); color: var(--text-2);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-card.is-success .stat-icon{
  background: var(--success-soft);
  color: var(--success);
  border-color: rgba(52,211,153,0.28);
  box-shadow: 0 0 16px -4px var(--success-glow);
}
.stat-card.is-warn .stat-icon{
  background: var(--warn-soft);
  color: var(--warn);
  border-color: rgba(251,191,36,0.28);
  box-shadow: 0 0 16px -4px var(--warn-glow);
}
.stat-card.is-accent .stat-icon{
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(129,140,248,0.28);
  box-shadow: 0 0 16px -4px var(--accent-glow);
}

.stat-body{ display: flex; flex-direction: column; min-width: 0; line-height: 1.15; gap: 2px; }
.stat-label{
  font-size: 11px; font-weight: 700;
  color: var(--text-3); text-transform: uppercase;
  letter-spacing: 0.07em;
  white-space: nowrap;
}
.stat-value{
  font-size: 19px; font-weight: 700;
  letter-spacing: -0.02em; color: #ffffff;
  font-variant-numeric: tabular-nums;
}
.stat-card.is-success .stat-value{ color: var(--success-bright); }
.stat-card.is-warn .stat-value{ color: var(--warn-bright); }
.stat-card.is-accent .stat-value{ color: var(--accent-bright); }

/* ============ SEARCH ============ */
.search-bar{ position: relative; margin-bottom: 14px; }
.search-bar i.search-icon{
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); font-size: 13px; pointer-events: none;
  transition: color 0.15s ease;
}
.search-bar:focus-within i.search-icon{ color: var(--accent); }
.search-bar input{
  width: 100%;
  padding: 12px 42px 12px 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  font-size: 14px; font-weight: 500;
  color: #ffffff;
  outline: none;
  transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
  box-shadow: var(--shadow-sm);
}
.search-bar input::placeholder{ color: var(--text-faint); font-weight: 500; }
.search-bar input:focus{
  border-color: var(--accent-deep);
  box-shadow: var(--ring), var(--shadow-md);
  background: var(--bg-2);
}
.search-clear{
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 13px;
  transition: all 0.12s ease;
}
.search-clear:hover{ background: var(--danger-soft); color: var(--danger); }
.search-clear.visible{ display: flex; }

/* ============ FILTER PANEL ============ */
.filter-panel{
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
}
.filter-panel::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
}
.filter-row{ display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.filter-group{ min-width: 0; }
.filter-label{
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 7px;
}
.filter-label .count-pill{
  font-size: 11px; font-weight: 700;
  background: var(--bg-3); color: var(--text-1);
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0; text-transform: none;
  border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}

/* multi-select */
.ms{ position: relative; }
.ms-trigger{
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  font-size: 14px; font-weight: 500;
  color: #ffffff;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; min-height: 40px;
  transition: all 0.15s cubic-bezier(0.4,0,0.2,1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}
.ms-trigger:hover{ border-color: var(--border-strong); background: var(--bg-3); }
.ms-trigger.open{
  border-color: var(--accent-deep);
  box-shadow: var(--ring);
  background: var(--bg-3);
}
.ms-trigger .ph{ color: var(--text-faint); font-weight: 500; }
.ms-trigger .sel{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--accent-bright); font-weight: 600; }
.ms-trigger i.chev{ font-size: 11px; color: var(--text-3); transition: transform 0.2s ease; }
.ms-trigger.open i.chev{ transform: rotate(180deg); }

.ms-drop{
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow-xl);
  max-height: 280px; overflow-y: auto;
  z-index: 200; display: none; padding: 6px;
}
.ms-drop.open{ display: block; animation: dropIn 0.16s cubic-bezier(0.34,1.3,0.64,1); }
@keyframes dropIn{
  from{ opacity:0; transform: translateY(-4px) scale(0.98); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
.ms-search{
  width: 100%; padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500;
  color: #ffffff; outline: none;
  background: var(--bg-inset);
  transition: all 0.15s ease;
  margin-bottom: 4px;
}
.ms-search:focus{ border-color: var(--accent-deep); background: var(--bg-2); box-shadow: var(--ring); }
.ms-search::placeholder{ color: var(--text-faint); font-weight: 500; }

.ms-opt{
  display: flex; align-items: center; gap: 9px;
  padding: 8px 9px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500; color: var(--text-1);
  cursor: pointer; transition: all 0.12s ease;
  word-break: break-word;
}
.ms-opt:hover{ background: var(--bg-hover); color: #ffffff; }
.ms-opt.selected{ background: var(--accent-soft); color: var(--accent-bright); }
.ms-opt .check{
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border-strong); background: transparent;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.12s ease;
}
.ms-opt .check i{ font-size: 9px; color: white; opacity: 0; transition: opacity 0.12s ease; }
.ms-opt.selected .check{
  background: var(--accent-deep); border-color: var(--accent-deep);
  box-shadow: 0 0 10px -2px var(--accent-glow);
}
.ms-opt.selected .check i{ opacity: 1; }

.ms-actions{
  display: flex; gap: 6px;
  padding: 6px 4px 2px;
  border-top: 1px solid var(--border-subtle);
  margin-top: 4px;
}
.ms-actions button{
  flex: 1; padding: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 12px; font-weight: 600; color: var(--text-1);
  transition: all 0.12s ease;
}
.ms-actions button:hover{
  background: var(--bg-hover);
  border-color: var(--border-strong);
  color: #ffffff;
}

/* filter foot */
.filter-foot{
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding-top: 14px; border-top: 1px solid var(--border-subtle);
}
.segmented{
  display: inline-flex;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
  gap: 2px;
}
.seg-btn{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px; font-weight: 600;
  color: var(--text-3);
  transition: all 0.15s ease;
  user-select: none;
}
.seg-btn i{ font-size: 11px; }
.seg-btn:hover{ color: var(--text-1); }
.seg-btn.active{
  background: var(--bg-3);
  color: #ffffff;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.05);
}
.seg-btn.active[data-status="covered"]{
  color: var(--success-bright);
  background: var(--success-soft);
  box-shadow: 0 0 14px -4px var(--success-glow);
}
.seg-btn.active[data-status="pending"]{
  color: var(--warn-bright);
  background: var(--warn-soft);
  box-shadow: 0 0 14px -4px var(--warn-glow);
}

.btn-reset{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 13px; font-weight: 600;
  color: var(--text-1);
  transition: all 0.15s ease;
}
.btn-reset:hover{
  border-color: rgba(251,113,133,0.45);
  color: var(--danger);
  background: var(--danger-soft);
}
.btn-reset i{ font-size: 11px; transition: transform 0.4s ease; }
.btn-reset:hover i{ transform: rotate(-180deg); }

/* ============ RESULTS META ============ */
.results-meta{
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 12px;
  font-size: 13px; color: var(--text-2); font-weight: 500;
}
.results-meta .count-strong{ color: #ffffff; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ============ CARDS ============ */
.cards{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

.card{
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column; gap: 12px;
  position: relative; overflow: hidden;
  min-width: 0;
}
.card::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);
  pointer-events: none;
}
.card::after{
  content:'';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--border-strong);
  transition: background 0.25s ease, box-shadow 0.25s ease;
}
.card.is-covered::after{
  background: linear-gradient(180deg, var(--success), #059669);
  box-shadow: 0 0 14px -2px var(--success-glow);
}
.card.is-pending::after{
  background: linear-gradient(180deg, var(--warn), #d97706);
  box-shadow: 0 0 14px -2px var(--warn-glow);
}
.card.is-pending{ cursor: pointer; }
.card:hover{
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.card.is-pending:hover{
  background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
}

/* card top */
.card-top{
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; min-width: 0;
}
.card-title-block{ min-width: 0; flex: 1; }
.card-srno{
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  color: var(--text-2);
  background: var(--bg-inset);
  padding: 3px 8px; border-radius: 5px;
  margin-bottom: 7px;
  letter-spacing: 0.02em;
  border: 1px solid var(--border-subtle);
}
.card-title{
  font-size: 16.5px; font-weight: 700;
  color: #ffffff; letter-spacing: -0.015em;
  line-height: 1.3;
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 7px;
  transition: color 0.15s ease;
  word-break: break-word;
}
.card-title:hover{ color: var(--accent-bright); }
.card-title i{
  font-size: 11px; opacity: 0.45;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.card-title:hover i{ opacity: 1; transform: translate(1px,-1px); }

.card-badges{
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 5px; flex-shrink: 0; max-width: 45%;
}
.badge{
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 20px;
  letter-spacing: 0.01em; white-space: nowrap;
  border: 1px solid transparent;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.badge-job{
  background: var(--accent-soft); color: var(--accent-bright);
  border-color: rgba(129,140,248,0.3);
  box-shadow: 0 0 12px -4px var(--accent-glow);
}
.badge-date{
  background: transparent; color: var(--text-3);
  font-weight: 500; padding: 0;
  font-size: 11.5px;
}
.badge-date i{ font-size: 10px; margin-right: 2px; }

/* card meta */
.card-meta{
  display: flex; flex-direction: column; gap: 7px;
  font-size: 13.5px;
}
.meta-line{
  display: flex; align-items: center; gap: 7px;
  color: var(--text-1);
  flex-wrap: wrap;
}
.meta-line i{ font-size: 12px; color: var(--text-3); width: 15px; text-align: center; flex-shrink: 0; }
.meta-line .value{ font-weight: 500; word-break: break-word; color: var(--text-1); }
.meta-line .value.strong{ color: #ffffff; font-weight: 600; }
.count-chip{
  font-size: 11px; font-weight: 700;
  background: var(--bg-inset); color: var(--text-2);
  padding: 2px 7px; border-radius: 20px;
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border-subtle);
}

/* ============ PROGRESS ============ */
.card-progress-wrap{
  display: flex; flex-direction: column; gap: 7px;
  margin-top: 2px;
}
.progress-head{
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.progress-head .progress-value{
  color: #ffffff;
  font-weight: 700;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  text-transform: none;
  letter-spacing: 0;
}
.progress-track{
  height: 7px;
  background: var(--bg-inset);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-subtle);
}
.progress-fill{
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #d97706, var(--warn));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  box-shadow: 0 0 14px -2px var(--warn-glow);
}
.progress-fill::after{
  content:'';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 60%);
  border-radius: inherit;
}
.progress-fill.mid{
  background: linear-gradient(90deg, var(--accent-deep), var(--accent-bright));
  box-shadow: 0 0 14px -2px var(--accent-glow);
}
.progress-fill.full{
  background: linear-gradient(90deg, #059669, var(--success-bright));
  box-shadow: 0 0 14px -2px var(--success-glow);
}

/* card foot */
.card-foot{
  display: flex; align-items: center; justify-content: flex-end;
  gap: 7px; padding-top: 6px;
  flex-wrap: wrap;
}
.card-actions{
  display: flex; align-items: center; gap: 7px;
  flex-wrap: wrap; justify-content: flex-end;
}
.action{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  padding: 6px 12px; border-radius: var(--radius-sm);
  transition: all 0.15s cubic-bezier(0.4,0,0.2,1);
  white-space: nowrap;
  border: 1px solid transparent;
  text-decoration: none;
  letter-spacing: -0.005em;
}
.action i{ font-size: 11px; }

.action-read{
  background: var(--bg-inset); color: var(--text-1);
  border-color: var(--border);
}
.action-read:hover{
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  color: white;
  border-color: rgba(129,140,248,0.45);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px -2px rgba(99,102,241,0.55);
}

.action-done{
  background: var(--success-soft); color: var(--success-bright);
  border-color: rgba(52,211,153,0.32);
}
.action-done:hover{
  background: linear-gradient(135deg, #059669, #10b981);
  color: white;
  border-color: rgba(52,211,153,0.55);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px -2px rgba(16,185,129,0.55);
}

.action-pending{
  background: var(--warn-soft); color: var(--warn-bright);
  border-color: rgba(251,191,36,0.32);
}
.action-pending:hover{
  background: linear-gradient(135deg, #d97706, #f59e0b);
  color: white;
  border-color: rgba(251,191,36,0.55);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px -2px rgba(245,158,11,0.55);
}

.action-sol{
  background: var(--bg-inset); color: var(--text-1);
  border-color: var(--border);
  max-width: 140px;
}
.action-sol:hover{
  border-color: var(--border-strong);
  color: #ffffff;
  background: var(--bg-hover);
}
.action-sol .label{ overflow: hidden; text-overflow: ellipsis; max-width: 96px; }

/* ============ LOAD MORE ============ */
.load-more-wrap{
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 32px 20px 20px;
  margin-top: 8px;
}
.load-more-count{
  font-size: 13px; font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.load-more-count .num{ color: #ffffff; font-weight: 700; }
.load-more-btn{
  display: inline-flex; align-items: center; gap: 9px;
  padding: 12px 24px;
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--border-strong);
  color: #ffffff;
  font-size: 14px; font-weight: 600;
  letter-spacing: -0.005em;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.load-more-btn::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}
.load-more-btn:hover{
  background: linear-gradient(180deg, var(--bg-4), var(--bg-3));
  border-color: rgba(129,140,248,0.4);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg), 0 0 24px -6px var(--accent-glow);
}
.load-more-btn:active{ transform: translateY(0) scale(0.98); }
.load-more-btn i{
  font-size: 12px;
  transition: transform 0.2s ease;
}
.load-more-btn:hover i{ transform: translateY(2px); }

.all-loaded{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px;
  border-radius: 30px;
  background: var(--bg-inset);
  border: 1px solid var(--border-subtle);
  color: var(--text-3);
  font-size: 13px; font-weight: 600;
}
.all-loaded i{ color: var(--success); font-size: 12px; }

/* ============ STATE / SKELETON ============ */
.state{
  grid-column: 1 / -1;
  padding: 60px 24px; text-align: center;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--text-1);
  font-size: 14px;
}
.state i.big{
  font-size: 28px; color: var(--text-3);
  margin-bottom: 12px; display: block;
}
.state .state-title{ font-weight: 600; color: #ffffff; margin-bottom: 5px; font-size: 15px; }
.state .state-sub{ font-size: 13px; color: var(--text-3); }

.skeleton-card{
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex; flex-direction: column; gap: 13px;
}
.sk-line{
  height: 13px; border-radius: 4px;
  background: linear-gradient(90deg, var(--bg-3) 25%, var(--bg-4) 50%, var(--bg-3) 75%);
  background-size: 200% 100%;
  animation: sk 1.6s ease-in-out infinite;
}
.sk-line.w40{ width: 40%; }
.sk-line.w60{ width: 60%; }
.sk-line.w80{ width: 80%; }
.sk-line.h16{ height: 16px; }
.sk-line.h20{ height: 20px; }
@keyframes sk{
  0%{ background-position: 200% 0; }
  100%{ background-position: -200% 0; }
}

/* ============ FAB ============ */
.fab-cluster{
  position: fixed; bottom: 22px; left: 22px;
  display: flex; flex-direction: column;
  gap: 9px; z-index: 500;
}
.fab{
  width: 44px; height: 44px;
  border-radius: 13px;
  display: grid; place-items: center;
  background: rgba(22,22,26,0.88);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border: 1px solid var(--border-strong);
  color: var(--text-1);
  font-size: 15px;
  box-shadow: var(--shadow-lg);
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.fab::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  border-radius: inherit;
  pointer-events: none;
}
.fab:hover{
  background: var(--bg-3);
  color: #ffffff;
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-xl);
}
.fab:active{ transform: translateY(0) scale(0.96); }
.fab.hidden{
  opacity: 0; pointer-events: none;
  transform: scale(0.7) translateY(10px);
}
.fab-primary{
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  color: white;
  border-color: rgba(129,140,248,0.45);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.1) inset,
    0 8px 24px -4px rgba(99,102,241,0.6),
    0 2px 8px -2px rgba(99,102,241,0.45);
}
.fab-primary:hover{
  background: linear-gradient(135deg, #7c3aed, #8b5cf6);
  color: white;
  border-color: rgba(129,140,248,0.55);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.15) inset,
    0 12px 32px -4px rgba(99,102,241,0.75),
    0 4px 12px -2px rgba(99,102,241,0.55);
}
.fab-primary.loading{ pointer-events: none; }
.fab-primary.loading i{ animation: spin 0.8s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ============ MODAL ============ */
.overlay{
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.22s ease;
}
.overlay.open{ display: flex; opacity: 1; }

.modal{
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 860px; max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-xl), 0 0 0 1px rgba(255,255,255,0.03) inset;
  overflow: hidden;
  transform: translateY(16px) scale(0.97);
  transition: transform 0.3s cubic-bezier(0.34,1.15,0.64,1);
  position: relative;
}
.modal::before{
  content:'';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(129,140,248,0.35), transparent);
  pointer-events: none;
}
.overlay.open .modal{ transform: translateY(0) scale(1); }

.modal-head{
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: flex-start; gap: 12px;
  background: rgba(0,0,0,0.18);
}
.modal-head-text{ flex: 1; min-width: 0; }
.modal-title{
  font-size: 17px; font-weight: 700;
  color: #ffffff; letter-spacing: -0.01em;
  line-height: 1.3;
  display: flex; align-items: center; gap: 9px;
  word-break: break-word;
}
.modal-title i{
  color: var(--accent-bright);
  font-size: 14px; flex-shrink: 0;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}
.modal-sub{
  font-size: 12.5px; font-weight: 500;
  color: var(--text-2); margin-top: 4px;
  word-break: break-word;
}
.modal-close{
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center;
  color: var(--text-2); font-size: 14px;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.modal-close:hover{
  background: var(--danger-soft); color: var(--danger);
}

.modal-body{
  padding: 26px 28px;
  overflow-y: auto; flex: 1;
  font-size: 15px; line-height: 1.7;
  color: var(--text-1);
  background: var(--bg-1);
}
.modal-body::-webkit-scrollbar{ width: 10px; }
.modal-body::-webkit-scrollbar-track{ background: transparent; }
.modal-body::-webkit-scrollbar-thumb{
  background: var(--border-strong); border-radius: 8px;
  border: 3px solid var(--bg-1);
}
.modal-body::-webkit-scrollbar-thumb:hover{ background: var(--text-faint); }

.modal-body h1{
  font-size: 24px; font-weight: 700;
  color: #ffffff; letter-spacing: -0.02em;
  margin: 26px 0 14px; line-height: 1.25;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-body h1:first-child{ margin-top: 0; }
.modal-body h2{
  font-size: 19px; font-weight: 700;
  color: #ffffff; letter-spacing: -0.01em;
  margin: 24px 0 12px; line-height: 1.3;
}
.modal-body h3{ font-size: 16.5px; font-weight: 700; color: #ffffff; margin: 20px 0 10px; }
.modal-body h4{
  font-size: 14.5px; font-weight: 700;
  color: var(--text-1); margin: 16px 0 8px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.modal-body p{ margin: 11px 0; word-break: break-word; }
.modal-body strong{ font-weight: 700; color: #ffffff; }
.modal-body em{ font-style: italic; color: var(--text-1); }
.modal-body ul,.modal-body ol{ margin: 11px 0 11px 24px; }
.modal-body li{ margin: 6px 0; word-break: break-word; }
.modal-body li::marker{ color: var(--text-3); }
.modal-body code{
  background: var(--bg-3); color: #f0abfc;
  padding: 2px 7px; border-radius: 5px;
  font-family: var(--font-mono); font-size: 13px;
  font-weight: 500; word-break: break-word;
  border: 1px solid var(--border-subtle);
}
.modal-body pre{
  background: #08080a; color: #e2e8f0;
  padding: 16px 18px; border-radius: var(--radius);
  overflow-x: auto; margin: 16px 0;
  font-size: 13px; line-height: 1.6;
  border: 1px solid var(--border);
}
.modal-body pre code{ background: transparent; color: inherit; padding: 0; border: none; font-size: inherit; }
.modal-body blockquote{
  border-left: 3px solid var(--accent-deep);
  background: var(--accent-softer);
  padding: 12px 18px; margin: 16px 0;
  border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text-1); font-style: italic;
}
.modal-body hr{
  border: none; border-top: 1px solid var(--border-subtle);
  margin: 22px 0;
}
.modal-body a{
  color: var(--accent-bright); text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-word;
}
.modal-body a:hover{ color: var(--accent); }
.modal-body table{
  width: 100%; border-collapse: separate;
  border-spacing: 0; margin: 16px 0;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.modal-body thead{ background: var(--bg-3); }
.modal-body th{
  padding: 12px 16px; text-align: left;
  font-weight: 700; font-size: 12px;
  color: var(--text-1);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
  word-break: break-word;
}
.modal-body td{
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top; word-break: break-word;
  color: var(--text-1);
}
.modal-body tbody tr:last-child td{ border-bottom: none; }
.modal-body tbody tr:hover{ background: rgba(255,255,255,0.025); }

.modal-foot{
  padding: 14px 22px;
  border-top: 1px solid var(--border-subtle);
  background: rgba(0,0,0,0.18);
  display: flex; justify-content: flex-end;
  gap: 8px; flex-wrap: wrap;
}

/* ============ TOAST ============ */
.toast{
  position: fixed; bottom: 26px; left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  color: #ffffff;
  padding: 12px 18px; border-radius: 11px;
  font-size: 14px; font-weight: 500;
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-xl);
  z-index: 2000;
  display: flex; align-items: center; gap: 9px;
  max-width: calc(100vw - 32px);
  pointer-events: none; opacity: 0;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s cubic-bezier(0.4,0,0.2,1);
}
.toast.show{
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast i{ color: var(--success); font-size: 14px; filter: drop-shadow(0 0 8px var(--success-glow)); }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px){
  .stats-grid{ grid-template-columns: repeat(2, 1fr); }
  .filter-row{ grid-template-columns: 1fr 1fr; }
  .filter-row .filter-group:last-child{ grid-column: span 2; }
}

@media (max-width: 640px){
  :root{ --header-h: 54px; }
  body{ font-size: 14.5px; }
  .app-header{ padding: 0 14px; }
  .container{ padding: 14px; }
  .stats-grid{ gap: 8px; margin-bottom: 12px; }
  .stat-card{ padding: 9px 12px; gap: 10px; }
  .stat-icon{ width: 28px; height: 28px; font-size: 12px; }
  .stat-value{ font-size: 17px; }
  .stat-label{ font-size: 10.5px; }
  .filter-row{ grid-template-columns: 1fr; gap: 10px; }
  .filter-row .filter-group:last-child{ grid-column: auto; }
  .filter-panel{ padding: 14px 16px; }
  .cards{ grid-template-columns: 1fr; gap: 10px; }
  .card{ padding: 14px 16px; }
  .card-title{ font-size: 15.5px; }
  .fab-cluster{ bottom: 16px; left: 16px; gap: 7px; }
  .fab{ width: 42px; height: 42px; border-radius: 12px; font-size: 14px; }
  .modal{ border-radius: var(--radius-lg); }
  .modal-head{ padding: 16px 18px; }
  .modal-body{ padding: 20px 20px; font-size: 14.5px; }
  .modal-body h1{ font-size: 21px; }
  .modal-body h2{ font-size: 17px; }
  .modal-body table{ font-size: 13px; }
  .modal-body th,.modal-body td{ padding: 9px 11px; }
  .modal-foot{ padding: 12px 18px; }
  .btn span.hide-sm{ display: none; }
  .load-more-btn{ padding: 11px 20px; font-size: 13.5px; }
}

@media (max-width: 400px){
  .brand-sub{ display: none; }
  .brand-title{ font-size: 14px; }
  .btn{ padding: 7px 11px; font-size: 12.5px; }
  .stat-card{ padding: 8px 10px; }
  .stat-value{ font-size: 15.5px; }
  .card-title{ font-size: 15px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="brand-mark"><i class="fas fa-layer-group"></i></div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">
          <span id="brandTitleText">Topic Tracker</span>
        </div>
        <div class="brand-sub">Job preparation dashboard</div>
      </div>
    </div>
    <div class="header-actions">
      <a href="https://docs.google.com/spreadsheets/d/1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc/edit?gid=0#gid=0"
         class="btn btn-ghost" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-table"></i> <span class="hide-sm">Sheet</span>
      </a>
    </div>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card is-accent">
      <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
      <div class="stat-body">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
    </div>
    <div class="stat-card is-success">
      <div class="stat-icon"><i class="fas fa-circle-check"></i></div>
      <div class="stat-body">
        <div class="stat-label">Done</div>
        <div class="stat-value" id="statCovered">0</div>
      </div>
    </div>
    <div class="stat-card is-warn">
      <div class="stat-icon"><i class="fas fa-clock"></i></div>
      <div class="stat-body">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="statPending">0</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-book"></i></div>
      <div class="stat-body">
        <div class="stat-label">Subjects</div>
        <div class="stat-value" id="statSubjects">0</div>
      </div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <i class="fas fa-search search-icon"></i>

/* ========== PERSISTENCE ========== */

/* ========== HELPERS ========== */
function escapeHtml(unsafe){
  if(unsafe === null || unsafe === undefined) return '';
  return String(unsafe)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function extractFileName(url){
  if(!url || url === '#') return 'sol';
  try{
    let clean = url.split('#')[0].split('?')[0];
    const parts = clean.split('/');
    let last = parts[parts.length-1] || '';
    try{ last = decodeURIComponent(last); }catch(e){}
    if(!last || (last.indexOf('.') === -1 && !/\w/.test(last))) return 'sol';
    if(last.length > 24) last = last.slice(0,21) + '…';
    return last || 'sol';
  }catch(e){ return 'sol'; }
}
function buildJobScopeKey(jobsSet){
  if(!jobsSet || jobsSet.size === 0) return 'ALL';
  return 'JOB::' + Array.from(jobsSet).sort().join('|');
}
function scopedCoverageKey(subject, jobScopeKey){ return subject + '||' + jobScopeKey; }

function matchesGlobalSearch(item, term){
  if(!term || term.trim() === '') return true;
  const q = term.toLowerCase().trim();
  const fields = [
    String(item.srno), String(item.subject), String(item.marks),
    String(item.mainTopic), String(item.subTopic), String(item.displayTopic),
    String(item.job), String(item.lastUpdate),
    String(item.markdownNotes).substring(0,500),
    String(item.url), String(item.solFileName)
  ];
  return fields.some(f => f.toLowerCase().includes(q));
}

function scheduleFastFilterRefresh(){
  if(filterRefreshScheduled) return;
  filterRefreshScheduled = true;
  requestAnimationFrame(() => {
    filterRefreshScheduled = false;
    refreshAllFilters();
    applyFiltersAndRender();
    saveFiltersToStorage();
  });
}

/* ========== CSV ========== */
function parseCSV(csvText){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<csvText.length;i++){
    const c = csvText[i], n = csvText[i+1];
    if(c === '"'){
      if(inQuotes && n === '"'){ field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if(c === ',' && !inQuotes){ row.push(field); field = ''; }
    else if((c === '\n' || c === '\r') && !inQuotes){
      if(c === '\r' && n === '\n') i++;
      row.push(field);
      if(row.length > 1 || (row.length === 1 && row[0].trim() !== '')) rows.push(row);
      row = []; field = '';
    } else field += c;
  }
  if(field !== '' || row.length){
    row.push(field);
    if(row.length > 1 || (row.length === 1 && row[0].trim() !== '')) rows.push(row);
  }
  return rows;
}

function looksLikeMarkdown(text){
  if(!text) return false;
  const t = text.trim();
  if(t.length < 15) return false;
  if(t === '—' || t === '-' || t === 'N/A' || t === 'na' || t === 'NA') return false;
  if(/^https?:\/\/\S+$/.test(t)) return false;
  let signals = 0;
  if(/^#{1,6}\s/m.test(t)) signals++;
  if(/\*\*[^*]+\*\*/.test(t)) signals++;
  if(/^\s*[-*+]\s+/m.test(t)) signals++;
  if(/^\s*\d+\.\s+/m.test(t)) signals++;
  if(/^\s*\|.*\|\s*$/m.test(t)) signals++;
  if(/```/.test(t)) signals++;
  if(/^\s*>\s/m.test(t)) signals++;
  if(/\[[^\]]+\]\([^)]+\)/.test(t)) signals++;
  return signals >= 2 || (signals >= 1 && t.length > 100);
}

function mapRowsToObjects(rows){
  if(!rows.length) return [];
  const dataRows = rows.slice(1);
  const out = [];
  const padded = dataRows.map(r => {
    const c = r.slice();
    while(c.length < EXPECTED_COLUMNS) c.push('');
    return c;
  });
  for(const row of padded){
    if(row.length < 3) continue;
    const srno = (row[0]||'').trim();
    const subjectWithMarks = (row[1]||'').trim();
    const mainTopic = (row[2]||'').trim();
    const subTopic = (row[3]||'').trim();
    const job = (row[4]||'').trim();
    const url = (row[5]||'').trim();
    const solUrl = (row[6]||'').trim();
    const lastUpdate = (row[7]||'').trim();
    const markdownNotes = (row[8]||'').trim();

    let subject = subjectWithMarks, marks = '';
    const m = subjectWithMarks.match(/;\s*(\d+)\s*$/);
    if(m){ marks = m[1]; subject = subjectWithMarks.replace(/;\s*\d+\s*$/,'').trim(); }

    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
    const hasSol = solUrl && solUrl !== '#' && solUrl !== '—' && solUrl.trim() !== '';
    const hasMarkdown = looksLikeMarkdown(markdownNotes);
    const status = (hasUrl || hasSol || hasMarkdown) ? 'covered' : 'pending';
    const displayTopic = subTopic || mainTopic;

    out.push({
      srno: srno || '—',
      subject: subject || '—',
      marks: marks || '—',
      mainTopic: mainTopic || '—',
      subTopic: subTopic || '—',
      displayTopic: displayTopic || '—',
      url: hasUrl ? url : '#',
      hasUrl,
      solUrl: hasSol ? solUrl : '',
      hasSol,
      solFileName: hasSol ? extractFileName(solUrl) : '',
      markdownNotes: hasMarkdown ? markdownNotes : '',
      hasMarkdown,
      status,
      job: job || '—',
      lastUpdate: lastUpdate || ''
    });
  }
  return out;
}

/* ========== COUNTS ========== */
function computeCounts(data){
  subjectCounts = {};
  mainTopicCounts = {};
  subjectCoverageScoped = {};
  const allJobs = new Set();
  data.forEach(item => {
    if(item.subject && item.subject !== '—') subjectCounts[item.subject] = (subjectCounts[item.subject]||0) + 1;
    if(item.mainTopic && item.mainTopic !== '—') mainTopicCounts[item.mainTopic] = (mainTopicCounts[item.mainTopic]||0) + 1;
    if(item.job && item.job !== '—') allJobs.add(item.job);
  });
  const scopes = ['ALL'];
  allJobs.forEach(j => scopes.push('JOB::' + j));
  scopes.forEach(scopeKey => {
    data.forEach(item => {
      if(!item.subject || item.subject === '—') return;
      if(scopeKey !== 'ALL'){
        const jobName = scopeKey.slice(5);
        if(item.job !== jobName) return;
      }
      const key = scopedCoverageKey(item.subject, scopeKey);
      if(!subjectCoverageScoped[key]) subjectCoverageScoped[key] = { total:0, done:0 };
      subjectCoverageScoped[key].total++;
      if(item.status === 'covered') subjectCoverageScoped[key].done++;
    });
  });
}

function getSubjectCoveragePctForScope(subject, jobsSet){
  if(!subject || subject === '—') return 0;
  if(!jobsSet || jobsSet.size <= 1){
    const scopeKey = buildJobScopeKey(jobsSet);
    const c = subjectCoverageScoped[scopedCoverageKey(subject, scopeKey)];
    if(!c || c.total === 0) return 0;
    return Math.round((c.done / c.total) * 100);
  }
  let total = 0, done = 0;
  rawData.forEach(item => {
    if(item.subject !== subject) return;
    if(!jobsSet.has(item.job)) return;
    total++;
    if(item.status === 'covered') done++;
  });
  if(total === 0) return 0;
  return Math.round((done / total) * 100);
}

function getSubjectCountForScope(subject, jobsSet){
  if(!subject || subject === '—') return 0;
  if(!jobsSet || jobsSet.size === 0) return subjectCounts[subject] || 0;
  let count = 0;
  rawData.forEach(item => {
    if(item.subject === subject && jobsSet.has(item.job)) count++;
  });
  return count;
}

function updateStats(data){
  statTotal.textContent = data.length;
  statCovered.textContent = data.filter(d => d.status === 'covered').length;
  statPending.textContent = data.filter(d => d.status === 'pending').length;
  statSubjects.textContent = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;
}

function updateBrandTitle(){
  if(selectedJobs.size === 1){
    brandTitle.innerHTML = `Topic Tracker <span class="job-pill">${escapeHtml(Array.from(selectedJobs)[0])}</span>`;
  } else if(selectedJobs.size > 1){

  } else {
    brandTitle.textContent = 'Topic Tracker';
  }
}

/* ========== OPTIONS ========== */
function getAvailableOptions(excludeFilter){
  const applySubjects = excludeFilter === 'subject' ? new Set() : selectedSubjects;
  const applyTopics   = excludeFilter === 'topic'   ? new Set() : selectedTopics;
  const applyJobs     = excludeFilter === 'job'     ? new Set() : selectedJobs;
  const subjects = new Set(), topics = new Set(), jobs = new Set();
  rawData.forEach(item => {
    if(selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return;
    if(!matchesGlobalSearch(item, globalSearchTerm)) return;
    if(applySubjects.size > 0 && !applySubjects.has(item.subject)) return;
    if(applyTopics.size > 0 && !applyTopics.has(item.displayTopic)) return;
    if(applyJobs.size > 0 && !applyJobs.has(item.job)) return;
    if(excludeFilter === 'subject'){
      if(selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return;
      if(item.subject && item.subject !== '—') subjects.add(item.subject);
    } else if(excludeFilter === 'topic'){
      if(selectedTopics.size > 0 && !selectedTopics.has(item.displayTopic)) return;
      if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
    } else if(excludeFilter === 'job'){
      if(selectedJobs.size > 0 && !selectedJobs.has(item.job)) return;
      if(item.job && item.job !== '—') jobs.add(item.job);
    } else {
      if(item.subject && item.subject !== '—') subjects.add(item.subject);
      if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
      if(item.job && item.job !== '—') jobs.add(item.job);
    }
  });
  return {
    subjects: Array.from(subjects).sort(),
    topics: Array.from(topics).sort(),
    jobs: Array.from(jobs).sort()
  };
}

function pruneSelections(){
  const a = getAvailableOptions('none');
  Array.from(selectedSubjects).forEach(s => { if(!a.subjects.includes(s)) selectedSubjects.delete(s); });
  Array.from(selectedTopics).forEach(t => { if(!a.topics.includes(t)) selectedTopics.delete(t); });
  Array.from(selectedJobs).forEach(j => { if(!a.jobs.includes(j)) selectedJobs.delete(j); });
}

/* ========== MULTI-SELECT ========== */
function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch){
  const dropdown = container.querySelector('.ms-drop');
  const trigger = container.querySelector('.ms-trigger');
  const placeholder = container.querySelector('.ph');
  function closeDropdown(){
    dropdown.classList.remove('open');
    trigger.classList.remove('open');
  }
  if(!trigger.dataset.listenerAttached){
    trigger.dataset.listenerAttached = '1';
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.ms-drop.open').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.ms-trigger.open').forEach(t => t.classList.remove('open'));
      if(!isOpen){
        dropdown.classList.add('open');
        trigger.classList.add('open');
        const latest = container._latestRebuild;
        if(latest && latest._render){
          const si = dropdown.querySelector('.ms-search');
          if(si){ si.value = ''; setTimeout(() => si.focus(), 50); }
          latest._render('');
        }
      }
    });
    document.addEventListener('click', (e) => { if(!container.contains(e.target)) closeDropdown(); });
  }
  function rebuild(newOptions){
    dropdown.innerHTML = '';
    let searchInput = null;
    if(enableSearch){
      searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.className = 'ms-search';
      searchInput.placeholder = 'Search…';
      searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
      searchInput.addEventListener('click', (e) => e.stopPropagation());
      dropdown.appendChild(searchInput);
    }
    const actions = document.createElement('div');
    actions.className = 'ms-actions';
    const btnAll = document.createElement('button');
    btnAll.textContent = 'Select all';
    btnAll.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = newOptions.filter(opt => !searchInput || !searchInput.value || opt.label.toLowerCase().includes(searchInput.value.toLowerCase()));
      visible.forEach(opt => selectedSet.add(opt.value));
      onUpdate(); updateTriggerText();
      renderDropdown(searchInput ? searchInput.value : '');
    });
    const btnClear = document.createElement('button');
    btnClear.textContent = 'Clear';
    btnClear.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedSet.clear();
      onUpdate(); updateTriggerText();
      renderDropdown(searchInput ? searchInput.value : '');
    });
    actions.appendChild(btnAll);
    actions.appendChild(btnClear);
    dropdown.appendChild(actions);
    function renderDropdown(filterText){
      dropdown.querySelectorAll('.ms-opt').forEach(el => el.remove());
      let filtered = newOptions;
      if(filterText && filterText.trim()){
        const q = filterText.toLowerCase().trim();
        filtered = newOptions.filter(opt => opt.label.toLowerCase().includes(q));
      }
      if(filtered.length === 0){
        const empty = document.createElement('div');
        empty.className = 'ms-opt';
        empty.style.opacity = '0.5';
        empty.style.cursor = 'default';
        empty.textContent = 'No matches';
        dropdown.appendChild(empty);
        return;
      }
      filtered.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'ms-opt' + (selectedSet.has(opt.value) ? ' selected' : '');
        div.innerHTML = `<span class="check"><i class="fas fa-check"></i></span><span>${escapeHtml(opt.label)}</span>`;
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          if(selectedSet.has(opt.value)) selectedSet.delete(opt.value);
          else selectedSet.add(opt.value);
          onUpdate(); updateTriggerText(); closeDropdown();
        });
        dropdown.appendChild(div);
      });
    }
    function updateTriggerText(){
      if(selectedSet.size === 0){
        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
        placeholder.style.display = 'inline';
        const ex = trigger.querySelector('.sel');
        if(ex) ex.remove();
      } else {
        placeholder.style.display = 'none';
        let sel = trigger.querySelector('.sel');
        if(!sel){
          sel = document.createElement('span');
          sel.className = 'sel';
          trigger.insertBefore(sel, trigger.querySelector('.chev'));
        }
        sel.textContent = `${selectedSet.size} selected`;
        sel.style.display = 'inline';
      }
    }
    rebuild._render = renderDropdown;
    rebuild._updateText = updateTriggerText;
    container._latestRebuild = rebuild;
    renderDropdown('');
    updateTriggerText();
  }
  rebuild(options);
  return rebuild;
}

/* ========== PROMPT ========== */
function buildGoogleSearchQuery(item){
  const parts = [];
  if(item.subTopic && item.subTopic !== '—') parts.push(item.subTopic);
  if(item.mainTopic && item.mainTopic !== '—') parts.push(item.mainTopic);
  if(item.subject && item.subject !== '—') parts.push(item.subject);
  if(item.job && item.job !== '—') parts.push(item.job);
  return parts.join(' ');
}
function buildPrompt(item){
  const jobTitle = (item.job && item.job !== '—') ? item.job : null;
  const fallback = (item.mainTopic && item.mainTopic !== '—') ? item.mainTopic : 'this topic';
  const title = jobTitle || fallback;
  return `Prepare me on ${item.subTopic} 20 mcqs with detail solution for ${title} exam.\n\nIt should be:\nSrno\nMcq question\nChoices\nDetail solution\nCorrect answer as per choices`;
}
function copyPrompt(item){
  const text = buildPrompt(item);
  if(fallbackCopy(text)){ showToast(`Copied prompt: ${item.subTopic}`); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(`Copied prompt: ${item.subTopic}`)).catch(() => showToast('Copy failed'));
  } else showToast('Copy failed');
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '0'; ta.style.left = '0';
  ta.style.opacity = '0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);
  let ok = false;
  try{ ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); }
  catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function showToast(msg){
  toastMessage.textContent = msg;
  toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
}

/* ========== MARKDOWN ========== */
function renderMarkdown(md){
  if(!md) return '';
  let html = md.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const codeBlocks = [];
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => {
    const i = codeBlocks.length; codeBlocks.push(code); return `\u0000CODE${i}\u0000`;
  });
  const lines = html.split('\n');
  const out = [];
  let inTable = false, inList = false, listType = null, inQuote = false;
  const closeList = () => { if(inList){ out.push(listType === 'ol' ? '</ol>' : '</ul>'); inList = false; listType = null; } };
  const closeTable = () => { if(inTable){ out.push('</tbody></table>'); inTable = false; } };
  const closeQuote = () => { if(inQuote){ out.push('</blockquote>'); inQuote = false; } };
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    const cbMatch = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if(cbMatch){
      closeList(); closeTable(); closeQuote();
      const code = codeBlocks[parseInt(cbMatch[1],10)];
      out.push(`<pre><code>${code}</code></pre>`);
      continue;
    }
    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
    const next = lines[i+1] || '';
    const isSep = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(next);
    if(isTableRow && isSep && !inTable){
      closeList(); closeQuote();
      inTable = true;
      out.push('<table><thead>');
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c => `<th>${inline(c.trim())}</th>`).join('') + '</tr>');
      out.push('</thead><tbody>');
      i++;
      continue;
    }
    if(inTable && isTableRow){
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c => `<td>${inline(c.trim())}</td>`).join('') + '</tr>');
      continue;
    }
    if(inTable && !isTableRow) closeTable();
    if(/^\s*>\s?/.test(line)){
      if(!inQuote){ closeList(); out.push('<blockquote>'); inQuote = true; }
      out.push(inline(line.replace(/^\s*>\s?/,'')));
      continue;
    } else if(inQuote) closeQuote();
    const h1 = line.match(/^#\s+(.*)$/);
    const h2 = line.match(/^##\s+(.*)$/);
    const h3 = line.match(/^###\s+(.*)$/);
    const h4 = line.match(/^####\s+(.*)$/);
    if(h1){ closeList(); closeTable(); closeQuote(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }
    if(h2){ closeList(); closeTable(); closeQuote(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }
    if(h3){ closeList(); closeTable(); closeQuote(); out.push(`<h3>${inline(h3[1])}</h3>`); continue; }
    if(h4){ closeList(); closeTable(); closeQuote(); out.push(`<h4>${inline(h4[1])}</h4>`); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){
      closeList(); closeTable(); closeQuote();
      out.push('<hr>');
      continue;
    }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){
      closeTable(); closeQuote();
      if(!inList || listType !== 'ul'){ closeList(); out.push('<ul>'); inList = true; listType = 'ul'; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){
      closeTable(); closeQuote();
      if(!inList || listType !== 'ol'){ closeList(); out.push('<ol>'); inList = true; listType = 'ol'; }
      out.push(`<li>${inline(ol[1])}</li>`);
      continue;
    }
    if(line.trim() === ''){ closeList(); closeTable(); closeQuote(); continue; }
    closeList(); closeTable(); closeQuote();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList(); closeTable(); closeQuote();
  return out.join('\n');
}
function parseRow(line){
  let t = line.trim();
  if(t.startsWith('|')) t = t.slice(1);
  if(t.endsWith('|')) t = t.slice(0,-1);
  return t.split('|');
}
function inline(text){
  if(!text) return '';
  let s = text;
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

/* ========== CARDS ========== */
function renderCards(data){
  if(!data.length){
    cardsContainer.innerHTML = `
      <div class="state">
        <i class="fas fa-magnifying-glass big"></i>
        <div class="state-title">No matching topics</div>
        <div class="state-sub">Try adjusting filters or search query</div>
      </div>`;
    return;
  }

  const slice = data.slice(0, visibleCount);
  const showJobBadge = selectedJobs.size === 0;
  const frag = document.createDocumentFragment();

  slice.forEach(item => {
    const card = document.createElement('div');
    card.className = `card ${item.status === 'covered' ? 'is-covered' : 'is-pending'}`;

    if(item.status === 'pending'){
      card.title = 'Click to copy DeepSeek prompt';
      card.addEventListener('click', (e) => {
        if(e.target.closest('a,button')) return;
        copyPrompt(item);
      });
    }

    /* TOP */
    const top = document.createElement('div');
    top.className = 'card-top';

    const titleBlock = document.createElement('div');
    titleBlock.className = 'card-title-block';

    const srno = document.createElement('div');
    srno.className = 'card-srno';
    srno.textContent = `#${item.srno}`;
    titleBlock.appendChild(srno);

    const titleLink = document.createElement('a');
    titleLink.className = 'card-title';
    titleLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
    titleLink.target = '_blank';
    titleLink.rel = 'noopener noreferrer';
    titleLink.title = 'Search: ' + buildGoogleSearchQuery(item);
    titleLink.innerHTML = `${escapeHtml(item.subTopic !== '—' ? item.subTopic : '—')} <i class="fas fa-arrow-up-right-from-square"></i>`;
    titleLink.addEventListener('click', (e) => e.stopPropagation());
    titleBlock.appendChild(titleLink);
    top.appendChild(titleBlock);

    const badges = document.createElement('div');
    badges.className = 'card-badges';
    if(showJobBadge && item.job && item.job !== '—'){
      const b = document.createElement('span');
      b.className = 'badge badge-job';
      b.textContent = item.job;
      b.title = 'Job: ' + item.job;
      badges.appendChild(b);
    }
    if(item.lastUpdate){
      const d = document.createElement('span');
      d.className = 'badge badge-date';
      d.innerHTML = `<i class="fas fa-clock"></i>${escapeHtml(item.lastUpdate)}`;
      d.title = 'Last update';
      badges.appendChild(d);
    }
    if(badges.children.length) top.appendChild(badges);
    card.appendChild(top);

    /* META */
    const meta = document.createElement('div');
    meta.className = 'card-meta';

    const mainLine = document.createElement('div');
    mainLine.className = 'meta-line';
    const mainCount = mainTopicCounts[item.mainTopic] || 1;
    mainLine.innerHTML = `
      <i class="fas fa-folder"></i>
      <span class="value strong">${escapeHtml(item.mainTopic)}</span>
      <span class="count-chip">${mainCount}</span>
    `;
    meta.appendChild(mainLine);

    const subjLine = document.createElement('div');
    subjLine.className = 'meta-line';
    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);
    subjLine.innerHTML = `
      <i class="fas fa-book"></i>
      <span class="value">${escapeHtml(item.subject)}</span>
      <span class="count-chip">${subjCount}</span>
    `;
    meta.appendChild(subjLine);

    card.appendChild(meta);

    /* PROGRESS */
    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
    const covCls = covPct === 100 ? 'full' : (covPct >= 50 ? 'mid' : '');
    const progressWrap = document.createElement('div');
    progressWrap.className = 'card-progress-wrap';
    progressWrap.innerHTML = `
      <div class="progress-head">
        <span>Coverage</span>
        <span class="progress-value">${covPct}%</span>
      </div>
      <div class="progress-track" title="Subject coverage${selectedJobs.size ? ' for selected job(s)' : ''}: ${covPct}%">

    `;

    /* FOOT */

    foot.className = 'card-foot';

      readBtn.className = 'action action-read';
      readBtn.title = `Read notes for "${item.subTopic}"`;

      readBtn.addEventListener('click', (e) => { e.stopPropagation(); openNotesModal(item); });

    }

    if(item.hasUrl){
      const a = document.createElement('a');

      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'action action-done';
      a.title = 'Open complete chat';
      a.innerHTML = `<i class="fas fa-circle-check"></i> Done <i class="fas fa-arrow-up-right-from-square" style="opacity:0.7;"></i>`;
      a.addEventListener('click', (e) => e.stopPropagation());
      actions.appendChild(a);
    } else {
      const isCovered = item.status === 'covered';
      const el = document.createElement(isCovered ? 'span' : 'button');
      el.className = 'action ' + (isCovered ? 'action-done' : 'action-pending');
      el.title = isCovered ? 'Marked done (has solution / notes)' : 'Click to copy DeepSeek prompt';
      el.innerHTML = isCovered
        ? `<i class="fas fa-circle-check"></i> Done`
        : `<i class="fas fa-clock"></i> Pending <i class="fas fa-copy" style="opacity:0.7;"></i>`;
      if(!isCovered){

      }
      actions.appendChild(el);
    }

    if(item.hasSol){
      const a = document.createElement('a');
      a.href = item.solUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'action action-sol';
      a.title = 'Open solution file: ' + item.solFileName;
      a.innerHTML = `<i class="fas fa-file-lines"></i><span class="label">${escapeHtml(item.solFileName)}</span>`;
      a.addEventListener('click', (e) => e.stopPropagation());
      actions.appendChild(a);
    }

    foot.appendChild(actions);
    card.appendChild(foot);
    frag.appendChild(card);
  });

  cardsContainer.innerHTML = '';
  cardsContainer.appendChild(frag);
}

/* ========== POPULATE ========== */
function populateFilters(data){
  const subjects = new Set(), topics = new Set(), jobs = new Set();
  data.forEach(item => {
    if(item.subject && item.subject !== '—') subjects.add(item.subject);
    if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
    if(item.job && item.job !== '—') jobs.add(item.job);
  });
  const subjOpts = Array.from(subjects).sort().map(s => ({ value:s, label:s }));
  const topOpts = Array.from(topics).sort().map(t => ({ value:t, label:t }));
  const jobOpts = Array.from(jobs).sort().map(j => ({ value:j, label:j }));

  const sWrap = $('subjectMultiWrap'); sWrap.dataset.type = 'subjects';
  if(!rebuildSubjectSelect) rebuildSubjectSelect = buildMultiSelect(sWrap, subjOpts, selectedSubjects, onFilterChange, true);
  else rebuildSubjectSelect(subjOpts);

  const tWrap = $('topicMultiWrap'); tWrap.dataset.type = 'topics';
  if(!rebuildTopicSelect) rebuildTopicSelect = buildMultiSelect(tWrap, topOpts, selectedTopics, onFilterChange, true);
  else rebuildTopicSelect(topOpts);

  const jWrap = $('jobMultiWrap'); jWrap.dataset.type = 'jobs';
  if(!rebuildJobSelect) rebuildJobSelect = buildMultiSelect(jWrap, jobOpts, selectedJobs, onFilterChange, true);
  else rebuildJobSelect(jobOpts);

  subjectCountHint.textContent = subjOpts.length;
  topicCountHint.textContent = topOpts.length;
  jobCountHint.textContent = jobOpts.length;
}

  if(y < 100) fabScrollTop.classList.add('hidden'); else fabScrollTop.classList.remove('hidden');
  if(maxY <= 0 || y >= maxY - 100) fabScrollBottom.classList.add('hidden'); else fabScrollBottom.classList.remove('hidden');
}

window.addEventListener('scroll', () => {

    updateScrollButtons();
    saveScrollPosition();
  });
}, { passive: true });
fabScrollTop.addEventListener('click', () => {

});
fabScrollBottom.addEventListener('click', () => {

function restoreScrollPosition(){

}

/* ========== LOAD ========== */
function setRefreshLoading(loading){
  isLoading = loading;
  fabRefresh.classList.toggle('loading', loading);
}
async function fetchFreshData(){
  const bust = `&_=${Date.now()}`;
  const res = await fetch(CSV_URL + bust, { cache: 'no-store' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if(text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')){
    throw new Error('Sheet is not public. Share as "Anyone with link can view".');
  }
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('No data rows');
  const data = mapRowsToObjects(rows);
  if(!data.length) throw new Error('No parsed data');
  return data;
}
function applyDataAndRender(data, opts){
  opts = opts || {};
  rawData = data;
  computeCounts(rawData);
  populateFilters(rawData);
  if(opts.isFirstLoad){
    setupStatusSegments();
    cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
    cbPending.classList.toggle('active', selectedStatuses.has('pending'));
    refreshAllFilters();
    applyFiltersAndRender();
    restoreScrollPosition();
  } else {
    refreshAllFilters();
    applyFiltersAndRender();
  }
  requestAnimationFrame(updateScrollButtons);
}
function renderSkeletons(){

  for(let i=0;i<6;i++){
    html += `<div class="skeleton-card">
      <div class="sk-line w40"></div>
      <div class="sk-line h20 w80"></div>
      <div class="sk-line w60"></div>
      <div class="sk-line w40"></div>
    </div>`;
  }
  cardsContainer.innerHTML = html;
}
async function refreshFromNetwork(opts){
  opts = opts || {};
  if(isLoading) return;
  if(opts.isManual) setRefreshLoading(true);
  else renderSkeletons();
  try{
    const fresh = await fetchFreshData();
    saveDataToStorage(fresh);
    applyDataAndRender(fresh, { isFirstLoad: opts.isFirstLoad });
    if(opts.isManual) showToast('Data refreshed');
  } catch(err){
    console.error('Fetch error:', err);
    if(opts.isManual){
      showToast('Refresh failed — check console');
    } else {
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  } finally {
    if(opts.isManual) setRefreshLoading(false);
  }
}

/* ========== SEARCH ========== */
function updateSearchClearButton(){
  globalSearchClear.classList.toggle('visible', !!(globalSearchTerm && globalSearchTerm.trim()));
}
globalSearchInput.addEventListener('input', () => {
  if(globalSearchInput.value === globalSearchTerm) return;
  globalSearchTerm = globalSearchInput.value;
  updateSearchClearButton();
  scheduleFastFilterRefresh();
});
globalSearchClear.addEventListener('click', () => {
  globalSearchInput.value = '';
  globalSearchTerm = '';
  updateSearchClearButton();
  scheduleFastFilterRefresh();
  globalSearchInput.focus();
});

/* ========== INIT ========== */
(async function init(){
  loadFiltersFromStorage();
  cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
  cbPending.classList.toggle('active', selectedStatuses.has('pending'));
  if(globalSearchTerm) globalSearchInput.value = globalSearchTerm;
  updateSearchClearButton();

  const cached = loadDataFromStorage();
  if(cached){
    applyDataAndRender(cached, { isFirstLoad: true });
  } else {
    renderSkeletons();
    try{
      const fresh = await fetchFreshData();
      saveDataToStorage(fresh);
      applyDataAndRender(fresh, { isFirstLoad: true });
    } catch(err){
      console.error('Init fetch error:', err);
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  }
})();

fabRefresh.addEventListener('click', () => {
  clearPersistedData();
  refreshFromNetwork({ isManual: true, isFirstLoad: false });
});
window.addEventListener('beforeunload', saveScrollPosition);

})();
</script>
</body>
</html>
