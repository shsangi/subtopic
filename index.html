<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<meta name="theme-color" content="#0f172a">
<title>Topic Tracker — Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:            #f7f8fa;
  --bg-elevated:   #ffffff;
  --bg-subtle:     #f1f3f6;
  --bg-inset:      #eef1f5;
  --border:        #e4e8ee;
  --border-strong: #d4dae3;
  --border-subtle: #eef1f5;

  --text:          #0f172a;
  --text-secondary:#475569;
  --text-muted:    #7b8794;
  --text-faint:    #9aa5b1;

  --accent:        #2563eb;
  --accent-hover:  #1d4ed8;
  --accent-soft:   #eff4ff;
  --accent-border: #c9dcff;

  --success:       #0d9488;
  --success-soft:  #e8f7f4;
  --success-border:#b8e5dd;

  --warn:          #c2410c;
  --warn-soft:     #fef3ec;
  --warn-border:   #f8d5be;

  --danger:        #dc2626;
  --danger-soft:   #fef2f2;
  --danger-border: #fecaca;

  --shadow-xs: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px -2px rgba(15,23,42,0.08), 0 2px 6px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 12px 32px -8px rgba(15,23,42,0.16), 0 4px 12px -4px rgba(15,23,42,0.08);
  --shadow-xl: 0 24px 56px -12px rgba(15,23,42,0.24), 0 8px 20px -8px rgba(15,23,42,0.12);

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --ring: 0 0 0 3px rgba(37,99,235,0.14);
  --ring-danger: 0 0 0 3px rgba(220,38,38,0.14);

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --header-h: 56px;
}

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }

body{
  font-family: var(--font-sans);
  font-feature-settings: 'cv02','cv03','cv04','cv11','ss01';
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input{ font-family:inherit; }
a{ color:inherit; }

/* ============ HEADER ============ */
.app-header{
  position: sticky; top: 0; z-index: 100;
  height: var(--header-h);
  background: rgba(255,255,255,0.82);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px;
}
.app-header-inner{
  max-width: 1400px; width:100%; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand{
  display: flex; align-items: center; gap: 10px;
  min-width: 0;
}
.brand-mark{
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  display: grid; place-items: center;
  color: white; font-size: 13px;
  box-shadow: 0 3px 8px -2px rgba(37,99,235,0.4);
  flex-shrink: 0;
}
.brand-text{
  display: flex; flex-direction: column; min-width: 0; line-height: 1.15;
}
.brand-title{
  font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
}
.brand-title .job-pill{
  font-size: 11px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--accent-border);
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0;
}
.brand-sub{
  font-size: 11px; color: var(--text-muted); font-weight: 500;
}

.header-actions{ display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.btn{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 600; letter-spacing: -0.005em;
  transition: all 0.15s ease;
  white-space: nowrap; user-select: none;
}
.btn i{ font-size: 11px; }
.btn-ghost{
  color: var(--text-secondary);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  box-shadow: var(--shadow-xs);
}
.btn-ghost:hover{
  background: var(--bg-subtle);
  border-color: var(--border-strong);
  color: var(--text);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.btn-ghost:active{ transform: translateY(0); }

.btn-primary{
  background: var(--text);
  color: white;
  border: 1px solid var(--text);
}
.btn-primary:hover{
  background: #1e293b;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

/* ============ CONTAINER ============ */
.container{
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

/* ============ STATS ============ */
.stats-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 4px;
  position: relative; overflow: hidden;
  transition: all 0.15s ease;
}
.stat-card:hover{
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}
.stat-head{
  display: flex; align-items: center; justify-content: space-between;
  color: var(--text-muted); font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
}
.stat-head i{ font-size: 11px; opacity: 0.7; }
.stat-value{
  font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text); line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat-card.is-success .stat-value{ color: var(--success); }
.stat-card.is-warn .stat-value{ color: var(--warn); }
.stat-card.is-success .stat-head i{ color: var(--success); opacity: 0.85; }
.stat-card.is-warn .stat-head i{ color: var(--warn); opacity: 0.85; }

/* ============ SEARCH ============ */
.search-bar{
  position: relative;
  margin-bottom: 12px;
}
.search-bar i.search-icon{
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 13px; pointer-events: none;
}
.search-bar input{
  width: 100%;
  padding: 11px 40px 11px 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  font-size: 13.5px; font-weight: 450;
  color: var(--text);
  outline: none;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
}
.search-bar input::placeholder{ color: var(--text-faint); font-weight: 400; }
.search-bar input:focus{
  border-color: var(--accent);
  box-shadow: var(--ring), var(--shadow-sm);
}
.search-clear{
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 12px;
  transition: all 0.12s ease;
}
.search-clear:hover{ background: var(--bg-subtle); color: var(--danger); }
.search-clear.visible{ display: flex; }

/* ============ FILTER PANEL ============ */
.filter-panel{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 12px;
}
.filter-row{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.filter-group{ min-width: 0; }
.filter-label{
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 6px;
}
.filter-label .count-pill{
  font-size: 10px; font-weight: 700;
  background: var(--bg-inset); color: var(--text-secondary);
  padding: 1px 7px; border-radius: 20px;
  letter-spacing: 0; text-transform: none;
}

/* multi-select */
.ms{ position: relative; }
.ms-trigger{
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  font-size: 13px; font-weight: 500;
  color: var(--text);
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; min-height: 36px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  user-select: none;
}
.ms-trigger:hover{ border-color: var(--border-strong); background: var(--bg-subtle); }
.ms-trigger.open{ border-color: var(--accent); box-shadow: var(--ring); }
.ms-trigger .ph{ color: var(--text-faint); font-weight: 400; }
.ms-trigger .sel{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ms-trigger i.chev{ font-size: 10px; color: var(--text-muted); transition: transform 0.2s ease; }
.ms-trigger.open i.chev{ transform: rotate(180deg); }

.ms-drop{
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  max-height: 260px; overflow-y: auto;
  z-index: 200; display: none; padding: 6px;
}
.ms-drop.open{ display: block; }
.ms-search{
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 500;
  color: var(--text); outline: none;
  background: var(--bg-inset);
  transition: all 0.15s ease;
  margin-bottom: 4px;
}
.ms-search:focus{ border-color: var(--accent); background: white; box-shadow: var(--ring); }
.ms-search::placeholder{ color: var(--text-faint); font-weight: 400; }

.ms-opt{
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 500; color: var(--text);
  cursor: pointer; transition: background 0.12s ease;
  word-break: break-word;
}
.ms-opt:hover{ background: var(--bg-subtle); }
.ms-opt.selected{ background: var(--accent-soft); color: var(--accent); }
.ms-opt .check{
  width: 15px; height: 15px; border-radius: 4px;
  border: 1.5px solid var(--border-strong); background: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.12s ease;
}
.ms-opt .check i{ font-size: 8px; color: white; opacity: 0; transition: opacity 0.12s ease; }
.ms-opt.selected .check{ background: var(--accent); border-color: var(--accent); }
.ms-opt.selected .check i{ opacity: 1; }

.ms-actions{
  display: flex; gap: 6px;
  padding: 6px 4px 2px;
  border-top: 1px solid var(--border-subtle);
  margin-top: 4px;
}
.ms-actions button{
  flex: 1; padding: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  transition: all 0.12s ease;
}
.ms-actions button:hover{
  background: var(--bg-subtle);
  border-color: var(--border-strong);
  color: var(--text);
}

/* status row */
.filter-foot{
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding-top: 12px; border-top: 1px solid var(--border-subtle);
}
.segmented{
  display: inline-flex;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
  gap: 2px;
}
.seg-btn{
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  border-radius: 7px;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  user-select: none;
}
.seg-btn i{ font-size: 10px; }
.seg-btn:hover{ color: var(--text); }
.seg-btn.active{
  background: var(--bg-elevated);
  color: var(--text);
  box-shadow: var(--shadow-xs);
}
.seg-btn.active[data-status="covered"]{ color: var(--success); }
.seg-btn.active[data-status="pending"]{ color: var(--warn); }

.btn-reset{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.15s ease;
}
.btn-reset:hover{
  border-color: var(--danger-border);
  color: var(--danger);
  background: var(--danger-soft);
}
.btn-reset i{ font-size: 10px; transition: transform 0.4s ease; }
.btn-reset:hover i{ transform: rotate(-180deg); }

/* ============ RESULTS META ============ */
.results-meta{
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px 12px;
  font-size: 12px; color: var(--text-muted); font-weight: 500;
}
.results-meta .count-strong{ color: var(--text); font-weight: 700; }

/* ============ CARDS ============ */
.cards{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}

.card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-xs);
  transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
  min-width: 0;
}
.card::before{
  content:''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--border-strong);
  transition: background 0.2s ease;
}
.card.is-covered::before{ background: var(--success); }
.card.is-pending::before{ background: var(--warn); }
.card.is-pending{ cursor: pointer; }
.card:hover{
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.card.is-pending:hover{
  background: linear-gradient(180deg, #ffffff 0%, #fffbf6 100%);
}

.card-top{
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.card-title-block{ min-width: 0; flex: 1; }
.card-srno{
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-inset);
  padding: 2px 7px; border-radius: 5px;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.card-title{
  font-size: 15.5px; font-weight: 700;
  color: var(--text); letter-spacing: -0.015em;
  line-height: 1.3;
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 0.15s ease;
  word-break: break-word;
}
.card-title:hover{ color: var(--accent); }
.card-title i{
  font-size: 10px; opacity: 0; 
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.card-title:hover i{ opacity: 0.7; transform: translateX(2px); }

.card-badges{
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 4px; flex-shrink: 0; max-width: 45%;
}
.badge{
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px;
  letter-spacing: 0.01em; white-space: nowrap;
  border: 1px solid transparent;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.badge-job{
  background: var(--accent-soft); color: var(--accent);
  border-color: var(--accent-border);
}
.badge-date{
  background: transparent; color: var(--text-faint);
  font-weight: 500; padding: 0;
}
.badge-date i{ font-size: 9px; margin-right: 1px; }

.card-meta{
  display: flex; flex-direction: column; gap: 6px;
  font-size: 12.5px;
}
.meta-line{
  display: flex; align-items: center; gap: 6px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.meta-line i{ font-size: 11px; color: var(--text-faint); width: 14px; text-align: center; flex-shrink: 0; }
.meta-line .value{ font-weight: 500; word-break: break-word; }
.meta-line .value.strong{ color: var(--text); font-weight: 600; }
.count-chip{
  font-size: 10px; font-weight: 700;
  background: var(--bg-inset); color: var(--text-secondary);
  padding: 1px 6px; border-radius: 20px;
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
}

.card-foot{
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.coverage{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--text-muted);
}
.coverage-bar{
  width: 44px; height: 5px;
  background: var(--bg-inset);
  border-radius: 3px; overflow: hidden;
  position: relative;
}
.coverage-fill{
  height: 100%; border-radius: 3px;
  background: var(--warn);
  transition: width 0.4s ease, background 0.2s ease;
}
.coverage-fill.mid{ background: var(--accent); }
.coverage-fill.full{ background: var(--success); }
.coverage-pct{
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  font-size: 11px;
}

.card-actions{
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; justify-content: flex-end;
}
.action{
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600;
  padding: 5px 10px; border-radius: var(--radius-sm);
  transition: all 0.15s ease;
  white-space: nowrap;
  border: 1px solid transparent;
  text-decoration: none;
  letter-spacing: -0.005em;
}
.action i{ font-size: 10px; }

.action-read{
  background: var(--bg-inset); color: var(--text-secondary);
  border-color: var(--border);
}
.action-read:hover{
  background: var(--text); color: white;
  border-color: var(--text);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.action-done{
  background: var(--success-soft); color: var(--success);
  border-color: var(--success-border);
}
.action-done:hover{
  background: var(--success); color: white;
  border-color: var(--success);
  transform: translateY(-1px);
  box-shadow: 0 4px 10px -2px rgba(13,148,136,0.35);
}

.action-pending{
  background: var(--warn-soft); color: var(--warn);
  border-color: var(--warn-border);
}
.action-pending:hover{
  background: var(--warn); color: white;
  border-color: var(--warn);
  transform: translateY(-1px);
  box-shadow: 0 4px 10px -2px rgba(194,65,12,0.35);
}

.action-sol{
  background: var(--bg-elevated); color: var(--text-secondary);
  border-color: var(--border);
  max-width: 130px;
}
.action-sol:hover{
  border-color: var(--border-strong);
  color: var(--text);
  background: var(--bg-subtle);
}
.action-sol .label{
  overflow: hidden; text-overflow: ellipsis;
  max-width: 88px;
}

/* ============ STATE MESSAGES ============ */
.state{
  grid-column: 1 / -1;
  padding: 56px 24px; text-align: center;
  background: var(--bg-elevated);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--text-secondary);
  font-size: 13px;
}
.state i.big{
  font-size: 26px; color: var(--text-faint);
  margin-bottom: 10px; display: block;
}
.state .state-title{ font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: 14px; }
.state .state-sub{ font-size: 12px; color: var(--text-muted); }

/* skeleton */
.skeleton-card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.sk-line{
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--bg-inset) 25%, #e8ecf1 50%, var(--bg-inset) 75%);
  background-size: 200% 100%;
  animation: sk 1.4s ease-in-out infinite;
}

(function(){
'use strict';

/* ============================================================

============================================================ */

const GID = '0';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const EXPECTED_COLUMNS = 9;

const LS_DATA_KEY = 'tracker_data_v2';
const LS_FILTERS_KEY = 'tracker_filters_v2';
const LS_SCROLL_KEY = 'tracker_scroll_v2';
const LS_TS_KEY = 'tracker_ts_v2';

/* ============================================================
   DOM
============================================================ */
const $ = id => document.getElementById(id);

const cardsContainer = $('cardsContainer');
const statTotal = $('statTotal');
const statCovered = $('statCovered');
const statPending = $('statPending');
const statSubjects = $('statSubjects');
const cbCovered = $('cbCovered');
const cbPending = $('cbPending');

const toastMessage = $('toastMessage');

const brandTitle = $('brandTitle');

/* ============================================================
   STATE

let filteredData = [];
let selectedSubjects = new Set();
let selectedTopics = new Set();
let selectedJobs = new Set();
let selectedStatuses = new Set(['covered', 'pending']);
let globalSearchTerm = '';

let subjectCounts = {};
let mainTopicCounts = {};
let subjectCoverageScoped = {};

let toastTimer = null;
let lastToastTime = 0;

let rebuildTopicSelect = null;

/* ============================================================
   PERSISTENCE
============================================================ */
function saveFiltersToStorage(){
  try{
    localStorage.setItem(LS_FILTERS_KEY, JSON.stringify({
      subjects: Array.from(selectedSubjects),
      topics: Array.from(selectedTopics),
      jobs: Array.from(selectedJobs),
      statuses: Array.from(selectedStatuses),
      search: globalSearchTerm
    }));
  }catch(e){ console.warn('saveFilters failed', e); }
}

function loadFiltersFromStorage(){
  try{
    const raw = localStorage.getItem(LS_FILTERS_KEY);
    if(!raw) return false;
    const p = JSON.parse(raw);
    if(Array.isArray(p.subjects)) selectedSubjects = new Set(p.subjects);
    if(Array.isArray(p.topics)) selectedTopics = new Set(p.topics);
    if(Array.isArray(p.jobs)) selectedJobs = new Set(p.jobs);
    if(Array.isArray(p.statuses) && p.statuses.length) selectedStatuses = new Set(p.statuses);
    if(typeof p.search === 'string') globalSearchTerm = p.search;
    return true;
  }catch(e){ console.warn('loadFilters failed', e); return false; }
}

function saveDataToStorage(data){
  try{
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(data));
    localStorage.setItem(LS_TS_KEY, String(Date.now()));
  }catch(e){ console.warn('saveData failed', e); }
}

function loadDataFromStorage(){
  try{
    const raw = localStorage.getItem(LS_DATA_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(Array.isArray(p) && p.length) return p;
    return null;
  }catch(e){ return null; }
}

function saveScrollPosition(){

}

  try{ localStorage.removeItem(LS_DATA_KEY); localStorage.removeItem(LS_TS_KEY); }catch(e){}
}

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(unsafe){
  if(unsafe === null || unsafe === undefined) return '';
  return String(unsafe)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function extractFileName(url){
  if(!url || url === '#') return 'sol';
  try{
    let clean = url.split('#')[0].split('?')[0];
    const parts = clean.split('/');
    let last = parts[parts.length-1] || '';
    try{ last = decodeURIComponent(last); }catch(e){}
    if(!last || (last.indexOf('.') === -1 && !/\w/.test(last))) return 'sol';
    if(last.length > 24) last = last.slice(0,21) + '…';
    return last || 'sol';
  }catch(e){ return 'sol'; }
}

function buildJobScopeKey(jobsSet){
  if(!jobsSet || jobsSet.size === 0) return 'ALL';
  return 'JOB::' + Array.from(jobsSet).sort().join('|');
}
function scopedCoverageKey(subject, jobScopeKey){
  return subject + '||' + jobScopeKey;
}

/* ============================================================
   SEARCH MATCH
============================================================ */
function matchesGlobalSearch(item, term){
  if(!term || term.trim() === '') return true;
  const q = term.toLowerCase().trim();
  const fields = [
    String(item.srno), String(item.subject), String(item.marks),
    String(item.mainTopic), String(item.subTopic), String(item.displayTopic),
    String(item.job), String(item.lastUpdate),
    String(item.markdownNotes).substring(0,500),
    String(item.url), String(item.solFileName)
  ];
  return fields.some(f => f.toLowerCase().includes(q));
}

/* ============================================================
   FILTER REFRESH (batched)
============================================================ */
function scheduleFastFilterRefresh(){
  if(filterRefreshScheduled) return;
  filterRefreshScheduled = true;
  requestAnimationFrame(() => {
    filterRefreshScheduled = false;
    refreshAllFilters();
    applyFiltersAndRender();
    saveFiltersToStorage();
  });
}

/* ============================================================
   CSV PARSER
============================================================ */
function parseCSV(csvText){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<csvText.length;i++){
    const c = csvText[i], n = csvText[i+1];
    if(c === '"'){
      if(inQuotes && n === '"'){ field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if(c === ',' && !inQuotes){
      row.push(field); field = '';
    } else if((c === '\n' || c === '\r') && !inQuotes){
      if(c === '\r' && n === '\n') i++;
      row.push(field);
      if(row.length > 1 || (row.length === 1 && row[0].trim() !== '')) rows.push(row);
      row = []; field = '';
    } else field += c;
  }
  if(field !== '' || row.length){
    row.push(field);
    if(row.length > 1 || (row.length === 1 && row[0].trim() !== '')) rows.push(row);
  }
  return rows;
}

function looksLikeMarkdown(text){
  if(!text) return false;
  const t = text.trim();
  if(t.length < 15) return false;
  if(t === '—' || t === '-' || t === 'N/A' || t === 'na' || t === 'NA') return false;
  if(/^https?:\/\/\S+$/.test(t)) return false;
  let signals = 0;
  if(/^#{1,6}\s/m.test(t)) signals++;
  if(/\*\*[^*]+\*\*/.test(t)) signals++;
  if(/^\s*[-*+]\s+/m.test(t)) signals++;
  if(/^\s*\d+\.\s+/m.test(t)) signals++;
  if(/^\s*\|.*\|\s*$/m.test(t)) signals++;
  if(/```/.test(t)) signals++;
  if(/^\s*>\s/m.test(t)) signals++;
  if(/\[[^\]]+\]\([^)]+\)/.test(t)) signals++;
  return signals >= 2 || (signals >= 1 && t.length > 100);
}

function mapRowsToObjects(rows){
  if(!rows.length) return [];
  const dataRows = rows.slice(1);
  const out = [];
  const padded = dataRows.map(r => {
    const c = r.slice();
    while(c.length < EXPECTED_COLUMNS) c.push('');
    return c;
  });
  for(const row of padded){
    if(row.length < 3) continue;
    const srno = (row[0]||'').trim();
    const subjectWithMarks = (row[1]||'').trim();
    const mainTopic = (row[2]||'').trim();
    const subTopic = (row[3]||'').trim();
    const job = (row[4]||'').trim();
    const url = (row[5]||'').trim();
    const solUrl = (row[6]||'').trim();
    const lastUpdate = (row[7]||'').trim();
    const markdownNotes = (row[8]||'').trim();

    let subject = subjectWithMarks, marks = '';
    const m = subjectWithMarks.match(/;\s*(\d+)\s*$/);
    if(m){ marks = m[1]; subject = subjectWithMarks.replace(/;\s*\d+\s*$/,'').trim(); }

    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
    const hasSol = solUrl && solUrl !== '#' && solUrl !== '—' && solUrl.trim() !== '';
    const hasMarkdown = looksLikeMarkdown(markdownNotes);
    const status = (hasUrl || hasSol || hasMarkdown) ? 'covered' : 'pending';
    const displayTopic = subTopic || mainTopic;

    out.push({
      srno: srno || '—',
      subject: subject || '—',
      marks: marks || '—',
      mainTopic: mainTopic || '—',
      subTopic: subTopic || '—',
      displayTopic: displayTopic || '—',
      url: hasUrl ? url : '#',
      hasUrl,
      solUrl: hasSol ? solUrl : '',
      hasSol,
      solFileName: hasSol ? extractFileName(solUrl) : '',
      markdownNotes: hasMarkdown ? markdownNotes : '',
      hasMarkdown,
      status,
      job: job || '—',
      lastUpdate: lastUpdate || ''
    });
  }
  return out;
}

/* ============================================================
   COUNTS
============================================================ */
function computeCounts(data){
  subjectCounts = {};
  mainTopicCounts = {};
  subjectCoverageScoped = {};

  const allJobs = new Set();

  data.forEach(item => {
    if(item.subject && item.subject !== '—') subjectCounts[item.subject] = (subjectCounts[item.subject]||0) + 1;
    if(item.mainTopic && item.mainTopic !== '—') mainTopicCounts[item.mainTopic] = (mainTopicCounts[item.mainTopic]||0) + 1;
    if(item.job && item.job !== '—') allJobs.add(item.job);
  });

  const scopes = ['ALL'];
  allJobs.forEach(j => scopes.push('JOB::' + j));

  scopes.forEach(scopeKey => {
    data.forEach(item => {
      if(!item.subject || item.subject === '—') return;
      if(scopeKey !== 'ALL'){
        const jobName = scopeKey.slice(5);
        if(item.job !== jobName) return;
      }
      const key = scopedCoverageKey(item.subject, scopeKey);
      if(!subjectCoverageScoped[key]) subjectCoverageScoped[key] = { total:0, done:0 };
      subjectCoverageScoped[key].total++;
      if(item.status === 'covered') subjectCoverageScoped[key].done++;
    });
  });
}

function getSubjectCoveragePctForScope(subject, jobsSet){
  if(!subject || subject === '—') return 0;
  if(!jobsSet || jobsSet.size <= 1){
    const scopeKey = buildJobScopeKey(jobsSet);
    const c = subjectCoverageScoped[scopedCoverageKey(subject, scopeKey)];
    if(!c || c.total === 0) return 0;
    return Math.round((c.done / c.total) * 100);
  }
  let total = 0, done = 0;
  rawData.forEach(item => {
    if(item.subject !== subject) return;
    if(!jobsSet.has(item.job)) return;
    total++;
    if(item.status === 'covered') done++;
  });
  if(total === 0) return 0;
  return Math.round((done / total) * 100);
}

function getSubjectCountForScope(subject, jobsSet){
  if(!subject || subject === '—') return 0;
  if(!jobsSet || jobsSet.size === 0) return subjectCounts[subject] || 0;
  let count = 0;
  rawData.forEach(item => {
    if(item.subject === subject && jobsSet.has(item.job)) count++;
  });
  return count;
}

function updateStats(data){
  statTotal.textContent = data.length;
  statCovered.textContent = data.filter(d => d.status === 'covered').length;
  statPending.textContent = data.filter(d => d.status === 'pending').length;
  statSubjects.textContent = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;
}

/* ============================================================
   AVAILABLE OPTIONS (cross-filter aware)
============================================================ */
function getAvailableOptions(excludeFilter){
  const applySubjects = excludeFilter === 'subject' ? new Set() : selectedSubjects;
  const applyTopics   = excludeFilter === 'topic'   ? new Set() : selectedTopics;
  const applyJobs     = excludeFilter === 'job'     ? new Set() : selectedJobs;

  const subjects = new Set(), topics = new Set(), jobs = new Set();

  rawData.forEach(item => {
    if(selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return;
    if(!matchesGlobalSearch(item, globalSearchTerm)) return;
    if(applySubjects.size > 0 && !applySubjects.has(item.subject)) return;
    if(applyTopics.size > 0 && !applyTopics.has(item.displayTopic)) return;
    if(applyJobs.size > 0 && !applyJobs.has(item.job)) return;

    if(excludeFilter === 'subject'){
      if(selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return;
      if(item.subject && item.subject !== '—') subjects.add(item.subject);
    } else if(excludeFilter === 'topic'){
      if(selectedTopics.size > 0 && !selectedTopics.has(item.displayTopic)) return;
      if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
    } else if(excludeFilter === 'job'){
      if(selectedJobs.size > 0 && !selectedJobs.has(item.job)) return;
      if(item.job && item.job !== '—') jobs.add(item.job);
    } else {
      if(item.subject && item.subject !== '—') subjects.add(item.subject);
      if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
      if(item.job && item.job !== '—') jobs.add(item.job);
    }
  });

  return {
    subjects: Array.from(subjects).sort(),
    topics: Array.from(topics).sort(),
    jobs: Array.from(jobs).sort()
  };
}

function pruneSelections(){
  const a = getAvailableOptions('none');
  Array.from(selectedSubjects).forEach(s => { if(!a.subjects.includes(s)) selectedSubjects.delete(s); });
  Array.from(selectedTopics).forEach(t => { if(!a.topics.includes(t)) selectedTopics.delete(t); });
  Array.from(selectedJobs).forEach(j => { if(!a.jobs.includes(j)) selectedJobs.delete(j); });
}

/* ============================================================
   MULTI-SELECT
============================================================ */
function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch){
  const dropdown = container.querySelector('.ms-drop');
  const trigger = container.querySelector('.ms-trigger');
  const placeholder = container.querySelector('.ph');

  function closeDropdown(){
    dropdown.classList.remove('open');
    trigger.classList.remove('open');
  }

  if(!trigger.dataset.listenerAttached){
    trigger.dataset.listenerAttached = '1';
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.ms-drop.open').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.ms-trigger.open').forEach(t => t.classList.remove('open'));
      if(!isOpen){
        dropdown.classList.add('open');
        trigger.classList.add('open');
        const latest = container._latestRebuild;
        if(latest && latest._render){
          const si = dropdown.querySelector('.ms-search');
          if(si){ si.value = ''; setTimeout(() => si.focus(), 50); }
          latest._render('');
        }
      }
    });
    document.addEventListener('click', (e) => {
      if(!container.contains(e.target)) closeDropdown();
    });
  }

  function rebuild(newOptions){
    dropdown.innerHTML = '';
    let searchInput = null;
    if(enableSearch){
      searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.className = 'ms-search';
      searchInput.placeholder = 'Search…';
      searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
      searchInput.addEventListener('click', (e) => e.stopPropagation());
      dropdown.appendChild(searchInput);
    }

    const actions = document.createElement('div');
    actions.className = 'ms-actions';
    const btnAll = document.createElement('button');
    btnAll.textContent = 'Select all';
    btnAll.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = newOptions.filter(opt => {
        if(!searchInput || !searchInput.value) return true;
        return opt.label.toLowerCase().includes(searchInput.value.toLowerCase());
      });
      visible.forEach(opt => selectedSet.add(opt.value));
      onUpdate(); updateTriggerText();
      renderDropdown(searchInput ? searchInput.value : '');
    });
    const btnClear = document.createElement('button');
    btnClear.textContent = 'Clear';
    btnClear.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedSet.clear();
      onUpdate(); updateTriggerText();
      renderDropdown(searchInput ? searchInput.value : '');
    });
    actions.appendChild(btnAll);
    actions.appendChild(btnClear);
    dropdown.appendChild(actions);

    function renderDropdown(filterText){
      dropdown.querySelectorAll('.ms-opt').forEach(el => el.remove());
      let filtered = newOptions;
      if(filterText && filterText.trim()){
        const q = filterText.toLowerCase().trim();
        filtered = newOptions.filter(opt => opt.label.toLowerCase().includes(q));
      }
      if(filtered.length === 0){
        const empty = document.createElement('div');
        empty.className = 'ms-opt';
        empty.style.opacity = '0.5';
        empty.style.cursor = 'default';
        empty.textContent = 'No matches';
        dropdown.appendChild(empty);
        return;
      }
      filtered.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'ms-opt' + (selectedSet.has(opt.value) ? ' selected' : '');
        div.innerHTML = `<span class="check"><i class="fas fa-check"></i></span><span>${escapeHtml(opt.label)}</span>`;
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          if(selectedSet.has(opt.value)) selectedSet.delete(opt.value);
          else selectedSet.add(opt.value);
          onUpdate();
          updateTriggerText();
          closeDropdown();
        });
        dropdown.appendChild(div);
      });
    }

    function updateTriggerText(){
      if(selectedSet.size === 0){
        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
        placeholder.style.display = 'inline';
        const ex = trigger.querySelector('.sel');
        if(ex) ex.remove();
      } else {
        placeholder.style.display = 'none';
        let sel = trigger.querySelector('.sel');
        if(!sel){
          sel = document.createElement('span');
          sel.className = 'sel';
          trigger.insertBefore(sel, trigger.querySelector('.chev'));
        }
        sel.textContent = `${selectedSet.size} selected`;
        sel.style.display = 'inline';
      }
    }

    rebuild._render = renderDropdown;
    rebuild._updateText = updateTriggerText;
    container._latestRebuild = rebuild;
    renderDropdown('');
    updateTriggerText();
  }

  rebuild(options);
  return rebuild;
}

function buildGoogleSearchQuery(item){
  const parts = [];
  if(item.subTopic && item.subTopic !== '—') parts.push(item.subTopic);
  if(item.mainTopic && item.mainTopic !== '—') parts.push(item.mainTopic);
  if(item.subject && item.subject !== '—') parts.push(item.subject);
  if(item.job && item.job !== '—') parts.push(item.job);
  return parts.join(' ');
}

function buildPrompt(item){
  const jobTitle = (item.job && item.job !== '—') ? item.job : null;
  const fallback = (item.mainTopic && item.mainTopic !== '—') ? item.mainTopic : 'this topic';
  const title = jobTitle || fallback;
  return `Prepare me on ${item.subTopic} 20 mcqs with detail solution for ${title} exam.

It should be:
Srno
Mcq question
Choices
Detail solution
Correct answer as per choices`;
}

function copyPrompt(item){
  const text = buildPrompt(item);
  if(fallbackCopy(text)){
    showToast(`Copied prompt: ${item.subTopic}`);
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(`Copied prompt: ${item.subTopic}`))
      .catch(() => showToast('Copy failed'));
  } else showToast('Copy failed');
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.opacity = '0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);
  let ok = false;
  try{ ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); }
  catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function showToast(msg){
  const now = Date.now();
  toastMessage.textContent = msg;
  toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
  lastToastTime = now;
}

/* ============================================================
   MARKDOWN RENDERER
============================================================ */
function renderMarkdown(md){
  if(!md) return '';
  let html = md.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const codeBlocks = [];
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(code);
    return `\u0000CODE${i}\u0000`;
  });

  const lines = html.split('\n');
  const out = [];
  let inTable = false, inList = false, listType = null, inQuote = false;

  const closeList = () => { if(inList){ out.push(listType === 'ol' ? '</ol>' : '</ul>'); inList = false; listType = null; } };
  const closeTable = () => { if(inTable){ out.push('</tbody></table>'); inTable = false; } };
  const closeQuote = () => { if(inQuote){ out.push('</blockquote>'); inQuote = false; } };

  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    const cbMatch = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if(cbMatch){
      closeList(); closeTable(); closeQuote();
      const code = codeBlocks[parseInt(cbMatch[1],10)];
      out.push(`<pre><code>${code}</code></pre>`);
      continue;
    }

    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
    const next = lines[i+1] || '';
    const isSep = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(next);

    if(isTableRow && isSep && !inTable){
      closeList(); closeQuote();
      inTable = true;
      out.push('<table><thead>');
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c => `<th>${inline(c.trim())}</th>`).join('') + '</tr>');
      out.push('</thead><tbody>');
      i++;
      continue;
    }
    if(inTable && isTableRow){
      const cells = parseRow(line);
      out.push('<tr>' + cells.map(c => `<td>${inline(c.trim())}</td>`).join('') + '</tr>');
      continue;
    }
    if(inTable && !isTableRow) closeTable();

    if(/^\s*>\s?/.test(line)){
      if(!inQuote){ closeList(); out.push('<blockquote>'); inQuote = true; }
      out.push(inline(line.replace(/^\s*>\s?/,'')));
      continue;
    } else if(inQuote) closeQuote();

    const h1 = line.match(/^#\s+(.*)$/);
    const h2 = line.match(/^##\s+(.*)$/);
    const h3 = line.match(/^###\s+(.*)$/);
    const h4 = line.match(/^####\s+(.*)$/);
    if(h1){ closeList(); closeTable(); closeQuote(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }
    if(h2){ closeList(); closeTable(); closeQuote(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }
    if(h3){ closeList(); closeTable(); closeQuote(); out.push(`<h3>${inline(h3[1])}</h3>`); continue; }
    if(h4){ closeList(); closeTable(); closeQuote(); out.push(`<h4>${inline(h4[1])}</h4>`); continue; }

    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){
      closeList(); closeTable(); closeQuote();
      out.push('<hr>');
      continue;
    }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){
      closeTable(); closeQuote();
      if(!inList || listType !== 'ul'){ closeList(); out.push('<ul>'); inList = true; listType = 'ul'; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){
      closeTable(); closeQuote();
      if(!inList || listType !== 'ol'){ closeList(); out.push('<ol>'); inList = true; listType = 'ol'; }
      out.push(`<li>${inline(ol[1])}</li>`);
      continue;
    }

    if(line.trim() === ''){ closeList(); closeTable(); closeQuote(); continue; }

    closeList(); closeTable(); closeQuote();
    out.push(`<p>${inline(line)}</p>`);
  }

  closeList(); closeTable(); closeQuote();
  return out.join('\n');
}

function parseRow(line){
  let t = line.trim();
  if(t.startsWith('|')) t = t.slice(1);
  if(t.endsWith('|')) t = t.slice(0,-1);
  return t.split('|');
}

function inline(text){
  if(!text) return '';
  let s = text;
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

  modalSubtitle.textContent = parts.join('  ·  ');

  modalBody.innerHTML = renderMarkdown(item.markdownNotes);
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalBody.scrollTop = 0;
}

function closeNotesModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  currentModalMarkdown = '';
}

modalCloseBtn.addEventListener('click', closeNotesModal);
modalCloseBtn2.addEventListener('click', closeNotesModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeNotesModal(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && modalOverlay.classList.contains('open')) closeNotesModal();
});

modalCopyBtn.addEventListener('click', () => {
  if(!currentModalMarkdown) return;
  if(fallbackCopy(currentModalMarkdown)){ showToast('Notes copied'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentModalMarkdown)
      .then(() => showToast('Notes copied'))
      .catch(() => showToast('Copy failed'));
  } else showToast('Copy failed');
});

/* ============================================================
   CARD RENDER
============================================================ */
function renderCards(data){
  if(!data.length){
    cardsContainer.innerHTML = `
      <div class="state">
        <i class="fas fa-magnifying-glass big"></i>
        <div class="state-title">No matching topics</div>
        <div class="state-sub">Try adjusting filters or search query</div>
      </div>`;
    return;
  }

  const showJobBadge = selectedJobs.size === 0;
  const frag = document.createDocumentFragment();

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = `card ${item.status === 'covered' ? 'is-covered' : 'is-pending'}`;

    if(item.status === 'pending'){
      card.title = 'Click to copy DeepSeek prompt';
      card.addEventListener('click', (e) => {
        if(e.target.closest('a,button')) return;
        copyPrompt(item);
      });
    }

    /* TOP: srno + title + badges */
    const top = document.createElement('div');
    top.className = 'card-top';

    const titleBlock = document.createElement('div');
    titleBlock.className = 'card-title-block';

    const srno = document.createElement('div');
    srno.className = 'card-srno';
    srno.textContent = `#${item.srno}`;
    titleBlock.appendChild(srno);

    const titleLink = document.createElement('a');
    titleLink.className = 'card-title';
    titleLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
    titleLink.target = '_blank';
    titleLink.rel = 'noopener noreferrer';
    titleLink.title = 'Search: ' + buildGoogleSearchQuery(item);
    titleLink.innerHTML = `${escapeHtml(item.subTopic !== '—' ? item.subTopic : '—')} <i class="fas fa-arrow-up-right-from-square"></i>`;
    titleLink.addEventListener('click', (e) => e.stopPropagation());
    titleBlock.appendChild(titleLink);
    top.appendChild(titleBlock);

    const badges = document.createElement('div');
    badges.className = 'card-badges';
    if(showJobBadge && item.job && item.job !== '—'){
      const b = document.createElement('span');
      b.className = 'badge badge-job';
      b.textContent = item.job;
      b.title = 'Job: ' + item.job;
      badges.appendChild(b);
    }
    if(item.lastUpdate){
      const d = document.createElement('span');
      d.className = 'badge badge-date';
      d.innerHTML = `<i class="fas fa-clock"></i>${escapeHtml(item.lastUpdate)}`;
      d.title = 'Last update';
      badges.appendChild(d);
    }
    if(badges.children.length) top.appendChild(badges);
    card.appendChild(top);

    /* META: main topic */
    const meta = document.createElement('div');
    meta.className = 'card-meta';

    const mainLine = document.createElement('div');
    mainLine.className = 'meta-line';
    const mainCount = mainTopicCounts[item.mainTopic] || 1;
    mainLine.innerHTML = `
      <i class="fas fa-folder"></i>
      <span class="value strong">${escapeHtml(item.mainTopic)}</span>
      <span class="count-chip">${mainCount}</span>
    `;
    meta.appendChild(mainLine);

    /* subject + coverage */
    const subjLine = document.createElement('div');
    subjLine.className = 'meta-line';
    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);
    subjLine.innerHTML = `
      <i class="fas fa-book"></i>
      <span class="value">${escapeHtml(item.subject)}</span>
      <span class="count-chip">${subjCount}</span>
    `;
    meta.appendChild(subjLine);

    card.appendChild(meta);

    /* FOOT: coverage bar + actions */
    const foot = document.createElement('div');
    foot.className = 'card-foot';

    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
    const covCls = covPct === 100 ? 'full' : (covPct >= 50 ? 'mid' : '');
    const coverage = document.createElement('div');
    coverage.className = 'coverage';
    coverage.title = `Subject coverage${selectedJobs.size ? ' for selected job(s)' : ''}: ${covPct}%`;
    coverage.innerHTML = `
      <span class="coverage-bar"><span class="coverage-fill ${covCls}" style="width:${covPct}%"></span></span>
      <span class="coverage-pct">${covPct}%</span>
    `;
    foot.appendChild(coverage);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    if(item.hasMarkdown){
      const readBtn = document.createElement('button');
      readBtn.type = 'button';
      readBtn.className = 'action action-read';
      readBtn.title = `Read notes for "${item.subTopic}"`;
      readBtn.innerHTML = `<i class="fas fa-book-open"></i> Read`;
      readBtn.addEventListener('click', (e) => { e.stopPropagation(); openNotesModal(item); });
      actions.appendChild(readBtn);
    }

    if(item.hasUrl){
      const a = document.createElement('a');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'action action-done';
      a.title = 'Open complete chat';
      a.innerHTML = `<i class="fas fa-circle-check"></i> Done <i class="fas fa-arrow-up-right-from-square" style="opacity:0.7;"></i>`;
      a.addEventListener('click', (e) => e.stopPropagation());
      actions.appendChild(a);
    } else {
      const isCovered = item.status === 'covered';
      const el = document.createElement(isCovered ? 'span' : 'button');
      el.className = 'action ' + (isCovered ? 'action-done' : 'action-pending');
      el.title = isCovered ? 'Marked done (has solution / notes)' : 'Click to copy DeepSeek prompt';
      el.innerHTML = isCovered
        ? `<i class="fas fa-circle-check"></i> Done`
        : `<i class="fas fa-clock"></i> Pending <i class="fas fa-copy" style="opacity:0.7;"></i>`;
      if(!isCovered){
        el.addEventListener('click', (e) => { e.stopPropagation(); copyPrompt(item); });
      }
      actions.appendChild(el);
    }

    if(item.hasSol){
      const a = document.createElement('a');
      a.href = item.solUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'action action-sol';
      a.title = 'Open solution file: ' + item.solFileName;
      a.innerHTML = `<i class="fas fa-file-lines"></i><span class="label">${escapeHtml(item.solFileName)}</span>`;
      a.addEventListener('click', (e) => e.stopPropagation());
      actions.appendChild(a);
    }

    foot.appendChild(actions);
    card.appendChild(foot);

    frag.appendChild(card);
  });

  cardsContainer.innerHTML = '';
  cardsContainer.appendChild(frag);
}

/* ============================================================
   POPULATE FILTERS
============================================================ */
function populateFilters(data){
  const subjects = new Set(), topics = new Set(), jobs = new Set();
  data.forEach(item => {
    if(item.subject && item.subject !== '—') subjects.add(item.subject);
    if(item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
    if(item.job && item.job !== '—') jobs.add(item.job);
  });

  const subjOpts = Array.from(subjects).sort().map(s => ({ value:s, label:s }));
  const topOpts = Array.from(topics).sort().map(t => ({ value:t, label:t }));
  const jobOpts = Array.from(jobs).sort().map(j => ({ value:j, label:j }));

  const sWrap = $('subjectMultiWrap'); sWrap.dataset.type = 'subjects';
  if(!rebuildSubjectSelect) rebuildSubjectSelect = buildMultiSelect(sWrap, subjOpts, selectedSubjects, onFilterChange, true);
  else rebuildSubjectSelect(subjOpts);

  const tWrap = $('topicMultiWrap'); tWrap.dataset.type = 'topics';
  if(!rebuildTopicSelect) rebuildTopicSelect = buildMultiSelect(tWrap, topOpts, selectedTopics, onFilterChange, true);
  else rebuildTopicSelect(topOpts);

  const jWrap = $('jobMultiWrap'); jWrap.dataset.type = 'jobs';
  if(!rebuildJobSelect) rebuildJobSelect = buildMultiSelect(jWrap, jobOpts, selectedJobs, onFilterChange, true);
  else rebuildJobSelect(jobOpts);

  subjectCountHint.textContent = subjOpts.length;
  topicCountHint.textContent = topOpts.length;
  jobCountHint.textContent = jobOpts.length;
}

/* ============================================================
   SCROLL FAB
============================================================ */
function updateScrollButtons(){
  const y = window.scrollY || 0;
  const maxY = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
  if(y < 100) fabScrollTop.classList.add('hidden'); else fabScrollTop.classList.remove('hidden');
  if(maxY <= 0 || y >= maxY - 100) fabScrollBottom.classList.add('hidden'); else fabScrollBottom.classList.remove('hidden');
}

let scrollTick = false;
window.addEventListener('scroll', () => {
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    updateScrollButtons();
    saveScrollPosition();
  });
}, { passive: true });

fabScrollTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try{ localStorage.setItem(LS_SCROLL_KEY, '0'); }catch(e){}
});
fabScrollBottom.addEventListener('click', () => {
  const t = document.documentElement.scrollHeight || document.body.scrollHeight;
  window.scrollTo({ top: t, behavior: 'smooth' });
});

function restoreScrollPosition(){
  const y = getSavedScrollPosition();
  if(y > 0) requestAnimationFrame(() => window.scrollTo(0, y));
}

/* ============================================================
   LOAD / REFRESH
============================================================ */
function setRefreshLoading(loading){
  isLoading = loading;
  fabRefresh.classList.toggle('loading', loading);
}

async function fetchFreshData(){
  const bust = `&_=${Date.now()}`;
  const res = await fetch(CSV_URL + bust, { cache: 'no-store' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if(text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')){
    throw new Error('Sheet is not public. Share as "Anyone with link can view".');
  }
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('No data rows');
  const data = mapRowsToObjects(rows);
  if(!data.length) throw new Error('No parsed data');
  return data;
}

function applyDataAndRender(data, opts){
  opts = opts || {};
  rawData = data;
  computeCounts(rawData);
  populateFilters(rawData);

  if(opts.isFirstLoad){
    setupStatusSegments();
    cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
    cbPending.classList.toggle('active', selectedStatuses.has('pending'));
    refreshAllFilters();
    applyFiltersAndRender();
    restoreScrollPosition();
  } else {
    refreshAllFilters();
    applyFiltersAndRender();
  }
  requestAnimationFrame(updateScrollButtons);
}

function renderSkeletons(){
  let html = '';
  for(let i=0;i<6;i++){
    html += `<div class="skeleton-card">
      <div class="sk-line w40"></div>
      <div class="sk-line h20 w80"></div>
      <div class="sk-line w60"></div>
      <div class="sk-line w40"></div>
    </div>`;
  }
  cardsContainer.innerHTML = html;
}

async function refreshFromNetwork(opts){
  opts = opts || {};
  if(isLoading) return;
  if(opts.isManual) setRefreshLoading(true);
  else renderSkeletons();

  try{
    const fresh = await fetchFreshData();
    saveDataToStorage(fresh);
    applyDataAndRender(fresh, { isFirstLoad: opts.isFirstLoad });
    if(opts.isManual) showToast('Data refreshed');
  } catch(err){
    console.error('Fetch error:', err);
    if(opts.isManual){
      showToast('Refresh failed — check console');
    } else {
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  } finally {
    if(opts.isManual) setRefreshLoading(false);
  }
}

/* ============================================================
   SEARCH
============================================================ */
function updateSearchClearButton(){
  globalSearchClear.classList.toggle('visible', !!(globalSearchTerm && globalSearchTerm.trim()));
}

globalSearchInput.addEventListener('input', () => {
  if(globalSearchInput.value === globalSearchTerm) return;
  globalSearchTerm = globalSearchInput.value;
  updateSearchClearButton();
  scheduleFastFilterRefresh();
});

globalSearchClear.addEventListener('click', () => {
  globalSearchInput.value = '';
  globalSearchTerm = '';
  updateSearchClearButton();
  scheduleFastFilterRefresh();
  globalSearchInput.focus();
});

/* ============================================================
   INIT
============================================================ */
(async function init(){
  loadFiltersFromStorage();
  cbCovered.classList.toggle('active', selectedStatuses.has('covered'));
  cbPending.classList.toggle('active', selectedStatuses.has('pending'));
  if(globalSearchTerm) globalSearchInput.value = globalSearchTerm;
  updateSearchClearButton();

  const cached = loadDataFromStorage();
  if(cached){
    applyDataAndRender(cached, { isFirstLoad: true });
  } else {
    renderSkeletons();
    try{
      const fresh = await fetchFreshData();
      saveDataToStorage(fresh);
      applyDataAndRender(fresh, { isFirstLoad: true });
    } catch(err){
      console.error('Init fetch error:', err);
      cardsContainer.innerHTML = `
        <div class="state">
          <i class="fas fa-triangle-exclamation big" style="color:var(--warn);"></i>
          <div class="state-title">Couldn't load sheet</div>
          <div class="state-sub">${escapeHtml(err.message)}</div>
        </div>`;
    }
  }
})();

fabRefresh.addEventListener('click', () => {
  clearPersistedData();
  refreshFromNetwork({ isManual: true, isFirstLoad: false });
});

window.addEventListener('beforeunload', saveScrollPosition);

})();
</script>
